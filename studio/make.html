<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>studio · make</title>
<style>
  :root{--bg:#0f1115;--panel:#161a21;--panel2:#1c2129;--line:#272d38;--ink:#e6e9ef;
        --dim:#8b94a3;--accent:#6ea8fe;--ok:#4ec9a0;--warn:#e0b252;--bad:#e07a5f}
  @media (prefers-color-scheme:light){
    :root{--bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#dde1e8;--ink:#141821;--dim:#5d6470}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:13px 18px;
         border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:9}
  header h1{margin:0;font-size:15px;letter-spacing:.07em;text-transform:uppercase}
  header .sub{color:var(--dim);font-size:12px}
  header .right{margin-left:auto;display:flex;gap:8px}
  header a{color:var(--dim);font-size:12px;text-decoration:none;border:1px solid var(--line);
           padding:5px 10px;border-radius:6px}
  header a:hover{color:var(--ink);border-color:var(--accent)}

  .picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px;padding:18px}
  .dom{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;
       cursor:pointer;text-align:left;color:inherit;font:inherit}
  .dom:hover{border-color:var(--accent)}
  .dom.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .dom .i{font-size:22px}
  .dom .n{font-weight:600;margin-top:5px}
  .dom .d{color:var(--dim);font-size:12px;margin-top:4px}
  .dom .c{color:var(--dim);font-size:11px;margin-top:6px;font-family:ui-monospace,Menlo,monospace}

  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:1px;background:var(--line)}
  @media (max-width:980px){.wrap{grid-template-columns:1fr}}
  .main,.side{background:var(--bg);padding:18px;min-width:0}
  h2{margin:0 0 4px;font-size:19px}
  .lede{margin:0 0 16px;color:var(--dim);max-width:70ch}
  .warn{margin:0 0 16px;padding:11px 13px;border-left:3px solid var(--bad);background:var(--panel);
        border-radius:0 7px 7px 0;font-size:13px}
  .note{margin:0 0 16px;padding:10px 13px;border-left:3px solid var(--line);background:var(--panel);
        border-radius:0 7px 7px 0;color:var(--dim);font-size:13px}
  .field{margin-bottom:16px;max-width:64ch}
  .field label{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
               color:var(--dim);margin-bottom:5px}
  input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);
      color:var(--ink);border-radius:7px;padding:8px 10px;font:inherit}
  textarea{min-height:74px;resize:vertical}
  .hint{color:var(--dim);font-size:12px;margin-top:4px}
  .btn{background:var(--accent);border:0;color:#08111f;border-radius:7px;padding:9px 16px;
       cursor:pointer;font:inherit;font-weight:600}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:400}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  pre{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:11px;
      font-size:11.5px;white-space:pre-wrap;word-break:break-word;margin:0;
      font-family:ui-monospace,Menlo,monospace;max-height:230px;overflow:auto}
  .side h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .sec{margin-bottom:18px}
  audio,video,img{width:100%;border-radius:8px;margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  td:first-child{color:var(--dim);width:36%;font-family:ui-monospace,Menlo,monospace}
  .bad{color:var(--bad)} .ok{color:var(--ok)}
</style>
</head>
<body>
<header>
  <h1>make</h1><span class="sub" id="stat">loading…</span>
  <div class="right">
    <a href="/wizard">direct a scene</a><a href="/cast">cast</a>
    <a href="/tags">tags</a>
    <a href="/verify">verify</a>
    <a href="/gallery">gallery</a><a href="/">library</a>
  </div>
</header>

<div class="picker" id="picker"></div>
<div class="wrap" id="wrap" style="display:none">
  <div class="main" id="form"></div>
  <div class="side">
    <div class="sec"><h3>Result</h3><div id="result" class="hint">nothing generated yet</div></div>
    <div class="sec"><h3>Recipe</h3><table id="recipe"></table></div>
  </div>
</div>

<script>
let DOMS=[], LIB={}, CUR=null, VALS={};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function pickers(){
  $("picker").innerHTML = DOMS.map(d=>`
    <button class="dom${CUR&&CUR.id===d.id?" on":""}" data-d="${esc(d.id)}">
      <div class="i">${esc(d.icon||"◆")}</div>
      <div class="n">${esc(d.name)}</div>
      <div class="d">${esc(d.desc||"")}</div>
      <div class="c">${esc(d.cost||"")}</div>
    </button>`).join("");
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>choose(b.dataset.d));
}

function choose(id){
  CUR = DOMS.find(d=>d.id===id); VALS={};
  (CUR.fields||[]).forEach(f=>{ if(f.default!==undefined) VALS[f.key]=f.default; });
  $("wrap").style.display=""; pickers(); form();
}

function form(){
  const d=CUR;
  $("form").innerHTML = `
    <h2>${esc(d.icon||"")} ${esc(d.name)}</h2>
    <p class="lede">${esc(d.desc||"")}</p>
    ${d.warning?`<div class="warn"><b>Read this first.</b> ${esc(d.warning)}</div>`:""}
    ${d.note?`<div class="note">${esc(d.note)}</div>`:""}
    ${(d.fields||[]).map(f=>fieldHtml(f)).join("")}
    <div class="row" style="margin-top:20px">
      <button class="btn" id="go">Generate</button>
      <button class="btn ghost" id="peek">Preview workflow</button>
      <span class="hint" id="going"></span>
    </div>
    <div id="wfbox" style="display:none;margin-top:16px">
      <div class="row" style="margin-bottom:6px">
        <b style="font-size:13px">The graph this would run</b>
        <button class="btn ghost" id="wfdl" style="padding:4px 10px;font-size:12px">Download JSON</button>
        <a class="btn ghost" href="http://${location.hostname}:8188" target="_blank"
           style="padding:4px 10px;font-size:12px;text-decoration:none">Open ComfyUI</a>
      </div>
      <div class="hint" style="margin-bottom:6px">Built by the same code path that runs it,
        so this is exactly what executes. ComfyUI loads it via <em>Workflow → Load (API
        format)</em> if you want to tweak it by hand.</div>
      <pre id="wfjson" style="max-height:380px"></pre>
    </div>`;
  (d.fields||[]).forEach(f=>{
    const el=$("f-"+f.key); if(!el) return;
    el.oninput=el.onchange=()=>{ VALS[f.key]=el.value; recipe(); };
  });
  $("go").onclick=go;
  $("peek").onclick=peek;
  recipe();
}

function fieldHtml(f){
  const v=VALS[f.key]!==undefined?VALS[f.key]:"";
  let input;
  if(f.type==="library"){
    const items=LIB[f.library]||[];
    input=`<select id="f-${esc(f.key)}">
      ${f.optional?'<option value="">— none —</option>':""}
      ${items.map(i=>{
        const blocked=i.status==="blocked";
        return `<option value="${esc(i.id)}" ${blocked?"disabled":""} ${v===i.id?"selected":""}>`+
          `${esc(i.name||i.id)}${blocked?" (blocked — real person)":""}`+
          `${i.status&&i.status!=="ready"&&!blocked?" ["+esc(i.status)+"]":""}</option>`;}).join("")}
    </select>${items.length?"":'<div class="hint bad">studio/'+esc(f.library)+'/ is empty</div>'}`;
  } else if(f.type==="enum"){
    input=`<select id="f-${esc(f.key)}">${(f.values||[]).map(x=>
      `<option ${v===x?"selected":""}>${esc(x)}</option>`).join("")}</select>`;
  } else if(f.type==="textarea"){
    input=`<textarea id="f-${esc(f.key)}">${esc(v)}</textarea>`;
  } else {
    input=`<input id="f-${esc(f.key)}" type="${f.type==="number"?"number":"text"}" value="${esc(v)}">`;
  }
  return `<div class="field"><label>${esc(f.label||f.key)}${f.required?" *":""}</label>
    ${input}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:""}</div>`;
}

function recipe(){
  $("recipe").innerHTML = Object.entries(VALS).filter(([,v])=>v!=="")
    .map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")
    + `<tr><td>workflow</td><td>${esc(CUR.workflow)}</td></tr>`;
}

let WF=null;
async function peek(){
  const b=$("peek"); b.disabled=true; b.textContent="building…";
  let j;
  try{
    j=await (await fetch("/api/workflow",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({domain:CUR.id,set:VALS})})).json();
  }catch(e){ j={error:e.message}; }
  b.disabled=false; b.textContent="Preview workflow";
  const box=$("wfbox");
  if(j.error){
    box.style.display=""; $("wfjson").textContent=(j.error+"\n\n"+(j.detail||""));
    return;
  }
  WF=j.graph;
  box.style.display="";
  // resolved values first - that is the part you actually read - then the graph
  $("wfjson").textContent =
    "// workflow: "+j.workflow+"\n// resolved values:\n"+
    JSON.stringify(j.resolved,null,2)+"\n\n// graph:\n"+JSON.stringify(j.graph,null,2);
  $("wfdl").onclick=()=>{
    const blob=new Blob([JSON.stringify(WF,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=CUR.id+"_workflow_api.json"; a.click();
    URL.revokeObjectURL(a.href);
  };
}

async function go(){
  const b=$("go"), g=$("going");
  b.disabled=true; g.textContent="generating… "+(CUR.cost||"");
  let j;
  try{
    j=await (await fetch("/api/make",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({domain:CUR.id,set:VALS})})).json();
  }catch(e){ j={error:e.message}; }
  b.disabled=false; g.textContent="";
  if(j.error){
    $("result").innerHTML=`<div class="bad"><b>${esc(j.error)}</b></div>`+
      (j.detail?`<pre style="margin-top:6px">${esc(j.detail)}</pre>`:"");
    return;
  }
  const r=j.record, out=CUR.output;
  const media = out==="audio" ? `<audio controls src="${esc(r.file)}"></audio>`
    : out==="image" ? `<img src="${esc(r.file)}" alt="">`
    : `<div class="hint">${esc(r.file)} — ${(r.bytes/1048576).toFixed(1)} MB<br>
        a mesh file; open it in a 3D viewer</div>`;
  $("result").innerHTML=`<div class="ok"><b>done</b> · ${(r.bytes/1024).toFixed(0)} KB</div>${media}
    <div class="hint" style="margin-top:6px">saved to the gallery with its full recipe —
    <a href="/gallery" style="color:var(--accent)">browse</a></div>`;
  recipe();
}

(async function(){
  const [doms,lib]=await Promise.all([
    fetch("/api/domains").then(r=>r.json()).catch(()=>[]),
    fetch("/api/library").then(r=>r.json()).catch(()=>({})),
  ]);
  DOMS=doms; LIB=lib;
  $("stat").textContent=`${DOMS.length} makers · voice, music, sound, stills and 3D — `+
    `each one records the settings that made it`;
  pickers();
})();
</script>
</body>
</html>
