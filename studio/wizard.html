<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>studio · direct a scene</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --panel2:#1c2129; --line:#272d38;
    --ink:#e6e9ef; --dim:#8b94a3; --accent:#6ea8fe;
    --post:#4ec9a0; --graph:#6ea8fe; --prompt:#e0b252; --none:#e07a5f;
    /* one hue per layer. used for the band spine, the stack strip and the
       attribution highlight in the assembled prompt, so a colour always means
       the same layer wherever it appears. */
    --L-style:#a78bfa; --L-place:#34d399; --L-character:#60a5fa;
    --L-wear:#f59e0b; --L-lighting:#facc15; --L-weather:#22d3ee; --L-look:#f472b6;
    /* the style LoRA is the same layer as style, reached by a different mechanism,
       so it takes the style hue one step cooler rather than a hue of its own. */
    --L-style_lora:#c4b5fd;
    --sev-error:#ef4444; --sev-warning:#e0b252; --sev-note:#8b94a3;
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#dde1e8;--ink:#141821;--dim:#5d6470;
          --L-style:#7c3aed; --L-place:#059669; --L-character:#2563eb;
          --L-wear:#b45309; --L-lighting:#a16207; --L-weather:#0891b2; --L-look:#db2777;
          --L-style_lora:#8b5cf6;
          --sev-error:#dc2626; --sev-warning:#b45309;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:13px 18px;
         border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:15px;letter-spacing:.07em;text-transform:uppercase}
  header .sub{color:var(--dim);font-size:12px}
  header a{margin-left:auto;color:var(--dim);font-size:12px;text-decoration:none;
           border:1px solid var(--line);padding:5px 10px;border-radius:6px}
  header a:hover{color:var(--ink);border-color:var(--accent)}

  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:1px;background:var(--line);
        min-height:calc(100vh - 52px)}
  @media (max-width:980px){.wrap{grid-template-columns:1fr}}
  .main{background:var(--bg);padding:18px;min-width:0}
  .side{background:var(--bg);padding:18px;min-width:0}
  @media (min-width:981px){.side{position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}}

  .steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
  .steps button{background:none;border:1px solid var(--line);color:var(--dim);
      padding:6px 11px;border-radius:99px;cursor:pointer;font:inherit;font-size:12px}
  .steps button.on{background:var(--accent);border-color:var(--accent);color:#08111f;font-weight:600}
  .steps button.done{color:var(--post);border-color:var(--post)}

  h2{margin:0 0 4px;font-size:19px}
  .lede{margin:0 0 18px;color:var(--dim);max-width:70ch}
  .why{margin:0 0 18px;padding:10px 13px;border-left:3px solid var(--line);
       background:var(--panel);border-radius:0 7px 7px 0;color:var(--dim);font-size:13px;max-width:80ch}
  .why b{color:var(--ink)}

  .field{margin-bottom:18px;max-width:62ch}
  .field label{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
               color:var(--dim);margin-bottom:5px}
  input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);
      color:var(--ink);border-radius:7px;padding:8px 10px;font:inherit}
  textarea{min-height:72px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .hint{color:var(--dim);font-size:12px;margin-top:4px}

  .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px}
  .opt{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;
       cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit;display:flex;
       flex-direction:column}
  .opt:hover{border-color:var(--accent)}
  .opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .opt img,.opt video{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;
       background:var(--panel2);border-bottom:1px solid var(--line)}
  .opt .noimg{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;
       background:var(--panel2);color:var(--dim);font-size:11px;text-align:center;padding:0 10px;
       border-bottom:1px solid var(--line)}
  .opt .body{padding:9px 11px}
  .opt .name{font-family:ui-monospace,Menlo,monospace;font-size:13px}
  .opt .desc{color:var(--dim);font-size:12px;margin-top:3px}

  .tier{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
        padding:1px 7px;border-radius:99px;border:1px solid currentColor;margin-left:6px;
        vertical-align:middle;font-weight:600}
  .t-post{color:var(--post)} .t-graph{color:var(--graph)}
  .t-prompt{color:var(--prompt)} .t-none{color:var(--none)}
  .tierline{font-size:12px;color:var(--dim);margin:0 0 14px;max-width:80ch}

  .beats{list-style:none;margin:0 0 14px;padding:0}
  .beats li{display:flex;gap:9px;align-items:flex-start;background:var(--panel);
      border:1px solid var(--line);border-radius:8px;padding:8px 11px;margin-bottom:7px}
  .beats .g{flex:1;min-width:0}
  .beats .k{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent)}
  .beats .t{font-size:13px;word-break:break-word}
  .beats button{background:none;border:0;color:var(--none);cursor:pointer;font:inherit;padding:0 2px}

  .btn{background:var(--accent);border:0;color:#08111f;border-radius:7px;padding:8px 15px;
       cursor:pointer;font:inherit;font-weight:600}
  .btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:400}
  .btn.sm{padding:4px 10px;font-size:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .nav{display:flex;gap:8px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}

  pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;
      overflow:auto;font-size:12px;white-space:pre;margin:0;font-family:ui-monospace,Menlo,monospace}
  .side h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .side .sec{margin-bottom:20px}
  code.cmd{display:block;background:var(--panel);border:1px solid var(--line);border-radius:7px;
      padding:9px 11px;font-size:11.5px;font-family:ui-monospace,Menlo,monospace;
      overflow-x:auto;white-space:pre;margin-top:5px}
  .warn{color:var(--none);font-size:12px}
  .ok{color:var(--post);font-size:12px}

  /* ── the layer stack ───────────────────────────────────────────────────────
     The whole point of this step is that the layers are seen ACCUMULATING and
     that a conflict between two of them is visible before a single frame is
     rendered. So: a strip that shows the run of layers at a glance, then one
     inset band per layer with an elbow connector, so containment is literal. */
  .strip{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:0 0 18px}
  .strip .sl{display:flex;flex-direction:column;gap:4px;align-items:center;width:96px;
       padding:8px 4px;border:1px solid var(--line);border-top:3px solid var(--lc,var(--line));
       border-radius:9px;background:var(--panel);position:relative}
  .strip .sl.empty{background:none;border-style:dashed;opacity:.65}
  .strip .arrow{display:flex;align-items:center;color:var(--dim);padding:0 5px;font-size:15px}
  .strip .sl .th{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:5px;
       background:var(--panel2);display:block}
  .strip .sl .lab{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--lc,var(--dim));
       font-weight:700}
  .strip .sl .val{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--ink);
       text-align:center;word-break:break-word;line-height:1.3}
  .strip .sl.empty .val{color:var(--dim)}
  .strip .cut{display:flex;align-items:center;color:var(--dim);font-size:10px;padding:0 8px;
       letter-spacing:.06em;text-transform:uppercase;text-align:center;max-width:96px;line-height:1.3}

  .stack{margin:0 0 8px}
  .band{position:relative;background:var(--panel);border:1px solid var(--line);
        border-left:3px solid var(--lc,var(--line));border-radius:10px;padding:12px 14px;margin-bottom:11px}
  .band.d1{margin-left:26px} .band.d2{margin-left:52px} .band.d3{margin-left:78px}
  .band.ind::before{content:"";position:absolute;left:-16px;top:-12px;height:34px;width:15px;
        border-left:1px solid var(--line);border-bottom:1px solid var(--line);
        border-bottom-left-radius:9px;pointer-events:none}
  .band.flag-error{border-color:var(--sev-error);box-shadow:inset 0 0 0 1px var(--sev-error)}
  .band.flag-warning{border-color:var(--sev-warning)}
  .bh{display:flex;align-items:flex-start;gap:11px}
  .bh .n{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--lc,var(--dim));
        border:1px solid currentColor;border-radius:99px;width:20px;height:20px;flex:0 0 20px;
        display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:2px}
  .bh .ttl{flex:1;min-width:0}
  .bh .nm{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
        color:var(--lc,var(--ink))}
  .bh .role{color:var(--dim);font-size:12px;margin-top:1px}
  .bh .act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

  .pick{display:flex;gap:11px;align-items:flex-start;margin-top:10px;padding:9px;
        background:var(--panel2);border:1px solid var(--line);border-radius:8px}
  .pick .th{width:132px;flex:0 0 132px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;
        background:var(--bg);display:block}
  .pick .thbox{display:flex;gap:6px;flex:0 0 auto}
  .pick .thwrap{display:flex;flex-direction:column;gap:3px;align-items:center}
  .pick .thwrap .cap{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .pick .meta{flex:1;min-width:0}
  .pick .id{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;font-weight:600}
  .pick .sub{color:var(--dim);font-size:12px;margin-top:3px}
  .pick .none{color:var(--dim);font-size:12.5px;font-style:italic}

  .contrib{margin-top:9px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;
        line-height:1.5;color:var(--ink);background:var(--bg);border:1px solid var(--line);
        border-left:2px solid var(--lc,var(--line));border-radius:0 6px 6px 0;padding:7px 9px;
        word-break:break-word}
  .contrib .k{color:var(--dim);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
        display:block;margin-bottom:3px;font-family:inherit}
  .contrib.silent{color:var(--dim);font-style:italic;font-family:inherit}

  .drawer{margin-top:11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:11px}
  .drawer .fbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .drawer .fbar input[type=search]{flex:1;min-width:150px}
  .drawer .fbar select{width:auto;min-width:112px}
  .scroller{max-height:460px;overflow-y:auto;padding-right:4px}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.05em;
        text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid currentColor;
        font-weight:700}
  .c-safe{color:var(--post)} .c-replaces{color:var(--prompt)}
  .c-injects{color:var(--sev-error)} .c-inert{color:var(--dim)}
  .s-ready{color:var(--post)} .s-weak{color:var(--prompt)} .s-unavailable{color:var(--sev-error)}
  .s-partial{color:var(--prompt)}
  .e-anime{color:#c084fc} .e-qwen{color:#38bdf8} .e-either{color:var(--dim)}
  .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}

  .engbar{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;
        border:1px solid var(--line);background:var(--panel);margin:0 0 14px}
  .engbar .big{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .engbar .why2{color:var(--dim);font-size:12.5px;margin-top:2px;max-width:78ch}
  .engbar.anime{border-left:4px solid #c084fc} .engbar.qwen{border-left:4px solid #38bdf8}
  .engbar.unknown{border-left:4px solid var(--dim)}

  .conflicts{margin:0 0 16px}
  .cf{border:1px solid var(--line);border-left:4px solid var(--sv);border-radius:9px;
        background:var(--panel);padding:10px 13px;margin-bottom:8px}
  .cf.error{--sv:var(--sev-error)} .cf.warning{--sv:var(--sev-warning)} .cf.note{--sv:var(--sev-note)}
  .cf .sev{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--sv)}
  .cf .lchips{display:inline-flex;gap:5px;margin-left:8px;flex-wrap:wrap;vertical-align:middle}
  .cf .lchip{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
        padding:1px 7px;border-radius:99px;border:1px solid var(--lc);color:var(--lc)}
  .cf .msg{margin-top:5px;font-size:13.5px}
  .cf .fix{margin-top:5px;font-size:12.5px;color:var(--dim)}
  .cf .fix b{color:var(--ink)}
  .cf.error .msg{font-weight:600}
  .allclear{color:var(--post);font-size:12.5px;border:1px dashed var(--post);border-radius:8px;
        padding:8px 12px;margin:0 0 16px}

  .degraded{border:1px solid var(--sev-warning);border-left:4px solid var(--sev-warning);
        border-radius:9px;background:var(--panel);padding:11px 14px;margin:0 0 16px}
  .degraded b{color:var(--sev-warning)}
  .degraded ul{margin:6px 0 0 18px;padding:0;color:var(--dim);font-size:12.5px}

  .promptbox{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:12px 14px}
  .attr{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.85;
        word-break:break-word;white-space:pre-wrap}
  .attr span[data-l]{border-bottom:2px solid var(--lc);padding:1px 2px;border-radius:2px}
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  .legend .lg{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
        color:var(--lc);border-bottom:2px solid var(--lc);padding-bottom:1px}
  .unattr{color:var(--dim)}

  .split{display:flex;align-items:center;gap:12px;margin:20px 0 14px;color:var(--dim);font-size:11px;
        letter-spacing:.07em;text-transform:uppercase}
  .split::before,.split::after{content:"";flex:1;border-top:1px dashed var(--line)}
  .split span{text-align:center}

  .wearpick{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  .wearpick button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
        border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:12px;text-align:left;
        max-width:230px}
  .wearpick button.on{border-color:var(--L-wear);box-shadow:inset 0 0 0 1px var(--L-wear)}
  .wearpick button .lv{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--L-wear);
        font-weight:700}
  .wearpick button .tx{display:block;color:var(--dim);font-size:11px;margin-top:2px}

  .sideline{display:flex;gap:7px;align-items:baseline;margin-bottom:5px;font-size:12px}
  .sidedot{width:8px;height:8px;border-radius:99px;background:var(--lc);flex:0 0 8px}

  /* ── style LoRA slot + identity mechanism ─────────────────────────────────
     A LoRA is not prompt text, so it deliberately does NOT get the .contrib
     treatment the prompt layers get. It gets a weights strip instead. */
  .mech{margin-top:9px;border:1px solid var(--line);border-left:3px solid var(--mc,var(--line));
        border-radius:0 8px 8px 0;background:var(--bg);padding:9px 11px}
  .mech .mh{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
        font-weight:700;margin-bottom:4px}
  .mech .mv{font-size:13px}
  .mech .mv b{color:var(--mc,var(--ink))}
  .mech .mw{color:var(--dim);font-size:12.5px;margin-top:4px}
  .mech.strong{--mc:var(--post)} .mech.weak{--mc:var(--sev-warning)}
  .mech.dead{--mc:var(--sev-error)} .mech.flat{--mc:var(--dim)}

  .slrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:9px}
  .slrow input[type=range]{flex:1;min-width:150px;padding:0;background:none;border:0}
  .slrow .sv{font-family:ui-monospace,Menlo,monospace;font-size:13px;min-width:44px;text-align:right}
  .slrow .rec{font-size:11.5px;color:var(--dim)}
  .trig{margin-top:8px;font-size:12.5px}
  .trig code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;
        font-family:ui-monospace,Menlo,monospace}
  .lorarow{display:flex;gap:11px;align-items:flex-start;background:var(--panel);
        border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:7px;
        cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
  .lorarow:hover{border-color:var(--accent)}
  .lorarow.on{border-color:var(--L-style_lora);box-shadow:inset 0 0 0 1px var(--L-style_lora)}
  .lorarow.bad{opacity:.55}
  .lorarow .g{flex:1;min-width:0}
  .lorarow .fn{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-all}
  .lorarow .sb{color:var(--dim);font-size:12px;margin-top:3px}
</style>
</head>
<body>
<header>
  <h1>Direct a scene</h1>
  <span class="sub" id="stat">loading…</span>
  <span style="margin-left:auto;display:flex;gap:8px">
    <a href="/styles">styles</a><a href="/loras">loras</a>
    <a href="/cast">cast</a>
    <a href="/make">make</a>
    <a href="/tags">tags</a>
    <a href="/verify">verify</a>
    <a href="/gallery">gallery</a>
    <a href="/">library</a>
  </span>
</header>

<div class="wrap">
  <div class="main">
    <div class="steps" id="steps"></div>
    <div id="panel"></div>
    <div class="nav">
      <button class="btn ghost" id="prev">← Back</button>
      <button class="btn" id="next">Next →</button>
    </div>
  </div>

  <div class="side">
    <div class="sec">
      <h3>Layer stack</h3>
      <div id="stackside" class="hint"></div>
    </div>
    <div class="sec">
      <h3>Your .movie</h3>
      <pre id="out">…</pre>
    </div>
    <div class="sec">
      <h3>Save &amp; render</h3>
      <div class="row">
        <input id="fname" value="my-scene" style="flex:1">
        <button class="btn ghost" id="save">Save</button>
        <button class="btn" id="render">Save &amp; render →</button>
      </div>
      <div id="saved" class="hint"></div>
      <code class="cmd" id="cmd"></code>
    </div>
    <div class="sec">
      <h3>Where your choices land</h3>
      <div id="tally" class="hint"></div>
    </div>
  </div>
</div>

<script>
const S = {
  title:"MY SCENE", canvas:"1920x1080", fps:"24",
  checkpoint:"animagine-xl-4.0.safetensors", style:"modern sports anime, cel shading, cinematic",
  seed_root:"", look:"neutral", pace:"normal", cue:"", place:"", time:"",
  mood:"", camera:"static", cast:[], beats:[], scene:"my_scene", chapter:"act_one",
  emotion:"", wear:"", transition:"", template:"",
  // ── layer stack ──────────────────────────────────────────────────────────
  // style_card is a studio/styles/ CARD ID and is deliberately NOT `style`.
  // `S.style` above is the free house-tag string that compile.py reads from the
  // .movie `tags:` line. The .movie `style:` variable means the card. Two
  // different things, one word - binding them to one key would silently push a
  // card id into every prompt as literal text.
  style_card:"", engine_pick:"", lighting:"", weather:"",
  // ── the style LoRA slot ──────────────────────────────────────────────────
  // Three distinct values, because "nothing chosen" and "the author chose no
  // LoRA" are different statements and the whole point of this slot is that the
  // second one can be said out loud:
  //   ""      – unset. Whatever the style card recommends applies; if it
  //             recommends nothing, the renderer's own default stands.
  //   "none"  – the author looked and decided this film runs with no style LoRA.
  //   <file>  – that .safetensors, at S.style_strength.
  style_lora:"", style_strength:"",
};
let LIB={}, EFF={tiers:{},vars:{}}, CARDS=[], TPLS=[], step=0;
let CASTVIEWS={};                       // id -> first sample view, from /api/cast

const STEPS = [
  {id:"start",  name:"Start"},
  {id:"format", name:"Format"},
  {id:"layers", name:"Layer stack"},
  {id:"look",   name:"Look & pace"},
  {id:"world",  name:"Place & time"},
  {id:"cast",   name:"Cast"},
  {id:"shots",  name:"Shots"},
  {id:"review", name:"Review"},
];

const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ══ LAYER MODEL ═══════════════════════════════════════════════════════════
   Order and nesting are the conceptual containment the user asked to see:
   style wraps place wraps character wraps the modifiers; look sits outside the
   prompt entirely because it is an ffmpeg grade run after generation. */
const LAYERS = [
  {key:"style",     depth:0, name:"Style",
   role:"the outermost layer — it decides which model renders at all"},
  // Not a peer of place: it is the SAME layer as style, reached through the
  // weights instead of through the prompt. It is drawn indented under style and
  // never gets a .contrib block, because a LoRA contributes no prompt text.
  // noclear: the generic "clear" means "set this layer to empty", but empty here
  // means "follow the style's recommendation", which is not what a clear button
  // looks like it does. This band supplies its own reset instead.
  {key:"style_lora", depth:1, name:"Style LoRA", nocontrib:true, noclear:true,
   role:"the style applied to the model's weights instead of its prompt — the one thing that does what a style prompt cannot"},
  {key:"place",     depth:1, name:"Place",     role:"the setting the shot happens in"},
  {key:"character", depth:2, name:"Character", role:"who is in it"},
  {key:"wear",      depth:3, name:"Wear",      role:"how battered they are — damage never decreases"},
  {key:"lighting",  depth:3, name:"Lighting",  role:"where the light comes from"},
  {key:"weather",   depth:3, name:"Weather",   role:"what the air and the ground are doing"},
  {key:"look",      depth:0, name:"Look",      post:true,
   role:"an ffmpeg colour grade run on the finished frames — this is NOT prompt text"},
];
const LKEYS = LAYERS.map(l=>l.key);
const lcol = k => "var(--L-"+k+")";

// What the `compose` field on a style card means. This is the field glossary,
// printed beside the card's own value - it is not a resolution of the stack.
const COMPOSE_MEANS = {
  safe:     "Re-renders the same scene in a new idiom. Stacks cleanly with every other layer.",
  replaces: "Re-renders the scene AND overrides the setting. It will fight a place card.",
  injects:  "The noun in this style's name gets drawn as an object in frame, usually into the subject's hands.",
  inert:    "Measured as indistinguishable from no style at all.",
};
const STATUS_MEANS = {
  ready:       "rendered, looked at, and it worked",
  weak:        "rendered, and it barely changed the image",
  unavailable: "rendered, and the engine could not do it at all",
  partial:     "authored, but nothing in the render pipeline consumes it yet",
};
const WEAR_GENERIC = ["clean","sweaty","dirty and breathing hard","torn and exhausted","bloodied and spent"];

/* ══ COMPOSE ENDPOINT STATE ════════════════════════════════════════════════
   The server owns resolution. This page never re-derives it: if /api/compose
   is not answering, the live half goes dark and says so rather than guessing,
   because a second implementation of the resolver is exactly how the two would
   drift apart. */
let CSTATE="unknown";   // unknown | ok | down | error
let CDATA=null, CERR="", CDETAIL="", CTIMER=null, CSEQ=0, CLAST="", CBUSY=false;

/* ══ STYLES ════════════════════════════════════════════════════════════════ */
let STYLES=[], STYLE_CONTROL=null, STYLES_SRC="", STYLES_ERR="";

/* ══ LoRAs ═════════════════════════════════════════════════════════════════
   /api/loras is being written by someone else while this page is being
   written, so this reader is deliberately tolerant about FIELD NAMES and
   strict about MEANING. It normalises whatever arrives into the six things
   this slot actually needs — file, base, purpose, trigger, strength, note —
   and if the route is not there it says so instead of pretending the library
   is empty. Same posture as loadStyles() above. */
let LORAS=[], LORAS_SRC="", LORAS_ERR="", LORAS_RAWKEYS=[], LORAS_UNCARDED=[];

const pickf = (o, keys) => {
  for(const k of keys){
    const v = o[k];
    if(v!=null && v!=="" && !(Array.isArray(v) && !v.length)) return v;
  }
  return null;
};
const flat = v => Array.isArray(v) ? v.filter(x=>x!=null).join(", ") : (v==null?"":String(v));

// Map anything that names a base model onto the two engines this wizard knows.
// The rule this whole project is built on is that a LoRA is a delta on ONE set
// of weights: an animagine-trained LoRA does nothing on qwen and vice versa.
// So an unrecognised base is reported as unknown, never guessed into "either".
function engineOfBase(s){
  const b = String(s||"").toLowerCase();
  if(!b) return "";
  if(/animagine|illustrious|sdxl|sd_xl|sd-xl|xl-4|stable.?diffusion.?xl/.test(b)) return "anime";
  if(/qwen/.test(b)) return "qwen";
  return "";
}
function normLora(raw){
  const o = (raw && typeof raw==="object") ? raw : {file:String(raw||"")};
  const file = String(pickf(o,["file","filename","lora_name","lora","path","id","name"])||"");
  const id   = String(pickf(o,["id","file","filename","lora_name","name"])||file);
  const base = flat(pickf(o,["base","base_model","base_model_version","basemodel",
                             "checkpoint","model","arch","architecture"]));
  const declared = String(flat(pickf(o,["engine","engines","for_engine","engine_compat"]))||"")
                     .toLowerCase().trim();
  // A card that names its engine outright wins; otherwise infer from the base,
  // then from the filename, and if neither says anything, say nothing.
  let engine = ["anime","qwen","either"].includes(declared) ? declared
             : (engineOfBase(base) || engineOfBase(file));
  const purpose = String(flat(pickf(o,["kind","purpose","type","class","role","category"]))||"")
                    .toLowerCase().trim();
  // THREE trigger states, not two. The live library writes the literal string
  // "unknown" to mean "nobody has established whether this needs one", and ""
  // to mean "the card asserts it needs none". Treating "unknown" as a trigger
  // word would send this page hunting the assembled prompt for the word
  // "unknown" and reporting a missing trigger that does not exist.
  const rawTrig = flat(pickf(o,["trigger","trigger_word","trigger_phrase","triggers",
                                "token","activation","activation_text"]));
  const hasTrigKey = Object.keys(o).some(k=>/trigger|token|activation/i.test(k));
  const tl = String(rawTrig||"").trim().toLowerCase();
  const trigState = (!hasTrigKey || tl==="unknown" || tl==="?" || tl==="unclear") ? "unknown"
                  : (tl==="" || tl==="none" || tl==="n/a") ? "none" : "known";
  let strength = pickf(o,["strength","recommended_strength","default_strength",
                          "strength_default","weight","strength_model"]);
  strength = (strength==null || isNaN(parseFloat(strength))) ? null : parseFloat(strength);
  const rng = Array.isArray(o.strength_range) && o.strength_range.length===2
            ? o.strength_range.map(Number).filter(n=>!isNaN(n)) : [];
  return {
    file, id, base, engine, purpose,
    trigger: trigState==="known" ? String(rawTrig) : "",
    trig_state: trigState,
    strength,
    range: rng.length===2 ? rng : null,
    status: String(flat(pickf(o,["status","state"]))||""),
    // means is the one-line "what it is". note/verdict are the evidence behind
    // it and are long, so they are kept apart rather than collapsed into one.
    means:   flat(pickf(o,["means","desc","description","summary"])),
    note:    flat(pickf(o,["note"])),
    verdict: flat(pickf(o,["verdict"])),
    installed: o.installed !== false,
    // reverse recommendation: a LoRA card that names the styles it is for
    for_styles: (Array.isArray(o.suits_styles) ? o.suits_styles
               : Array.isArray(o.styles) ? o.styles
               : Array.isArray(o.for_styles) ? o.for_styles : []).map(String),
    raw: o,
  };
}
async function loadLoras(){
  LORAS=[]; LORAS_SRC=""; LORAS_ERR=""; LORAS_RAWKEYS=[]; LORAS_UNCARDED=[];
  let arr=null;
  try{
    const r = await fetch("/api/loras");
    if(r.status===404){ LORAS_ERR="the server has no /api/loras route yet"; }
    else{
      let j=null; try{ j=await r.json(); }catch(e){ j=null; }
      if(j===null) LORAS_ERR="the /api/loras reply was not JSON";
      else if(Array.isArray(j)) { arr=j; LORAS_SRC="/api/loras"; }
      else if(Array.isArray(j.loras)) { arr=j.loras; LORAS_SRC="/api/loras"; }
      else if(Array.isArray(j.items)) { arr=j.items; LORAS_SRC="/api/loras"; }
      else LORAS_ERR=(j&&j.error) || "the /api/loras reply had no loras array";
      // Files on disk with no card. Worth naming: an uncarded file is exactly
      // the one this page can say nothing about, so it must not be offered.
      if(j && Array.isArray(j.uncarded)) LORAS_UNCARDED=j.uncarded.map(String);
    }
  }catch(e){ LORAS_ERR=(e&&e.message)||"could not reach /api/loras"; }
  // Fallback, exactly as loadStyles() does: if the cards were added to
  // serve.py's GROUPS instead of getting their own route, they arrive on
  // /api/library and are just as usable.
  if(!arr && Array.isArray(LIB.loras) && LIB.loras.length){
    arr = LIB.loras; LORAS_SRC="/api/library"; LORAS_ERR="";
  }
  if(!arr) return;
  for(const it of arr) if(it && typeof it==="object")
    for(const k of Object.keys(it)) if(!LORAS_RAWKEYS.includes(k)) LORAS_RAWKEYS.push(k);
  LORAS = arr.map(normLora).filter(l=>l.file);
}
const loraByFile = f => f ? LORAS.find(l=>l.file===f || l.id===f) : null;

// Compatible means: this LoRA's weights are the weights the resolved engine
// will actually load. Unknown base is NOT compatible — it is unknown, and this
// page does not guess about base locks.
function loraCompatible(l, eng){
  if(!l.engine) return null;                     // unknown
  if(l.engine==="either") return true;
  return l.engine===eng;
}
// Is this a STYLE lora at all? A speedup or a character LoRA in the style slot
// is a different mistake and should not be silently offered as one.
const isStyleLora = l => !l.purpose || l.purpose==="style";

const OPEN = {};        // which layer's picker drawer is expanded
// Filter state lives here rather than in the DOM: a compose result repaints the
// whole panel, and a search box that forgets what you typed every time the
// resolver answers is worse than no search box.
const FILT = {sq:"", fam:"", eng:"", comp:"", stat:"", q:{},
  // LoRA drawer: default to style LoRAs the resolved engine can actually load.
  loraStyleOnly:true, loraAll:false};

function tierBadge(v){
  const e = EFF.vars[v]; if(!e) return "";
  const t = EFF.tiers[e.tier] || {};
  return `<span class="tier t-${e.tier}" title="${esc(t.desc||"")}">${esc(t.label||e.tier)}</span>`;
}
function tierLine(v){
  const e = EFF.vars[v]; if(!e) return "";
  const t = EFF.tiers[e.tier] || {};
  return `<p class="tierline">${esc(t.desc||"")}${e.note?" <b>"+esc(e.note)+"</b>":""}</p>`;
}

function optCard(it, sel, onclick){
  const img = it.sample
    ? (it.sample.endsWith(".mp4")
        ? `<video src="${esc(it.sample)}" muted loop playsinline onmouseover="this.play()" onmouseout="this.pause()"></video>`
        : `<img loading="lazy" src="${esc(it.sample)}" alt="">`)
    : `<div class="noimg">no sample rendered yet</div>`;
  const road = it.status && it.status!=="ready"
    ? ` <span class="tier t-${it.status==="roadmap"?"none":"prompt"}">${esc(it.status)}</span>` : "";
  return `<button class="opt${sel?" on":""}" data-pick="${esc(onclick)}" data-val="${esc(it.id)}">
    ${img}<div class="body"><div class="name">${esc(it.id)}${road}</div>
    <div class="desc">${esc(it.desc||"")}</div></div></button>`;
}

function grid(group, key){
  const items = LIB[group]||[];
  if(!items.length) return `<p class="hint">nothing in studio/${group}/ yet</p>`;
  return `<div class="opts">${items.map(i=>optCard(i, S[key]===i.id, key)).join("")}</div>`;
}

/* ── engine resolution, for PICTURE SELECTION ONLY ────────────────────────
   Which thumbnail to show is a display question, so it is answered locally.
   Which engine the film actually renders on is a resolution question and is
   only ever taken from /api/compose. shownEngine() is never presented to the
   user as the answer - engineBar() labels the source explicitly. */
function shownEngine(){
  if(CSTATE==="ok" && CDATA && CDATA.engine) return CDATA.engine;
  if(S.engine_pick) return S.engine_pick;
  const c = styleById(S.style_card);
  if(c && c.engine) return c.engine==="either" ? "anime" : c.engine;
  return "anime";
}
const optionList = (pairs, cur) => pairs.map(([v,t])=>
  `<option value="${esc(v)}"${cur===v?" selected":""}>${esc(t)}</option>`).join("");

function styleById(id){ return id ? STYLES.find(s=>s.id===id) : null; }
function cardById(group,id){ return id ? (LIB[group]||[]).find(x=>x.id===id) : null; }

// Prefer the engine-suffixed example over the plain <id>.webp: measured on the
// box, 19 of 131 plain copies are the OTHER engine's render, so the bare file
// is not a safe stand-in for "what this card does".
function exampleFor(card, prefer){
  if(!card) return null;
  const ex = card.examples||{};
  const routed = card.engine==="either" ? "anime" : (card.engine||"");
  for(const e of [prefer, routed, "anime", "qwen"]){
    if(e && ex[e]) return {src:ex[e], engine:e, exact:true};
  }
  if(card.sample) return {src:card.sample, engine:null, exact:false};
  return null;
}
function thumbTag(ex, cls){
  if(!ex) return `<div class="${cls}" style="display:flex;align-items:center;justify-content:center;
      color:var(--dim);font-size:10px;text-align:center;padding:0 6px">no example rendered</div>`;
  return `<img loading="lazy" class="${cls}" src="${esc(ex.src)}" alt="">`;
}

/* ══ THE STACK STRIP ═══════════════════════════════════════════════════════ */
function layerValue(k){
  if(k==="character") return S.cast[0]||"";
  if(k==="place")     return S.place.trim();
  if(k==="wear")      return (S.wear===""||S.wear==null) ? "" : String(S.wear);
  if(k==="style")     return S.style_card;
  if(k==="style_lora"){
    if(S.style_lora==="none") return "none";
    if(S.style_lora) return S.style_lora;
    const r = recommendedLora();
    return r ? r.lora.file : "";     // showing the recommendation IS the value
  }
  return S[k]||"";
}

/* ══ STYLE-LoRA RECOMMENDATION ═════════════════════════════════════════════
   Two directions, because nobody has settled which way the cards will point.
   Forward: the style card names a LoRA. Reverse: the LoRA card names the
   styles it is for. Whichever is present is reported WITH its direction, so
   the "why" the user is shown is the actual provenance and not a guess. */
function recommendedLora(){
  // THE RESOLVER OWNS THIS when it is answering. compose.resolve_style_lora()
  // already applies the style card's recommendation, gates it on base_model and
  // explains itself, and compile.py calls the same function - so taking its
  // answer is the only way this page and the render can agree. The card-reading
  // below is the offline fallback, on the same terms as everything else here.
  if(CSTATE==="ok" && CDATA && CDATA.style_lora_active && CDATA.style_lora){
    const l = loraByFile(CDATA.style_lora) || loraByFile(CDATA.style_lora_id)
            || normLora({file:CDATA.style_lora, id:CDATA.style_lora_id});
    return {lora:l, resolved:true, reason:CDATA.style_lora_reason||"",
            why:esc(CDATA.style_lora_reason||"the resolver applied it"),
            strength:(CDATA.style_lora_strength!=null && !isNaN(CDATA.style_lora_strength))
                     ? Number(CDATA.style_lora_strength) : null};
  }
  // The resolver answered and said no LoRA applies. That is an answer, not a gap.
  if(CSTATE==="ok" && CDATA && CDATA.style_lora_active===false) return null;
  const c = styleById(S.style_card);
  if(c){
    const named = pickf(c, ["style_lora","lora","recommended_lora","loras","lora_name"]);
    const first = Array.isArray(named) ? named[0] : named;
    if(first){
      const f = (typeof first==="object") ? (first.file||first.id||first.lora) : String(first);
      const l = loraByFile(f);
      if(l) return {lora:l, why:`the style card <code>${esc(c.id)}</code> names it`,
                    strength: (typeof first==="object" && first.strength!=null)
                              ? parseFloat(first.strength) : null};
      return {lora:normLora({file:String(f)}), missing:true,
              why:`the style card <code>${esc(c.id)}</code> names it`, strength:null};
    }
    const back = LORAS.find(l=>l.for_styles.includes(c.id));
    if(back) return {lora:back, why:`the LoRA card lists <code>${esc(c.id)}</code> in the styles it is for`,
                     strength:null};
  }
  return null;
}
// What will actually be loaded, and where that came from. One function, so the
// band, the strip, the sidebar and the .movie can never disagree with each other.
function effectiveLora(){
  const rec = recommendedLora();
  if(S.style_lora==="none")
    return {mode:"none", lora:null, strength:0, rec,
            why:"you chose no style LoRA for this film."};
  if(S.style_lora){
    const l = loraByFile(S.style_lora) || normLora({file:S.style_lora});
    const st = S.style_strength!=="" ? parseFloat(S.style_strength)
             : (l.strength!=null ? l.strength : 1.0);
    return {mode:"picked", lora:l, strength:st, rec,
            why:"you picked this one by hand" +
                (rec && rec.lora.file!==l.file ? ", overriding what the style card recommends" : "")};
  }
  if(rec){
    const st = S.style_strength!=="" ? parseFloat(S.style_strength)
             : (rec.strength!=null ? rec.strength
             : (rec.lora.strength!=null ? rec.lora.strength : 1.0));
    return {mode:"recommended", lora:rec.lora, strength:st, rec, why:rec.why};
  }
  return {mode:"unset", lora:null, strength:null, rec:null, why:""};
}
// A .safetensors filename is 40-50 characters and would blow out a 96px strip
// cell. Shortened for the strip and the sidebar ONLY - every place the exact
// file matters (the band, the .movie) prints it in full.
function layerDisplay(k, v){
  if(k!=="style_lora") return v;
  if(v==="none") return "none";
  const e = effectiveLora();
  const short = String(v).replace(/\.safetensors$/,"");
  return (e.mode==="recommended" ? "↳ " : "") + short;
}
function layerThumb(k){
  const v = layerValue(k); if(!v) return null;
  if(k==="style")     return exampleFor(styleById(v), shownEngine());
  if(k==="place")     return exampleFor(cardById("places",v), shownEngine());
  if(k==="look")      { const c=cardById("looks",v); return c&&c.sample?{src:c.sample}:null; }
  if(k==="character") { const u=CASTVIEWS[v]; return u?{src:u}:null; }
  return null;
}
function stripHTML(){
  const cells = [];
  LAYERS.forEach((L,i)=>{
    if(L.post) cells.push(`<div class="cut">applied after<br>generation</div>`);
    // "+" not "›": the LoRA is not the next layer along, it is the same layer
    // as style arriving by a second route.
    else if(L.key==="style_lora") cells.push(`<div class="arrow">+</div>`);
    else if(i) cells.push(`<div class="arrow">›</div>`);
    const v = layerValue(L.key), th = layerThumb(L.key);
    cells.push(`<div class="sl${v?"":" empty"}" style="--lc:${lcol(L.key)}">
      <div class="lab">${esc(L.name)}</div>
      ${th?`<img class="th" loading="lazy" src="${esc(th.src)}" alt="">`
          :`<div class="th"></div>`}
      <div class="val">${v?esc(layerDisplay(L.key,v)):"—"}</div></div>`);
  });
  return `<div class="strip">${cells.join("")}</div>`;
}

/* ══ ENGINE BAR ════════════════════════════════════════════════════════════ */
function engineBar(){
  if(CSTATE==="ok" && CDATA){
    const e = CDATA.engine||"?";
    return `<div class="engbar ${esc(e)}">
      <div><div class="big">renders on ${esc(e)}</div>
      <div class="why2">${esc(CDATA.engine_reason||"no reason given")}</div></div></div>`;
  }
  const c = styleById(S.style_card);
  let why;
  if(S.engine_pick) why = `You set engine to ${S.engine_pick} by hand on this step.`;
  else if(c) why = `Read off the style card ${c.id}, whose engine field is "${c.engine}". This is the card speaking, not the resolver — /api/compose is not answering, so nothing has checked it against the rest of the stack.`;
  else why = `Nothing is resolved. Pick a style and the engine follows it; with no style the compiler defaults to anime.`;
  return `<div class="engbar unknown">
    <div><div class="big" style="color:var(--dim)">engine ${esc(shownEngine())} (unresolved)</div>
    <div class="why2">${esc(why)}</div></div></div>`;
}

/* ══ CONFLICTS ═════════════════════════════════════════════════════════════ */
const SEV_ORDER = {error:0, warning:1, note:2};
const SEV_WORD  = {error:"this will break", warning:"these will fight", note:"worth knowing"};
function conflictHTML(){
  if(CSTATE!=="ok" || !CDATA) return "";
  const list = (CDATA.conflicts||[]).slice()
    .sort((a,b)=>(SEV_ORDER[a.severity]??3)-(SEV_ORDER[b.severity]??3));
  if(!list.length) return `<div class="allclear">The resolver found no conflicts in this stack.</div>`;
  return `<div class="conflicts">${list.map(c=>{
    const sev = SEV_ORDER[c.severity]!=null ? c.severity : "note";
    const chips = (c.layers||[]).map(l=>
      `<span class="lchip" style="--lc:${LKEYS.includes(l)?lcol(l):"var(--dim)"}">${esc(l)}</span>`).join("");
    return `<div class="cf ${esc(sev)}">
      <div><span class="sev">${esc(SEV_WORD[sev]||sev)}</span>
        <span class="lchips">${chips}</span></div>
      <div class="msg">${esc(c.message||"")}</div>
      ${c.fix?`<div class="fix"><b>Fix</b> — ${esc(c.fix)}</div>`:""}</div>`;
  }).join("")}</div>`;
}
function flagFor(key){
  if(CSTATE!=="ok" || !CDATA) return "";
  let worst = "";
  for(const c of (CDATA.conflicts||[])){
    if(!(c.layers||[]).includes(key)) continue;
    if(c.severity==="error") return " flag-error";
    if(c.severity==="warning") worst = " flag-warning";
  }
  return worst;
}

/* ══ DEGRADED NOTICE ═══════════════════════════════════════════════════════ */
function degradedHTML(){
  if(CSTATE==="ok") return "";
  const reason = CSTATE==="down"
    ? `<b>The live layer preview is off.</b> ${esc(CERR||"/api/compose did not answer")}.`
    : CSTATE==="error"
      ? `<b>The resolver answered with an error.</b> ${esc(CERR)}${CDETAIL?" — "+esc(CDETAIL):""}`
      : `<b>Checking the resolver…</b>`;
  return `<div class="degraded">${reason}
    <div class="hint" style="margin-top:6px">You can still build the stack and save the
    .movie — the compiler resolves all of this again at compile time. What you do not get
    until <code>/api/compose</code> is up:</div>
    <ul>
      <li>the engine this stack actually renders on, and why</li>
      <li>the assembled prompt with each layer's contribution attributed to it</li>
      <li>every cross-layer conflict — a style that overrides your place, a qwen style that
          drops a character's trained LoRA, a grade that greys out a style built on colour</li>
    </ul>
    <div class="row" style="margin-top:9px">
      <button class="btn ghost sm" id="cretry">Check again</button>
      <span class="hint" style="margin:0">This page will not guess at any of it.</span>
    </div></div>`;
}

/* ══ ATTRIBUTED PROMPT ═════════════════════════════════════════════════════
   The text shown IS the server's prompt string, walked left to right and tinted
   where a layer's contributed text is found in it. Anything that does not line
   up stays uncoloured and is reported below, rather than being faked. */
// The resolver lists layers in ITS order (style first, because style decides the
// engine). The prompt is assembled in a different order - identity first, style
// last - so a left-to-right walk that assumed the two agreed attributed almost
// nothing. Locate each contribution independently, then sort by where it landed.
// A layer's `contributed` is not always verbatim prompt text. `look` reports its
// tags AND its ffmpeg grade in one string ("...blind shadow + the colour grade
// hue=s=0,..."), because a look genuinely does both halves. So: try the exact
// string, then fall back to the longest leading run of it that IS in the prompt.
function locate(prompt, c){
  let i=prompt.indexOf(c);
  if(i>=0) return {i, len:c.length};
  let s=c;
  while(s.length>12){
    const cut=Math.max(s.lastIndexOf(", "), s.lastIndexOf(" + "));
    if(cut<=0) break;
    s=s.slice(0,cut);
    i=prompt.indexOf(s);
    if(i>=0) return {i, len:s.length, partial:true};
  }
  return null;
}
function attribute(prompt, layers){
  const found=[], missed=[];
  for(const L of (layers||[])){
    const c=(L.contributed||"").trim();
    if(!c) continue;
    const hit=locate(prompt, c);
    if(!hit){ missed.push(L); continue; }
    found.push({start:hit.i, end:hit.i+hit.len, layer:L.layer, L});
  }
  // earliest first; on a tie prefer the longer span
  found.sort((a,b)=> a.start-b.start || b.end-a.end);
  const out=[]; let cur=0;
  for(const s of found){
    if(s.start < cur){ missed.push(s.L); continue; }   // overlaps an earlier layer
    if(s.start > cur) out.push({t:prompt.slice(cur,s.start), l:null});
    out.push({t:prompt.slice(s.start,s.end), l:s.layer});
    cur=s.end;
  }
  if(cur<prompt.length) out.push({t:prompt.slice(cur), l:null});
  return {runs:out, missed};
}
function promptHTML(){
  if(CSTATE!=="ok" || !CDATA) return "";
  const layers=(CDATA.layers||[]).filter(l=>(l.contributed||"").trim());
  const prompt=CDATA.prompt||"";
  const {runs, missed} = attribute(prompt, layers);
  const legend = layers.map(l=>
    `<span class="lg" style="--lc:${LKEYS.includes(l.layer)?lcol(l.layer):"var(--dim)"}">${esc(l.layer)}${
      l.id?" · "+esc(l.id):""}</span>`).join("");
  const body = runs.map(r=> r.l
    ? `<span data-l="${esc(r.l)}" style="--lc:${LKEYS.includes(r.l)?lcol(r.l):"var(--dim)"}">${esc(r.t)}</span>`
    : `<span class="unattr">${esc(r.t)}</span>`).join("");
  return `<h2 style="margin-top:26px">Assembled prompt</h2>
    <p class="lede">Exactly what the resolver will hand the model, coloured by which layer
    put each part there. Grey text belongs to no layer — it is the compiler's own
    scaffolding.</p>
    <div class="promptbox">
      <div class="legend">${legend||'<span class="hint">no layer contributed anything</span>'}</div>
      <div class="attr">${body||'<span class="unattr">(empty)</span>'}</div>
      ${missed.length?`<div class="hint" style="margin-top:9px">These layers reported a
        contribution that could not be located in the assembled prompt, so they are listed
        rather than highlighted: ${missed.map(m=>esc(m.layer)).join(", ")}.</div>`:""}
      ${CDATA.negative?`<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
        <div class="hint" style="margin:0 0 5px">negative</div>
        <div class="attr unattr">${esc(CDATA.negative)}</div></div>`:""}
    </div>`;
}

/* ══ BANDS ═════════════════════════════════════════════════════════════════ */
function contribHTML(key){
  if(CSTATE!=="ok" || !CDATA)
    return `<div class="contrib silent" id="contrib-${esc(key)}">contribution unknown — the
      resolver is not answering</div>`;
  const L=(CDATA.layers||[]).find(x=>x.layer===key ||
        (key==="character" && x.layer==="cast"));
  const txt=(L&&L.contributed||"").trim();
  if(!txt) return `<div class="contrib silent" id="contrib-${esc(key)}">adds nothing to the prompt</div>`;
  return `<div class="contrib" id="contrib-${esc(key)}" style="--lc:${lcol(key)}">
    <span class="k">adds to the prompt</span>${esc(txt)}</div>`;
}

function styleSelected(c){
  const a=exampleFor(c,"anime"), q=exampleFor(c,"qwen");
  const showBoth = a && q && a.src!==q.src;
  const one = exampleFor(c, shownEngine());
  const thumbs = showBoth
    ? `<div class="thwrap">${thumbTag(a,"th")}<span class="cap">anime</span></div>
       <div class="thwrap">${thumbTag(q,"th")}<span class="cap">qwen</span></div>`

         esc((one||{}).engine||"sample")}</span></div>`;
  const unavailable = c.status==="unavailable" ? `<div class="cf error" style="margin-top:10px">
      <div><span class="sev">this style does not work</span></div>

        Choosing it costs a full generation and gives back something that is not this style.</div>
      <div class="fix"><b>Fix</b> — pick a different card, or read the verdict above and use
        whatever it points at instead.</div></div>` : "";
  const weak = c.status==="weak" ? `<div class="cf warning" style="margin-top:10px">
      <div><span class="sev">this style barely does anything</span></div>
      <div class="msg">${esc(c.id)} was rendered and the difference from no style at all was
        small — on some cards small enough to be seed noise.</div>
      <div class="fix"><b>Fix</b> — keep it if you want the nudge, but do not expect the frame
        to look like the name.</div></div>` : "";
  return `<div class="pick">
    <div class="thbox">${thumbs}</div>
    <div class="meta">
      <div class="id">${esc(c.id)}${c.name&&c.name!==c.id
        ? ` <span style="color:var(--dim);font-weight:400">${esc(c.name)}</span>`:""}</div>
      <div class="badges">
        ${c.compose?`<span class="chip c-${esc(c.compose)}">${esc(c.compose)}</span>`:""}
        ${c.status?`<span class="chip s-${esc(c.status)}">${esc(c.status)}</span>`:""}
        ${c.engine?`<span class="chip e-${esc(c.engine)}">engine ${esc(c.engine)}</span>`:""}
        ${c.family?`<span class="chip" style="color:var(--dim)">${esc(c.family)}</span>`:""}
      </div>
      <div class="sub">${esc(c.means||"")}</div>
      ${c.compose&&COMPOSE_MEANS[c.compose]
        ? `<div class="sub"><b style="color:var(--ink)">compose: ${esc(c.compose)}</b> — ${
            esc(COMPOSE_MEANS[c.compose])}</div>`:""}
      ${c.status&&STATUS_MEANS[c.status]
        ? `<div class="sub"><b style="color:var(--ink)">status: ${esc(c.status)}</b> — ${
            esc(STATUS_MEANS[c.status])}</div>`:""}
      ${c.verdict
        ? `<div class="sub"><b style="color:var(--ink)">what it actually did</b> — ${esc(c.verdict)}</div>`:""}
    </div></div>${unavailable}${weak}`;
}

function styleBand(L){
  const c = styleById(S.style_card);

       on the anime engine and in whatever the house tags describe.</div></div></div>`;
  const engSel = `<div class="row" style="margin-top:10px">

      <div class="act">
        ${v&&!L.noclear?`<button class="btn ghost sm" data-lclear="${esc(L.key)}">clear</button>`:""}
        <button class="btn ghost sm" data-lopen="${esc(L.key)}">${OPEN[L.key]?"close":(v?"change":"choose")}</button>
      </div>
    </div>
    ${selHTML}
    ${(L.post||L.nocontrib)?"":contribHTML(L.key)}
    ${drawerHTML||""}</div>`;
}

/* ══ STYLE LoRA BAND ═══════════════════════════════════════════════════════
   Everything above this band is a REQUEST written in words, which the model is
   free to ignore. This one is not - it is arithmetic added to the weights. The
   band therefore explains itself in exactly those terms, and it says out loud
   whether the slot is authored or merely inherited, because an unauthored LoRA
   that nobody chose is the failure mode this slot exists to end. */
function loraStatusLine(l, eng){
  const compat = loraCompatible(l, eng);
  if(compat===true)  return {cls:"strong", txt:`compatible with the <b>${esc(eng)}</b> engine`};
  if(compat===false) return {cls:"dead",
    txt:`<b>NOT compatible with the ${esc(eng)} engine.</b> This LoRA is a delta on
         ${esc(l.base||"another base model")}'s weights. Loaded against ${esc(eng)} it
         attaches to nothing and changes nothing — the render costs the same and looks
         identical to having no LoRA at all.`};
  return {cls:"flat",
    txt:`base model unknown — the card does not say what weights this was trained on,
         so nothing here can tell you whether it will attach to ${esc(eng)}.`};
}

function styleLoraBand(L){
  const eng = shownEngine();
  const e = effectiveLora();
  let sel;

  if(!LORAS.length){
    // The library is not there. Say which route was tried and what it answered;
    // do NOT present an empty picker as "there are no LoRAs".
    sel = `<div class="pick"><div class="meta">
      <div class="none">No LoRA library loaded. ${esc(LORAS_ERR||"/api/loras returned nothing")}.</div>
      <div class="sub" style="margin-top:6px">The slot is still real — the qwen keyframe
        workflow has a live LoRA node whether or not this page can see the library. Until
        <code>/api/loras</code> answers, this page cannot tell you which file is in it, what
        it was trained on, or whether it needs a trigger word, so it will not pretend to.
        <button class="btn ghost sm" id="lretry" style="margin-left:6px">Check again</button></div>
      </div></div>`;
  } else if(e.mode==="none"){
    sel = `<div class="pick"><div class="meta">
      <div class="id">no style LoRA</div>
      <div class="sub">Authored, not defaulted: this film says the style is carried by the
        prompt alone. Written into the .movie as <code>style_lora: none</code>, which is the
        word the compiler reads as "refuse the style card's recommendation" — different from
        leaving the line out, which accepts it.</div>
      </div></div>`;
  } else if(!e.lora){
    sel = `<div class="pick"><div class="meta">
      <div class="none">No style LoRA. ${S.style_card
        ? `The style card <code>${esc(S.style_card)}</code> does not recommend one`
        : `No style is picked, so nothing can recommend one`}.</div>
      ${CSTATE==="ok" && CDATA && CDATA.style_lora_reason
        ? `<div class="sub" style="margin-top:6px"><b style="color:var(--ink)">the resolver
            says</b> — ${esc(CDATA.style_lora_reason)}</div>`
        : `<div class="sub" style="margin-top:6px">The resolver is not answering, so this is
            read off the style card rather than resolved.</div>`}
      <div class="sub" style="margin-top:6px">This style is carried by <b>words only</b>. On
        qwen that is the case measured here to fail: the same watercolour prose came back a
        photograph with no LoRA and a painted illustration with one. If that is what you want,
        pick a LoRA below; if it is not, say <b>no style LoRA</b> so the next person knows it
        was a decision.</div>
      </div></div>`;
  } else {
    const l = e.lora;
    const st = loraStatusLine(l, eng);
    const applied = e.mode==="recommended"
      ? `<b style="color:var(--L-style_lora)">applied because ${e.why}</b> — you have not
         overridden it. Change it or switch it off below and this line goes away.`
      : e.why;
    const strengthNow = (e.strength==null || isNaN(e.strength)) ? 1.0 : e.strength;
    // The slider tops out above the card's tested range on purpose - the finding
    // this slot exists for was measured at 1.5 - but never below where you
    // already are, or the thumb would silently clamp your own value.
    const slMax = Math.max(1.5, strengthNow, l.range?l.range[1]:0);
    const recTxt = l.strength!=null
      ? `card recommends ${l.strength}${l.range?` (tested ${l.range[0]}–${l.range[1]})`:""}`
      : `the card names no recommended strength — 1.0 is this page's fallback, not a measurement`;
    // The trigger check. A style LoRA with a trigger phrase that appears nowhere
    // in the prompt is a delta paid for and not asked for; that exact case is a
    // known live bug in this repo, so it is checked here rather than described.
    let trig = "";
    if(l.trig_state==="known"){
      // The text the model actually receives is the resolver's assembled prompt
      // PLUS the house tags: short.py renders `f"{prompt}, {style}"` where style
      // is the movie-level `tags` line. /api/compose is never sent the house
      // tags, so checking CDATA.prompt alone would report a trigger missing that
      // is sitting right there in the tags - and would make the fix this very
      // block recommends appear to do nothing.
      const hay = ((CDATA&&CDATA.prompt)||"") + " , " + (S.style||"");
      const inPrompt = CSTATE==="ok" && CDATA &&
        hay.toLowerCase().includes(String(l.trigger).toLowerCase());
      const viaTags = inPrompt &&
        !String((CDATA&&CDATA.prompt)||"").toLowerCase().includes(String(l.trigger).toLowerCase());
      trig = `<div class="trig">trigger <code>${esc(l.trigger)}</code> — ${
        CSTATE!=="ok"
          ? `the resolver is not answering, so this page cannot check whether the prompt
             contains it.`
        : inPrompt
          ? `<span style="color:var(--post)">present in the text the model will get${
              viaTags?", via the house style tags":""}.</span>`
          : `<span style="color:var(--sev-warning)">NOT in the assembled prompt, and not in
             the house style tags either.</span> This LoRA was trained to answer to that
             phrase. Without it you pay for the delta and ask for none of it.
             <b>Fix</b> — put the phrase in the house style tags on the Format step; they are
             appended to every prompt in the film.`}</div>`;
    } else if(l.trig_state==="none"){
      trig = `<div class="trig" style="color:var(--dim)">the card states there is no trigger
        word — the delta applies on strength alone.</div>`;
    } else {
      trig = `<div class="trig" style="color:var(--dim)">trigger word <b>unknown</b>, which is
        not the same as none. If this LoRA has one and it is missing from the prompt, the
        strength dial will look like it is doing nothing.</div>`;
    }
    sel = `<div class="pick"><div class="meta">
      <div class="id">${esc(l.file)}</div>
      <div class="badges">
        ${l.engine?`<span class="chip e-${esc(l.engine)}">${esc(l.engine)}</span>`
                  :`<span class="chip" style="color:var(--dim)">engine unknown</span>`}
        ${l.purpose?`<span class="chip" style="color:var(--dim)">${esc(l.purpose)}</span>`:""}
        ${l.status?`<span class="chip s-${esc(l.status)}">${esc(l.status)}</span>`:""}
        ${e.mode==="recommended"?`<span class="chip" style="color:var(--L-style_lora)">recommended</span>`:""}
        ${e.mode==="picked"?`<span class="chip" style="color:var(--accent)">your choice</span>`:""}
      </div>
      <div class="sub">${applied}</div>
      ${l.base?`<div class="sub">trained on <code>${esc(l.base)}</code></div>`:""}
      ${l.means?`<div class="sub"><b style="color:var(--ink)">what it does</b> — ${esc(l.means)}</div>`:""}
      ${l.verdict?`<div class="sub"><b style="color:var(--ink)">what was actually seen</b> — ${esc(l.verdict)}</div>`:""}
      ${l.purpose && l.purpose!=="style"
        ? `<div class="sub" style="color:var(--sev-warning)"><b>this is not a style LoRA</b> —
            its card calls it <b>${esc(l.purpose)}</b>. In the style slot it will still load and
            still change the image, but not in the way the slot is for.</div>`:""}
      <div class="mech ${st.cls}"><div class="mh">base-model lock</div>
        <div class="mv">${st.txt}</div></div>
      ${e.rec && e.mode==="picked" && e.rec.lora.file!==l.file
        ? `<div class="sub" style="color:var(--prompt)">the style card recommends
            <code>${esc(e.rec.lora.file)}</code> instead; you are overriding it.</div>`:""}
      ${e.mode==="picked" && CSTATE==="ok"
        ? `<div class="sub" style="color:var(--dim)"><b>checked here, not by the resolver</b> —
            <code>/api/compose</code> does not take a style_lora argument, so the base-model
            line above is read off this LoRA's own card. <code>compile.py</code> puts the same
            choice through <code>resolve_style_lora()</code> when you compile, and that is the
            answer that decides the render.</div>`:""}
      ${e.rec && e.rec.missing
        ? `<div class="sub" style="color:var(--sev-error)">the style card names this file but
            it is not in the LoRA library, so nothing can check it.</div>`:""}
      <div class="slrow">
        <label class="hint" style="margin:0">strength</label>
        <input type="range" id="sl-strength" min="0" max="${esc(slMax)}" step="0.05"
               value="${esc(strengthNow)}">
        <span class="sv" id="sl-sv">${esc(strengthNow.toFixed(2))}</span>
        <span class="rec">${esc(recTxt)}</span>
      </div>
      ${l.range && (strengthNow < l.range[0] || strengthNow > l.range[1])
        ? `<div class="hint" style="margin-top:4px;color:var(--prompt)">outside the card's
            tested range of ${esc(l.range[0])}–${esc(l.range[1])}.</div>`:""}
      ${trig}
      </div></div>`;
  }

  const reset = S.style_lora!=="" ? `<div class="row" style="margin-top:9px">
      <button class="btn ghost sm" id="sl-reset">reset to unset</button>
      <span class="hint" style="margin:0">${recommendedLora()
        ? "goes back to following the style card's recommendation"
        : "goes back to the unauthored state — the workflow's own default"}</span></div>` : "";

  // Verified end to end on the box rather than asserted: a .movie saved from this
  // page compiles, and the compiled film JSON carries the resolved file and
  // strength that short.py reads.
  const wiring = `<div class="mech flat">
    <div class="mh">where this lands</div>
    <div class="mv" style="font-size:12.5px;color:var(--dim)">Written into the .movie as
      <code>style_lora</code> (and <code>style_lora_strength</code> when you move the dial).
      <code>compile.py</code> resolves it through the same
      <code>compose.resolve_style_lora()</code> this page reads, and writes the chosen file
      into the film JSON; <code>short.py</code> puts it in the keyframe workflow's LoRA node.
      <b>This is the slot that used to be filled by whatever the workflow was last saved
      with.</b> Leaving it unset is a decision too — it takes the style card's
      recommendation, and no recommendation means no LoRA.</div></div>`;

  return band(L, sel + reset + wiring, OPEN.style_lora ? loraDrawer() : "");
}

function loraDrawer(){
  if(!LORAS.length){
    return `<div class="drawer"><p class="hint" style="margin:0"><b>No LoRA library.</b>
      ${esc(LORAS_ERR||"/api/loras returned nothing")}. This page reads
      <code>/api/loras</code>, and falls back to a <code>loras</code> group on
      <code>/api/library</code> if the cards were added there instead.
      <button class="btn ghost sm" id="lretry" style="margin-left:8px">Check again</button></p></div>`;
  }
  const eng = shownEngine();
  const showAll = !!FILT.loraAll;
  const styleOnly = FILT.loraStyleOnly!==false;
  const rows = LORAS.filter(l=>{
    if(styleOnly && !isStyleLora(l)) return false;
    if(!showAll && loraCompatible(l,eng)===false) return false;
    return true;
  });
  const hidden = LORAS.length - rows.length;
  const cur = (S.style_lora && S.style_lora!=="none") ? S.style_lora : "";
  return `<div class="drawer">
    <div class="fbar">
      <input type="search" data-q="style_lora" value="${esc(FILT.q.style_lora||"")}"
        placeholder="search ${LORAS.length} loras — file, base, purpose">
      <label class="hint" style="margin:0;display:flex;gap:5px;align-items:center">
        <input type="checkbox" id="lf-style" style="width:auto" ${styleOnly?"checked":""}>
        style LoRAs only</label>
      <label class="hint" style="margin:0;display:flex;gap:5px;align-items:center">
        <input type="checkbox" id="lf-all" style="width:auto" ${showAll?"checked":""}>
        show ones this engine cannot load</label>
    </div>
    <div class="hint" style="margin:-4px 0 9px">Filtered to what the <b>${esc(eng)}</b> engine
      can actually load. A LoRA is a delta on one specific set of weights — the wrong base
      loads silently, attaches to nothing, and looks exactly like a seed you did not like.
      ${hidden>0?`${hidden} of ${LORAS.length} hidden.`:""}${
        LORAS_SRC?` · from <code>${esc(LORAS_SRC)}</code>`:""}${
        LORAS_UNCARDED.length?` · ${LORAS_UNCARDED.length} file(s) on disk have no card and are
          not offered here, because nothing is known about them.`:""}</div>
    <div class="scroller" data-grid="style_lora">
      <button class="lorarow${S.style_lora==="none"?" on":""}" data-lorapick="none" data-hay="none off disable">
        <div class="g"><div class="fn">no style LoRA</div>
        <div class="sb">Say it deliberately. Writes <code>style_lora: none</code>, which
          refuses the style card's recommendation — not the same as leaving the line out.</div>
        </div></button>
      ${rows.map(l=>{
        const compat = loraCompatible(l,eng);
        const hay=[l.file,l.id,l.base,l.purpose,l.trigger,l.means].filter(Boolean).join(" ").toLowerCase();
        return `<button class="lorarow${cur===l.file?" on":""}${compat===false?" bad":""}"
          data-lorapick="${esc(l.file)}" data-hay="${esc(hay)}">
          <div class="g">
            <div class="fn">${esc(l.file)}</div>
            <div class="badges">
              ${l.engine?`<span class="chip e-${esc(l.engine)}">${esc(l.engine)}</span>`
                        :`<span class="chip" style="color:var(--dim)">base unknown</span>`}
              ${l.purpose?`<span class="chip" style="color:var(--dim)">${esc(l.purpose)}</span>`:""}
              ${l.strength!=null?`<span class="chip" style="color:var(--dim)">rec ${esc(l.strength)}</span>`:""}
              ${l.trig_state==="known"?`<span class="chip" style="color:var(--prompt)">trigger</span>`:""}
              ${l.trig_state==="unknown"?`<span class="chip" style="color:var(--dim)">trigger ?</span>`:""}
              ${compat===false?`<span class="chip s-unavailable">wrong base</span>`:""}
            </div>
            <div class="sb">${esc(l.base?("trained on "+l.base+". "):"")}${esc((l.means||"").slice(0,190))}</div>
          </div></button>`;}).join("")}
      ${rows.length?"":`<p class="hint">Nothing in the library is loadable on the
        <b>${esc(eng)}</b> engine${styleOnly?" as a style LoRA":""}. That is a real answer, not
        an empty list — tick the boxes above to see what was filtered out and why.</p>`}
    </div></div>`;
}

function simpleBand(L, group, opts){
  const cur = layerValue(L.key);
  const c = cardById(group, cur);
  let sel;
  if(!cur){
    sel = `<div class="pick"><div class="meta"><div class="none">${esc(opts.empty)}</div></div></div>`;
  } else if(!c){
    // free text - legal for `place`, which compile.py documents as "a card id, or free text"
    sel = `<div class="pick"><div class="meta">
      <div class="id">${esc(cur)}</div>
      <div class="sub">Free text, not a card in <code>studio/${esc(group)}/</code>. It goes into
        the prompt exactly as written — nothing looks it up, so nothing can check it.</div>
      </div></div>`;
  } else {
    const ex = opts.useExamples ? exampleFor(c, shownEngine()) : (c.sample?{src:c.sample}:null);
    sel = `<div class="pick">
      <div class="thbox"><div class="thwrap">${thumbTag(ex,"th")}${
        ex&&ex.engine?`<span class="cap">${esc(ex.engine)}</span>`:""}</div></div>
      <div class="meta">
        <div class="id">${esc(c.id)}${c.name&&c.name!==c.id?` <span style="color:var(--dim);font-weight:400">${esc(c.name)}</span>`:""}</div>
        <div class="badges">
          ${c.status&&c.status!=="ready"?`<span class="chip s-${esc(c.status)}">${esc(c.status)}</span>`:""}
          ${c.family?`<span class="chip" style="color:var(--dim)">${esc(c.family)}</span>`:""}
          ${c.scale?`<span class="chip" style="color:var(--dim)">${esc(c.scale)}</span>`:""}
        </div>
        <div class="sub">${esc(opts.sub?opts.sub(c):(c.desc||""))}</div>
        ${c.status==="partial"?`<div class="sub"><b style="color:var(--prompt)">not wired</b> —
          this library has no consumer in the render pipeline yet. The choice is written into
          the .movie and is correct the day a consumer lands, but it changes nothing today.</div>`:""}
        ${opts.caveat && CSTATE!=="ok"
          ? `<div class="sub"><b style="color:var(--prompt)">check this</b> — ${opts.caveat}</div>`:""}

function characterBand(L){

  let sel;
  if(!ids.length){
    sel = `<div class="pick"><div class="meta"><div class="none">Nobody in the scene. Shots
      render as scenery, and every character-shaped layer below is inert.</div></div></div>`;
  } else {

          :`<div class="th" style="display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:10px">no sheet</div>`}
          <span class="cap">${esc(id)}</span></div>`;}).join("")}</div>

/* ══ HOW THIS FACE IS HELD ═════════════════════════════════════════════════
   The mechanism that holds a face is not the same on the two engines, and the
   difference is the single most consequential thing about choosing between
   them. It is invisible until playback if it is not said here, so it is said
   here — at the point of choosing, before a frame is spent.

     anime → IPAdapter on the reference sheet AND the trained character LoRA.
             Two mechanisms stacked, one of them a change to the weights.
     qwen  → the reference sheet fed to Qwen-Image-Edit as conditioning. One
             mechanism, and a hint rather than a change to the weights.

   lora_active / lora_reason come from the resolver and are printed verbatim.
   When the resolver is down this block still renders, from the character card,
   and labels itself as the card speaking rather than the resolver. */
function identityHTML(){
  const c = cardById("characters", S.cast[0]) || {};
  if(!S.cast.length) return "";
  const eng = shownEngine();
  const resolved = CSTATE==="ok" && !!CDATA;
  const hasLora = !!(resolved ? (CDATA.lora || c.lora) : c.lora);
  const active  = resolved ? !!CDATA.lora_active : null;

  let cls, head, body;
  if(eng==="anime"){
    cls = hasLora ? "strong" : "weak";
    head = hasLora ? "strong — two mechanisms, one of them the weights"
                   : "reference sheet only";
    body = hasLora
      ? `<b>IPAdapter</b> on ${c.sheet?`the sheet <code>${esc(c.sheet)}</code>`:"the reference sheet"}
         <b>plus the trained character LoRA</b>, injected between the checkpoint and the
         sampler. The LoRA is an actual change to the weights, so it holds in shots the
         sheet never covered.`
      : `<b>IPAdapter</b> on ${c.sheet?`the sheet <code>${esc(c.sheet)}</code>`
         :`<span style="color:var(--sev-error)">no reference sheet at all</span>`}. No trained
         LoRA for this character, so identity is a hint the sampler may drift off.`;
  } else if(eng==="qwen"){
    cls = c.sheet ? "weak" : "dead";
    head = c.sheet ? "weaker lock — a hint, not a change to the weights"
                   : "nothing is holding this face";
    body = c.sheet
      ? `The sheet <code>${esc(c.sheet)}</code> is fed to <b>Qwen-Image-Edit</b> as
         conditioning on the keyframe. It conditions the generation; it does not alter the
         weights, and it is a weaker lock than the anime path — expect more drift between
         shots.`
      : `This character has <b>no reference sheet</b>, and on qwen the sheet is the only
         mechanism there is. The face will be whatever the prose description happens to
         produce, and it will not agree from one shot to the next.`;
  } else {
    cls = "flat"; head = "engine not resolved";
    body = `Which mechanism holds this face depends entirely on the engine, and the engine is
      not resolved yet.`;
  }

  // The one that has to be said at the point of choosing: a trained LoRA that
  // exists and is being dropped because of the engine.
  let drop = "";
  const droppedByEngine = hasLora && (resolved ? active===false : eng==="qwen");
  if(droppedByEngine){
    drop = `<div class="mw" style="color:var(--sev-error)">
      <b>The trained LoRA is NOT in play.</b>
      ${resolved && CDATA.lora ? `<code>${esc(CDATA.lora)}</code> — ` : ""}${
      resolved && CDATA.lora_reason ? esc(CDATA.lora_reason)
      : `it was trained on the anime checkpoint, and a LoRA is a delta on those specific
         weights — on qwen it attaches to nothing. You are paying for the training and
         getting none of it.`}
      <br><b>Fix</b> — pick an anime-engine style if holding this face matters more than the
      idiom, or accept the sheet-only lock deliberately.</div>`;
  } else if(hasLora && active===true){
    drop = `<div class="mw" style="color:var(--post)"><b>Trained LoRA in play.</b>
      ${CDATA.lora?`<code>${esc(CDATA.lora)}</code> — `:""}${esc(CDATA.lora_reason||"")}</div>`;
  } else if(hasLora && !resolved){
    drop = `<div class="mw">This character has a trained LoRA —
      <code>${esc(c.lora)}</code>. Whether it is actually in play depends on the engine, and
      only the resolver can say. <b>/api/compose is not answering</b>, so the line above is
      read off the character card, not resolved.</div>`;
  } else if(!hasLora){
    drop = `<div class="mw">No trained LoRA exists for this character.</div>`;
  }

  return `<div class="mech ${cls}" style="margin-top:9px">
    <div class="mh">how this face is held on ${esc(eng)}</div>
    <div class="mv"><b>${esc(head)}</b></div>
    <div class="mw">${body}</div>
    ${drop}</div>`;
}

function wearBand(L){
  const v = layerValue(L.key);
  const c = cardById("characters", S.cast[0]);
  const ladder = (c && c.wear_tags && c.wear_tags.length) ? c.wear_tags : null;
  const sel = v===""
    ? `<div class="pick"><div class="meta"><div class="none">No wear set — nothing is written,
        and the compiler's level 0 applies.</div></div></div>`
    : `<div class="pick"><div class="meta">
        <div class="id">wear ${esc(v)}</div>
        <div class="sub">${esc(ladder?ladder[+v]:WEAR_GENERIC[+v])}</div>
        ${ladder?`<div class="sub" style="color:var(--dim)">from ${esc(c.id)}'s own wear_tags</div>`
                :`<div class="sub" style="color:var(--prompt)">the picked character has no
                   wear_tags, so the compiler's generic ladder dresses them in a uniform</div>`}
      </div></div>`;
  return band(L, sel, OPEN.wear ? wearDrawer() : "");
}

/* ══ THE LAYERS STEP ═══════════════════════════════════════════════════════ */
function layersPanel(){
  const bands = LAYERS.map(L=>{
    if(L.key==="style")      return styleBand(L);
    if(L.key==="style_lora") return styleLoraBand(L);
    if(L.key==="place")     return simpleBand(L,"places",{useExamples:true, search:true,
        empty:"No setting. The model puts the subject wherever it likes, and it will not agree between shots.",
        sub:c=>c.desc||c.tags,
        note:"64 settings, each authored with both a danbooru tag string and a prose sentence."});
    if(L.key==="character") return characterBand(L);
    if(L.key==="wear")      return wearBand(L);
    if(L.key==="lighting")  return simpleBand(L,"lighting",{search:true,
        empty:"No lighting layer.", sub:c=>c.key||c.desc,
        note:"The visible consequence is authored as tags on each card."});
    if(L.key==="weather")   return simpleBand(L,"weather",{search:true,
        empty:"No weather layer.", sub:c=>c.tags||c.desc,
        note:"Authored as what the weather does to hair, cloth, skin and ground."});
    if(L.key==="look")      return simpleBand(L,"looks",{search:true,
        empty:"No grade. neutral is the default and is a real, mild grade.",
        sub:c=>c.tags||c.note, note:"Only 7 of 25 looks have a rendered sample."});
    return "";
  });
  const splitAt = LAYERS.findIndex(l=>l.post);
  const prompted = bands.slice(0,splitAt).join("");
  const post = bands.slice(splitAt).join("");

  return `
    <h2>Layer stack</h2>
    <p class="lede">Choose each layer and watch them combine. They are drawn nested because
    that is how they resolve: the style decides which model runs at all, the place is what
    that model draws, the character stands in it, and the modifiers act on the character.</p>
    <div class="why"><b>One of these layers is not a request.</b> Style, place, character and
    the modifiers are all words handed to a model that is free to ignore them — measured
    here: prose alone could not move Qwen off photography at any cfg. <b>The style LoRA
    is not words.</b> It is arithmetic added to the weights, and it does the one thing the
    prompt could not. That is why it has its own slot instead of being folded into the style
    card.</div>
    <div class="why"><b>The last layer is not like the others.</b> Everything above the dashed
    line becomes prompt text — a request, which the model may ignore. <b>Look</b> is an ffmpeg
    colour grade run over the finished frames. It is arithmetic on pixels, it always happens,
    and it always wins. That is why it sits outside the stack.
    <br><br>These are the same values as the Look, Place and Cast steps — pick here or there,
    it is one scene either way.</div>
    ${stripHTML()}
    ${engineBar()}
    ${degradedHTML()}
    ${conflictHTML()}
    <div class="stack">${prompted}</div>
    <div class="split"><span>everything above becomes the prompt</span>
      <span>everything below runs after generation</span></div>
    <div class="stack">${post}</div>
    ${promptHTML()}`;
}

/* ══ RENDER ════════════════════════════════════════════════════════════════ */
// The panel is rebuilt wholesale on every change, so a text field the user is in
// would lose focus and caret whenever the resolver answers. Note where they are,
// put them back afterwards.
function focusMark(){
  const a=document.activeElement;
  if(!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return null;
  const sel = a.id ? "#"+a.id : (a.dataset && a.dataset.q ? `[data-q="${a.dataset.q}"]` : "");
  if(!sel) return null;
  let pos=null; try{ pos=a.selectionStart; }catch(e){}
  return {sel, pos};
}
function focusRestore(m){
  if(!m) return;
  const el=document.querySelector(m.sel);
  if(!el || el===document.activeElement) return;
  try{ el.focus({preventScroll:true}); }catch(e){ el.focus(); }
  if(m.pos!=null){ try{ el.selectionStart=el.selectionEnd=m.pos; }catch(e){} }
}
