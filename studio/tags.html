<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>studio · what the tags mean</title>
<style>
  :root{--bg:#0f1115;--panel:#161a21;--panel2:#1c2129;--line:#272d38;--ink:#e6e9ef;
        --dim:#8b94a3;--accent:#6ea8fe;--ok:#4ec9a0;--warn:#e0b252;--bad:#e07a5f}
  @media (prefers-color-scheme:light){
    :root{--bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#dde1e8;--ink:#141821;--dim:#5d6470}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:13px 18px;
         border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:9}
  header h1{margin:0;font-size:15px;letter-spacing:.07em;text-transform:uppercase}
  header .sub{color:var(--dim);font-size:12px}
  header .right{margin-left:auto;display:flex;gap:8px}
  header a{color:var(--dim);font-size:12px;text-decoration:none;border:1px solid var(--line);
           padding:5px 10px;border-radius:6px}
  header a:hover{color:var(--ink);border-color:var(--accent)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);
       background:var(--panel);position:sticky;top:52px;z-index:8}
  input[type=search],select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
       border-radius:7px;padding:7px 10px;font:inherit}
  .list{padding:18px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(430px,1fr))}
  .t{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .t img{width:100%;display:block;border-bottom:1px solid var(--line);background:var(--panel2)}
  .t .b{padding:13px 15px}
  .t h3{margin:0;font-size:16px;font-family:ui-monospace,Menlo,monospace;color:var(--accent)}
  .t .fam{float:right;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
          border:1px solid var(--line);border-radius:99px;padding:1px 8px}
  .t p{margin:9px 0 0;font-size:13px}
  .t .lbl{color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
          margin-top:11px}
  .t .read{margin-top:10px;padding:8px 10px;border-left:2px solid var(--line);
           color:var(--dim);font-size:12px;background:var(--panel2);border-radius:0 6px 6px 0}
  .pill{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:99px;
        padding:1px 8px;margin:3px 4px 0 0;color:var(--dim)}
  .s-strong{color:var(--ok)} .s-moderate{color:var(--accent)}
  .s-weak{color:var(--warn)} .s-negative-only{color:var(--bad)}
  .noimg{padding:26px 15px;text-align:center;color:var(--dim);font-size:12px;
         background:var(--panel2);border-bottom:1px solid var(--line)}
  .empty{padding:40px 18px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>what the tags mean</h1><span class="sub" id="stat">loading…</span>
  <div class="right">
    <a href="/wizard">direct a scene</a><a href="/cast">cast</a>
    <a href="/make">make</a>
    <a href="/styles">styles</a><a href="/places">Places</a><a href="/loras">loras</a>
    <a href="/gallery">gallery</a><a href="/changelog">Changelog</a><a href="/tools">Tools</a><a href="/docs">Docs</a><a href="/">library</a>
  </div>
</header>
<div class="bar">
  <input type="search" id="q" placeholder="search a tag or what it does…" style="flex:1;min-width:200px">
  <select id="fam"><option value="">every family</option></select>
  <select id="str"><option value="">any strength</option></select>
</div>
<div class="list" id="list"></div>
<div class="empty" id="empty" style="display:none"></div>

<script>
let ALL=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function draw(){
  const q=$("q").value.trim().toLowerCase(), fam=$("fam").value, st=$("str").value;
  const v=ALL.filter(t=>
    (!fam||t.family===fam) && (!st||t.strength===st) &&
    (!q || (t.term+" "+(t.means||"")+" "+(t.does||"")).toLowerCase().includes(q)));
  $("stat").textContent=`${v.length} of ${ALL.length} tags`;
  $("empty").style.display=v.length?"none":"block";
  $("empty").textContent=ALL.length?"Nothing matches.":
    "No glossary yet. Run: python3 studio/_tools/tag_examples.py";
  $("list").innerHTML=v.map(t=>`
    <div class="t">
      ${t.example?`<img loading="lazy" src="${esc(t.example)}" alt="${esc(t.term)} comparison">`
                 :`<div class="noimg">no example rendered yet</div>`}
      <div class="b">
        <h3>${esc(t.term)}<span class="fam">${esc(t.family||"")}</span></h3>
        <p>${esc(t.means||"")}</p>
        <div class="lbl">what it does here</div>
        <p>${esc(t.does||"")}</p>
        ${t.reach_for_it?`<div class="lbl">reach for it</div><p>${esc(t.reach_for_it)}</p>`:""}
        <div class="lbl">strength</div>
        <p class="s-${esc(t.strength||"")}">${esc(t.strength||"unknown")}${
          t.negative_instead?" — belongs in the NEGATIVE prompt, not the positive":""}</p>
        ${(t.pairs_with||[]).length?`<div class="lbl">pairs with</div>${
          t.pairs_with.map(x=>`<span class="pill">${esc(x)}</span>`).join("")}`:""}
        ${(t.fights_with||[]).length?`<div class="lbl">fights with</div>${
          t.fights_with.map(x=>`<span class="pill">${esc(x)}</span>`).join("")}`:""}
        ${t.read_it_as?`<div class="read"><b>Read it as:</b> ${esc(t.read_it_as)}</div>`:""}
        ${t.used_in?`<div class="lbl">used in</div><p style="color:var(--dim);font-size:12px">${esc(t.used_in)}</p>`:""}
      </div>
    </div>`).join("");
}

(async function(){
  try{ ALL=await fetch("/api/tags").then(r=>r.json()); }catch(e){ ALL=[]; }
  ALL.sort((a,b)=>(a.family||"").localeCompare(b.family||"")||a.term.localeCompare(b.term));
  const fams=[...new Set(ALL.map(t=>t.family).filter(Boolean))].sort();
  $("fam").innerHTML='<option value="">every family</option>'+
    fams.map(f=>`<option>${esc(f)}</option>`).join("");
  const sts=[...new Set(ALL.map(t=>t.strength).filter(Boolean))].sort();
  $("str").innerHTML='<option value="">any strength</option>'+
    sts.map(s=>`<option>${esc(s)}</option>`).join("");
  ["q","fam","str"].forEach(id=>{$(id).oninput=draw; $(id).onchange=draw;});
  draw();
})();
</script>
</body>
</html>
