<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>studio · print library</title>
<style>
  :root{--bg:#0f1115;--panel:#161a21;--panel2:#1c2129;--line:#272d38;--ink:#e6e9ef;
        --dim:#8b94a3;--accent:#6ea8fe;--ok:#4ec9a0;--warn:#e0b252;--bad:#e07a5f}
  @media (prefers-color-scheme:light){
    :root{--bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#dde1e8;--ink:#141821;--dim:#5d6470}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:13px 18px;
         border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:9}
  header h1{margin:0;font-size:15px;letter-spacing:.07em;text-transform:uppercase}
  header .sub{color:var(--dim);font-size:12px}
  header .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  header a{color:var(--dim);font-size:12px;text-decoration:none;border:1px solid var(--line);
           padding:3px 9px;border-radius:6px}
  header a:hover{color:var(--ink);border-color:var(--accent)}
  main{padding:18px;max-width:1400px;margin:0 auto}
  .note{background:var(--panel);border:1px solid var(--line);border-radius:9px;
        padding:12px 14px;margin-bottom:16px;color:var(--dim);font-size:13px}
  .note b{color:var(--ink)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .filters button{background:var(--panel);border:1px solid var(--line);color:var(--dim);
                  padding:6px 12px;border-radius:7px;cursor:pointer;font:inherit;font-size:12.5px}
  .filters button:hover{color:var(--ink)}
  .filters button.on{border-color:var(--accent);color:var(--ink);background:var(--panel2)}
  .filters .n{opacity:.6;margin-left:5px}
  .grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(285px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        overflow:hidden;display:flex;flex-direction:column}
  .card .thumb{height:132px;background:var(--panel2);display:flex;align-items:center;
               justify-content:center;overflow:hidden;border-bottom:1px solid var(--line)}
  .card .thumb img{width:100%;height:100%;object-fit:cover}
  .card .thumb .none{color:var(--dim);font-size:11px;letter-spacing:.08em}
  .card .body{padding:11px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
  .card h3{margin:0;font-size:13.5px;line-height:1.35}
  .state{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
         border:1px solid var(--line);align-self:flex-start}
  .s-ready{color:var(--ok);border-color:var(--ok)}
  .s-step{color:var(--warn);border-color:var(--warn)}
  .s-no{color:var(--bad);border-color:var(--bad)}
  .s-unk{color:var(--dim)}
  .dims{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
  .why{color:var(--dim);font-size:11.5px;margin:0;padding-left:15px}
  .why li{margin:2px 0}
  .files{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:8px;
         border-top:1px solid var(--line)}
  .files a{font-size:11px;color:var(--accent);text-decoration:none;border:1px solid var(--line);
           padding:2px 7px;border-radius:5px}
  .files a:hover{border-color:var(--accent)}
  .lic{color:var(--dim);font-size:11px}
  .lic a{color:var(--dim)}
  .empty{color:var(--dim);padding:30px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Print library</h1>
  <span class="sub" id="count">loading…</span>
  <span class="right">
    <a href="/">home</a><a href="/model3d">3D print (generated)</a><a href="/gallery">gallery</a>
  </span>
</header>
<main>
  <div class="note" id="intro"></div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</main>
<script>
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const CLS = {"ready as-is":"s-ready", "printable, needs a step":"s-step",
             "not printable":"s-no"};

let DATA = null, filter = "all";

function dims(it){
  if (!it.mm) return "not measured";
  const d = it.mm.map(x => x.toFixed(0)).join(" × ") + " mm";
  const extra = [];
  if (it.faces) extra.push(it.faces.toLocaleString() + " faces");
  if (it.components > 1) extra.push(it.components + " parts");
  return d + (extra.length ? " · " + extra.join(" · ") : "");
}

function card(it){
  const cls = CLS[it.state] || "s-unk";
  const thumb = it.thumb
    ? `<img src="${esc(it.thumb)}" loading="lazy" alt="">`
    : `<span class="none">NO PREVIEW</span>`;
  // Every mesh is a direct download off /samples/, which already streams with Range -
  // a 133 MB STL is never read into memory.
  const files = it.meshes.slice(0, 6).map(f =>
    `<a href="${esc(f.url)}" download title="${esc(f.name)}">${esc(f.name.slice(0,22))} · ${f.mb} MB</a>`
  ).join("");
  const more = it.meshes.length > 6
    ? `<a href="${esc(it.source_url)}" target="_blank" rel="noopener">+${it.meshes.length-6} more</a>` : "";
  const why = (it.why || []).slice(0, 3).map(w => `<li>${esc(w)}</li>`).join("");
  return `<div class="card">
    <div class="thumb">${thumb}</div>
    <div class="body">
      <h3>${esc(it.name)}</h3>
      <span class="state ${cls}">${esc(it.state)}</span>
      <div class="dims">${esc(dims(it))}</div>
      <ul class="why">${why}</ul>
      <div class="lic">${esc(it.licence || "licence unrecorded")} ·
        <a href="${esc(it.source_url)}" target="_blank" rel="noopener">source</a></div>
      <div class="files">${files}${more}</div>
    </div></div>`;
}

function render(){
  const items = filter === "all" ? DATA.items : DATA.items.filter(i => i.state === filter);
  document.getElementById("grid").innerHTML =
    items.length ? items.map(card).join("") : `<div class="empty">nothing in this group</div>`;
  document.getElementById("count").textContent =
    `${items.length} of ${DATA.total} models`;
}

function filters(){
  const groups = ["all"].concat(Object.keys(DATA.states)
    .sort((a,b) => (DATA.items.findIndex(i=>i.state===a)) - (DATA.items.findIndex(i=>i.state===b))));
  document.getElementById("filters").innerHTML = groups.map(g => {
    const n = g === "all" ? DATA.total : DATA.states[g];
    return `<button data-g="${esc(g)}" class="${g===filter?"on":""}"
      title="${esc(DATA.state_means[g] || "")}">${esc(g)}<span class="n">${n}</span></button>`;
  }).join("");
  document.querySelectorAll("#filters button").forEach(b =>
    b.onclick = () => { filter = b.dataset.g; filters(); render(); });
}

fetch("/api/prints").then(r => r.json()).then(d => {
  if (d.error) {
    document.getElementById("grid").innerHTML =
      `<div class="empty">${esc(d.error)}</div>`;
    return;
  }
  DATA = d;
  document.getElementById("intro").innerHTML =
    `<b>Free models to print.</b> Downloaded from
     <a href="https://github.com/nasa/NASA-3D-Resources" target="_blank" rel="noopener">NASA 3D Resources</a>,
     which is public domain — no attribution required, commercial use fine. Every card carries
     its licence, and a <code>LICENCE.txt</code> sits beside the meshes on disk.
     Printability is diagnosed by <code>mesh_doctor.py</code>, not guessed here.
     <br><b>Two things worth knowing:</b> the nebula and galaxy meshes are volumetric renders —
     surfaces, not solids — so they read as not printable. And several asteroid meshes carry
     no real-world scale, so they measure about a millimetre across and must be scaled before
     slicing. Both are stated per model rather than glossed over.`;
  filters();
  render();
}).catch(e => {
  document.getElementById("grid").innerHTML =
    `<div class="empty">could not load /api/prints: ${esc(e.message)}</div>`;
});
</script>
</body>
</html>
