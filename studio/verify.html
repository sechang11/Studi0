<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>studio · verify</title>
<style>
  :root{--bg:#0f1115;--panel:#161a21;--panel2:#1c2129;--line:#272d38;--ink:#e6e9ef;
        --dim:#8b94a3;--accent:#6ea8fe;--ok:#4ec9a0;--warn:#e0b252;--bad:#e07a5f}
  @media (prefers-color-scheme:light){
    :root{--bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#dde1e8;--ink:#141821;--dim:#5d6470}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 18px;
         border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:9}
  header h1{margin:0;font-size:15px;letter-spacing:.07em;text-transform:uppercase}
  header .sub{color:var(--dim);font-size:12px}
  header .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  header a{color:var(--dim);font-size:12px;text-decoration:none;border:1px solid var(--line);
           padding:5px 10px;border-radius:6px}
  header a:hover{color:var(--ink);border-color:var(--accent)}
  .tab{background:none;border:1px solid var(--line);color:var(--dim);padding:6px 13px;
       border-radius:99px;cursor:pointer;font:inherit;font-size:12px}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#08111f;font-weight:600}
  .prog{height:4px;background:var(--panel2)}
  .prog div{height:100%;background:var(--ok);width:0;transition:width .25s}

  .wrap{max-width:1400px;margin:0 auto;padding:18px}
  .why{margin:0 0 16px;padding:11px 14px;border-left:3px solid var(--line);background:var(--panel);
       border-radius:0 8px 8px 0;color:var(--dim);font-size:13px}
  .why b{color:var(--ink)}
  h2{margin:0 0 3px;font-size:20px;font-family:ui-monospace,Menlo,monospace;color:var(--accent)}
  .claim{margin:0 0 14px;max-width:80ch}
  img.sheet{width:100%;border-radius:9px;border:1px solid var(--line);display:block;
            background:var(--panel2)}
  .strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .strip figure{margin:0}
  .strip img{width:100%;border-radius:6px;border:1px solid var(--line);display:block;cursor:pointer}
  .strip img.broke{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad);opacity:.6}
  .strip figcaption{font-size:11px;color:var(--dim);text-align:center;padding-top:3px;
                    font-family:ui-monospace,Menlo,monospace}
  .acts{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:16px 0 10px}
  .btn{border:0;border-radius:8px;padding:10px 18px;cursor:pointer;font:inherit;font-weight:600}
  .b-works{background:var(--ok);color:#06231a}
  .b-mixed{background:var(--warn);color:#2b1f06}
  .b-fails{background:var(--bad);color:#2b0f08}
  .b-skip,.b-ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
                   font-weight:400}
  textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
           border-radius:8px;padding:9px 11px;font:inherit;min-height:62px;resize:vertical}
  .hint{color:var(--dim);font-size:12px;margin-top:5px}
  .rev{margin-top:12px;font-size:12px;color:var(--dim)}
  .rev summary{cursor:pointer;color:var(--warn)}
  .done{padding:50px 18px;text-align:center;color:var(--dim)}
  kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;
      border-radius:5px;padding:1px 6px;font-size:11px;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<header>
  <h1>verify</h1><span class="sub" id="stat">loading…</span>
  <button class="tab on" id="tabCards">Capability cards</button>
  <button class="tab" id="tabTags">Tag examples</button>
  <button class="tab" id="tabDone">Already answered</button>
  <div class="right">
    <a href="/cast">cast</a>
    <a href="/styles">styles</a><a href="/places">Places</a><a href="/loras">loras</a><a href="/tags">tags</a><a href="/gallery">gallery</a><a href="/changelog">Changelog</a><a href="/docs">Docs</a><a href="/">library</a>
  </div>
</header>
<div class="prog"><div id="bar"></div></div>
<div class="wrap" id="wrap"></div>

<script>
let MODE="cards", CARDS={todo:[],done:[]}, TAGS=[], i=0, broke=new Set();
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const queue=()=>MODE==="cards"?CARDS.todo:MODE==="done"?CARDS.done:TAGS;

function bar(){
  const q=queue(), tot=MODE==="cards"?CARDS.total:TAGS.length+TAGSDONE;
  const done=MODE==="cards"?CARDS.done.length:TAGSDONE;
  $("bar").style.width=(tot?100*done/tot:0)+"%";
  $("stat").textContent=MODE==="cards"
    ? `${CARDS.done.length} of ${CARDS.total} cards verified · ${q.length} left`
    : `${TAGSDONE} of ${TAGS.length+TAGSDONE} tag examples judged · ${q.length} left`;
}
let TAGSDONE=0;

function draw(){
  const q=queue();
  bar();
  if(i>=q.length){
    $("wrap").innerHTML=`<div class="done"><h2 style="color:var(--ok)">nothing left here</h2>
      <p>${MODE==="cards"?"Every card with panels has a verdict."
          :MODE==="done"?"Nothing has been answered yet."
          :"Every tag example has been judged."}</p></div>`;
    return;
  }
  broke=new Set();
  (MODE==="tags") ? drawTag(q[i]) : drawCard(q[i]);
}

function drawCard(c){
  // YOU DO NOT NEED TO KNOW THE TERMS.
  //
  // The first version asked "does extreme_wide work?", which is unanswerable unless you
  // already know what extreme_wide is supposed to look like - and the cards exist to
  // TEACH that, so requiring it first was backwards.
  //
  // The question that matters most needs no expertise at all: are the options
  // distinguishable from each other? A variable whose options render identically is
  // broken no matter what the labels mean, and that is the single most common defect in
  // this set. So that is asked first, in plain language, and the expert judgement is
  // optional afterwards.
  const n=c.panels.length;
  $("wrap").innerHTML=`
    <div class="why"><b>You don't need to know these terms.</b> The question below is
      about whether the pictures are <em>different from each other</em> — that is what
      tells us the setting does anything at all. If you also happen to know whether it
      looks right, there is a second question. <b>"Not sure" is a real answer</b> and more
      useful than a guess.
      <br><br>
      <b>Nothing here is permanent.</b> A verdict is stored as data with who set it and
      when, it shows in a git diff, and it can be changed by answering again. It is a
      note for the next person, not a ruling.</div>

    <details class="rev" style="margin:0 0 16px">
      <summary>What actually goes wrong with these — all of it has happened here</summary>
      <table style="width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px">
        <tr><td style="padding:5px 8px;border-bottom:1px solid var(--line);width:34%">
          <b>A "none" option shows the effect anyway</b></td>
          <td style="padding:5px 8px;border-bottom:1px solid var(--line)">SDXL cannot
          negate. A clause reading "no lens flare" <b>adds</b> lens flare — the model reads
          the tokens, not the word "no". 77 panels were affected and rebuilt as blank
          controls.</td></tr>
        <tr><td style="padding:5px 8px;border-bottom:1px solid var(--line)">
          <b>Two options are the same instruction</b></td>
          <td style="padding:5px 8px;border-bottom:1px solid var(--line)">birds_eye and
          top_down say the same thing. So do circular and oval anamorphic. They will
          render as one picture twice.</td></tr>
        <tr><td style="padding:5px 8px;border-bottom:1px solid var(--line)">
          <b>The option fights the subject</b></td>
          <td style="padding:5px 8px;border-bottom:1px solid var(--line)">Options asking
          for "3boys" were stacked on a fixed subject reading "1boy, solo". The model
          resolves that contradiction at random.</td></tr>
        <tr><td style="padding:5px 8px;border-bottom:1px solid var(--line)">
          <b>Everything moved, not just the setting</b></td>
          <td style="padding:5px 8px;border-bottom:1px solid var(--line)">Changing any
          clause re-rolls the whole image even at a fixed seed, so panels can differ in
          ways nothing to do with the variable. This is the most common one.</td></tr>
        <tr><td style="padding:5px 8px"><b>The wording was jargon</b></td>
          <td style="padding:5px 8px">Some options were written in camera-department
          language instead of the tag vocabulary this model reads, so it ignored
          them.</td></tr>
      </table>
      <p style="margin:10px 0 0">You are not grading art. You are spotting mechanical
      failures, and they look like <b>"these two are the same picture"</b> or
      <b>"nothing changed"</b>.</p>
    </details>

    <h2>${esc(c.variable)}</h2>
    ${c.verdict?`<div style="margin:0 0 10px"><span class="hint">you answered</span>
      <b style="color:var(--accent)">${esc(c.verdict)}</b>
      <span class="hint">— answering again replaces it</span></div>`:""}
    <div class="hint" style="margin-bottom:3px">what this setting is supposed to do</div>
    <p class="claim">${esc(c.claim)}</p>

    ${c.sheet?`<img class="sheet" src="${esc(c.sheet)}" alt="">`
             :`<div class="strip">${c.panels.map(p=>`
                <figure><img src="${esc(p.sample)}" alt=""><figcaption>${esc(p.value)}</figcaption></figure>`
              ).join("")}</div>`}

    <h3 style="margin:20px 0 4px;font-size:15px">1. Are these ${n} pictures different from each other?</h3>
    <div class="hint" style="margin-bottom:8px">Ignore whether they look <em>good</em>.
      Just: could you tell them apart if the labels were removed?</div>
    <div class="acts" style="margin-top:0">
      <button class="btn b-works" data-v="works">Yes — clearly different</button>
      <button class="btn b-mixed" data-v="mixed">Some are, some look the same</button>
      <button class="btn b-fails" data-v="fails">No — they all look the same</button>
      <button class="btn b-ghost" data-v="unsure">Not sure</button>
      <button class="btn b-skip"  data-v="skip">Skip</button>
      <span class="hint" id="saving"></span>
    </div>

    ${c.panels.length?`
      <h3 style="margin:22px 0 4px;font-size:15px">2. Optional — is any single one obviously wrong?</h3>
      <div class="hint" style="margin-bottom:8px">Click a picture if it looks broken, or if
        it is a duplicate of the one next to it. Each shows what it was asked for.
        Skip this if you are not sure.</div>
      <div class="strip">${c.panels.map(p=>`
        <figure><img data-opt="${esc(p.value)}" src="${esc(p.sample)}" alt="">
        <figcaption><b>${esc(p.value)}</b>${p.control?" · control":""}<br>
        <span style="opacity:.75">${esc(p.clause||"—")}</span></figcaption></figure>`).join("")}</div>`:""}

    <h3 style="margin:22px 0 4px;font-size:15px">3. Optional — anything worth telling the next person?</h3>
    <textarea id="look" placeholder="e.g. 'the last two are identical' or 'the wide one loses the character completely'. Plain words are fine."></textarea>
    ${(c.review||[]).length?`<details class="rev"><summary>${c.review.length} note(s) written BEFORE these were rendered — predictions, not observations</summary>
      ${c.review.map(r=>`<p><b>${esc(r.issue||"")}</b><br>${esc(r.fix||"")}</p>`).join("")}</details>`:""}`;
  document.querySelectorAll("[data-opt]").forEach(el=>el.onclick=()=>{
    const v=el.dataset.opt;
    if(broke.has(v)){broke.delete(v); el.classList.remove("broke");}
    else{broke.add(v); el.classList.add("broke");}
  });
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>saveCard(c,b.dataset.v));
}

function drawTag(t){
  $("wrap").innerHTML=`
    <div class="why"><b>You don't need to know this term either.</b> Read the two lines
      below — they say what the tag is supposed to do — then look at the pair.
      <b>Left is without it, right is with it.</b> The only question is whether you can
      see that happening.</div>
    <h2>${esc(t.term)}</h2>
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:9px;
                padding:12px 15px;margin-bottom:14px;max-width:80ch">
      <div class="hint" style="margin:0 0 3px">what it means</div>
      <p style="margin:0 0 9px">${esc(t.means||"—")}</p>
      <div class="hint" style="margin:0 0 3px">so the right-hand picture should look…</div>
      <p style="margin:0"><b>${esc(t.does||"—")}</b></p>
    </div>
    ${t.example?`<img class="sheet" src="${esc(t.example)}?v=${Date.now()}" alt="">`
               :`<div class="done">no example rendered yet</div>`}
    <h3 style="margin:18px 0 4px;font-size:15px">Can you see that difference between the two?</h3>
    <div class="acts" style="margin-top:6px">
      <button class="btn b-works" data-t="good">Yes — keep it</button>
      <button class="btn b-mixed" data-t="reroll">No — they look the same</button>
      <button class="btn b-fails" data-t="slop">They differ, but it looks bad</button>
      <button class="btn b-ghost" data-t="unsure">Not sure</button>
      <button class="btn b-skip"  data-t="skip">Skip</button>
      <span class="hint" id="saving"></span>
    </div>
    <div class="hint">Both middle buttons reroll on a new seed — they are different
      problems though. <b>Look the same</b> means the comparison failed. <b>Looks bad</b>
      means it worked but the picture is not worth showing, and records that this tag
      needs a better base rather than just another roll.</div>
    <div class="hint">strength: <b>${esc(t.strength||"?")}</b>${
      t.negative_instead?" · belongs in the NEGATIVE prompt":""} · seed ${esc(t.example_seed||"?")}</div>`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>tagAct(t,b.dataset.t));
}

async function saveCard(c,v){
  if(v==="skip"){ i++; draw(); return; }
  $("saving").textContent="saving…";
  try{
    await fetch("/api/verify",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({slug:c.slug,verdict:v,look_at:$("look").value,
                           broken_options:[...broke]})});
    CARDS.done.push(c);
  }catch(e){ $("saving").textContent="failed: "+e.message; return; }
  i++; draw();
}

async function tagAct(t,act){
  if(act==="skip"||act==="unsure"){ i++; draw(); return; }
  if(act==="good"){ TAGSDONE++; i++; draw(); return; }
  $("saving").textContent="rerolling… ~6s";
  try{
    const j=await (await fetch("/api/tag/reroll",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({tag:t.id, reason:act})})).json();
    if(j.error){ $("saving").textContent=j.error; return; }
    t.example_seed=j.seed;
    draw();                     // same tag, new picture, judge again
  }catch(e){ $("saving").textContent="failed: "+e.message; }
}

document.onkeydown=e=>{
  if(e.target.tagName==="TEXTAREA") return;
  const q=queue(); if(i>=q.length) return;
  if(MODE==="cards"){
    if(e.key==="1") saveCard(q[i],"works");
    if(e.key==="2") saveCard(q[i],"mixed");
    if(e.key==="3") saveCard(q[i],"fails");
    if(e.key==="4"||e.key==="u") saveCard(q[i],"unsure");
    if(e.key==="s"){ i++; draw(); }
  }else{
    if(e.key==="1") tagAct(q[i],"good");
    if(e.key==="2"||e.key==="r") tagAct(q[i],"reroll");
    if(e.key==="3") tagAct(q[i],"slop");
    if(e.key==="4"||e.key==="u") tagAct(q[i],"unsure");
    if(e.key==="s"){ i++; draw(); }
  }
};

function setMode(m){
  MODE=m; i=0;
  $("tabCards").classList.toggle("on",m==="cards");
  $("tabTags").classList.toggle("on",m==="tags");
  $("tabDone").classList.toggle("on",m==="done");
  draw();
}
$("tabCards").onclick=()=>setMode("cards");
$("tabTags").onclick=()=>setMode("tags");
$("tabDone").onclick=()=>setMode("done");

(async function(){
  const [c,t]=await Promise.all([
    fetch("/api/verify/queue").then(r=>r.json()).catch(()=>({todo:[],done:[],total:0})),
    fetch("/api/tags").then(r=>r.json()).catch(()=>[]),
  ]);
  CARDS=c;
  TAGS=t.filter(x=>x.example);            // only judgeable if there is a picture
  setMode("cards");
})();
</script>
</body>
</html>
