<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>studio · verify</title>
<style>
  :root{--bg:#0f1115;--panel:#161a21;--panel2:#1c2129;--line:#272d38;--ink:#e6e9ef;
        --dim:#8b94a3;--accent:#6ea8fe;--ok:#4ec9a0;--warn:#e0b252;--bad:#e07a5f}
  @media (prefers-color-scheme:light){
    :root{--bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#dde1e8;--ink:#141821;--dim:#5d6470}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 18px;
         border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:9}
  header h1{margin:0;font-size:15px;letter-spacing:.07em;text-transform:uppercase}
  header .sub{color:var(--dim);font-size:12px}
  header .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  header a{color:var(--dim);font-size:12px;text-decoration:none;border:1px solid var(--line);
           padding:5px 10px;border-radius:6px}
  header a:hover{color:var(--ink);border-color:var(--accent)}
  .tab{background:none;border:1px solid var(--line);color:var(--dim);padding:6px 13px;
       border-radius:99px;cursor:pointer;font:inherit;font-size:12px}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#08111f;font-weight:600}
  .prog{height:4px;background:var(--panel2)}
  .prog div{height:100%;background:var(--ok);width:0;transition:width .25s}

  .wrap{max-width:1400px;margin:0 auto;padding:18px}
  .why{margin:0 0 16px;padding:11px 14px;border-left:3px solid var(--line);background:var(--panel);
       border-radius:0 8px 8px 0;color:var(--dim);font-size:13px}
  .why b{color:var(--ink)}
  h2{margin:0 0 3px;font-size:20px;font-family:ui-monospace,Menlo,monospace;color:var(--accent)}
  .claim{margin:0 0 14px;max-width:80ch}
  img.sheet{width:100%;border-radius:9px;border:1px solid var(--line);display:block;
            background:var(--panel2)}
  .strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .strip figure{margin:0}
  .strip img{width:100%;border-radius:6px;border:1px solid var(--line);display:block;cursor:pointer}
  .strip img.broke{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad);opacity:.6}
  .strip figcaption{font-size:11px;color:var(--dim);text-align:center;padding-top:3px;
                    font-family:ui-monospace,Menlo,monospace}
  .acts{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:16px 0 10px}
  .btn{border:0;border-radius:8px;padding:10px 18px;cursor:pointer;font:inherit;font-weight:600}
  .b-works{background:var(--ok);color:#06231a}
  .b-mixed{background:var(--warn);color:#2b1f06}
  .b-fails{background:var(--bad);color:#2b0f08}
  .b-skip,.b-ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
                   font-weight:400}
  textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
           border-radius:8px;padding:9px 11px;font:inherit;min-height:62px;resize:vertical}
  .hint{color:var(--dim);font-size:12px;margin-top:5px}
  .rev{margin-top:12px;font-size:12px;color:var(--dim)}
  .rev summary{cursor:pointer;color:var(--warn)}
  .done{padding:50px 18px;text-align:center;color:var(--dim)}
  kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;
      border-radius:5px;padding:1px 6px;font-size:11px;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<header>
  <h1>verify</h1><span class="sub" id="stat">loading…</span>
  <button class="tab on" id="tabCards">Capability cards</button>
  <button class="tab" id="tabTags">Tag examples</button>
  <div class="right">
    <a href="/tags">tags</a><a href="/gallery">gallery</a><a href="/">library</a>
  </div>
</header>
<div class="prog"><div id="bar"></div></div>
<div class="wrap" id="wrap"></div>

<script>
let MODE="cards", CARDS={todo:[],done:[]}, TAGS=[], i=0, broke=new Set();
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const queue=()=>MODE==="cards"?CARDS.todo:TAGS;

function bar(){
  const q=queue(), tot=MODE==="cards"?CARDS.total:TAGS.length+TAGSDONE;
  const done=MODE==="cards"?CARDS.done.length:TAGSDONE;
  $("bar").style.width=(tot?100*done/tot:0)+"%";
  $("stat").textContent=MODE==="cards"
    ? `${CARDS.done.length} of ${CARDS.total} cards verified · ${q.length} left`
    : `${TAGSDONE} of ${TAGS.length+TAGSDONE} tag examples judged · ${q.length} left`;
}
let TAGSDONE=0;

function draw(){
  const q=queue();
  bar();
  if(i>=q.length){
    $("wrap").innerHTML=`<div class="done"><h2 style="color:var(--ok)">nothing left here</h2>
      <p>${MODE==="cards"?"Every card with panels has a verdict.":"Every tag example has been judged."}</p></div>`;
    return;
  }
  broke=new Set();
  MODE==="cards"?drawCard(q[i]):drawTag(q[i]);
}

function drawCard(c){
  $("wrap").innerHTML=`
    <div class="why"><b>Does this variable actually do what the claim says?</b>
      Both predictions ever checked against these pixels turned out wrong, so your eyes
      here are worth more than any amount of reasoning about the option names.
      <kbd>1</kbd> works · <kbd>2</kbd> mixed · <kbd>3</kbd> fails · <kbd>s</kbd> skip</div>
    <h2>${esc(c.variable)}</h2>
    <p class="claim">${esc(c.claim)}</p>
    ${c.sheet?`<img class="sheet" src="${esc(c.sheet)}" alt="">`
             :`<div class="strip">${c.panels.map(p=>`
                <figure><img src="${esc(p.sample)}" alt=""><figcaption>${esc(p.value)}</figcaption></figure>`
              ).join("")}</div>`}
    ${c.panels.length?`<div class="hint" style="margin-top:10px">Click any option below that
      is broken or indistinguishable from its neighbour — that list is saved too.</div>
      <div class="strip" style="margin-top:6px">${c.panels.map(p=>`
        <figure><img data-opt="${esc(p.value)}" src="${esc(p.sample)}" alt="">
        <figcaption>${esc(p.value)}${p.control?" ·ctl":""}</figcaption></figure>`).join("")}</div>`:""}
    <div class="acts">
      <button class="btn b-works" data-v="works">Works</button>
      <button class="btn b-mixed" data-v="mixed">Mixed</button>
      <button class="btn b-fails" data-v="fails">Fails</button>
      <button class="btn b-skip"  data-v="skip">Skip</button>
      <span class="hint" id="saving"></span>
    </div>
    <textarea id="look" placeholder="What should someone notice here? (optional — this becomes the card's 'what to notice')"></textarea>
    ${(c.review||[]).length?`<details class="rev"><summary>${c.review.length} reviewer note(s) written before rendering</summary>
      ${c.review.map(r=>`<p><b>${esc(r.issue||"")}</b><br>${esc(r.fix||"")}</p>`).join("")}</details>`:""}`;
  document.querySelectorAll("[data-opt]").forEach(el=>el.onclick=()=>{
    const v=el.dataset.opt;
    if(broke.has(v)){broke.delete(v); el.classList.remove("broke");}
    else{broke.add(v); el.classList.add("broke");}
  });
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>saveCard(c,b.dataset.v));
}

function drawTag(t){
  $("wrap").innerHTML=`
    <div class="why"><b>Does this pair actually demonstrate the tag?</b>
      Left is without, right is with. If the difference is invisible — because the base
      image already had the effect, or the composition moved too much to compare — it is
      a bad example and should be rerolled on another seed. The definition stays either
      way; only the picture is at fault.
      <kbd>1</kbd> good · <kbd>r</kbd> reroll · <kbd>s</kbd> skip</div>
    <h2>${esc(t.term)}</h2>
    <p class="claim">${esc(t.does||t.means||"")}</p>
    ${t.example?`<img class="sheet" src="${esc(t.example)}?v=${Date.now()}" alt="">`
               :`<div class="done">no example rendered yet</div>`}
    <div class="acts">
      <button class="btn b-works" data-t="good">Good — keep it</button>
      <button class="btn b-mixed" data-t="reroll">Reroll — doesn't show the tag</button>
      <button class="btn b-fails" data-t="slop">Reroll — looks like slop</button>
      <button class="btn b-skip"  data-t="skip">Skip</button>
      <span class="hint" id="saving"></span>
    </div>
    <div class="hint">Two different rejections, because they are different problems.
      <b>Doesn't show the tag</b> means the comparison failed — the base already had the
      effect, or the composition moved too much to read. <b>Looks like slop</b> means the
      comparison worked but the picture is not worth showing. Both reroll; the second also
      records that this tag needs a better base.</div>
    <div class="hint">strength: <b>${esc(t.strength||"?")}</b>${
      t.negative_instead?" · belongs in the NEGATIVE prompt":""} · seed ${esc(t.example_seed||"?")}</div>`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>tagAct(t,b.dataset.t));
}

async function saveCard(c,v){
  if(v==="skip"){ i++; draw(); return; }
  $("saving").textContent="saving…";
  try{
    await fetch("/api/verify",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({slug:c.slug,verdict:v,look_at:$("look").value,
                           broken_options:[...broke]})});
    CARDS.done.push(c);
  }catch(e){ $("saving").textContent="failed: "+e.message; return; }
  i++; draw();
}

async function tagAct(t,act){
  if(act==="skip"){ i++; draw(); return; }
  if(act==="good"){ TAGSDONE++; i++; draw(); return; }
  $("saving").textContent="rerolling… ~6s";
  try{
    const j=await (await fetch("/api/tag/reroll",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({tag:t.id, reason:act})})).json();
    if(j.error){ $("saving").textContent=j.error; return; }
    t.example_seed=j.seed;
    draw();                     // same tag, new picture, judge again
  }catch(e){ $("saving").textContent="failed: "+e.message; }
}

document.onkeydown=e=>{
  if(e.target.tagName==="TEXTAREA") return;
  const q=queue(); if(i>=q.length) return;
  if(MODE==="cards"){
    if(e.key==="1") saveCard(q[i],"works");
    if(e.key==="2") saveCard(q[i],"mixed");
    if(e.key==="3") saveCard(q[i],"fails");
    if(e.key==="s"){ i++; draw(); }
  }else{
    if(e.key==="1") tagAct(q[i],"good");
    if(e.key==="r") tagAct(q[i],"reroll");
    if(e.key==="2") tagAct(q[i],"slop");
    if(e.key==="s"){ i++; draw(); }
  }
};

function setMode(m){
  MODE=m; i=0;
  $("tabCards").classList.toggle("on",m==="cards");
  $("tabTags").classList.toggle("on",m==="tags");
  draw();
}
$("tabCards").onclick=()=>setMode("cards");
$("tabTags").onclick=()=>setMode("tags");

(async function(){
  const [c,t]=await Promise.all([
    fetch("/api/verify/queue").then(r=>r.json()).catch(()=>({todo:[],done:[],total:0})),
    fetch("/api/tags").then(r=>r.json()).catch(()=>[]),
  ]);
  CARDS=c;
  TAGS=t.filter(x=>x.example);            // only judgeable if there is a picture
  setMode("cards");
})();
</script>
</body>
</html>
