<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>studio · library</title>
<style>
  :root{color-scheme:light dark;--bg:#0f1115;--panel:#161a21;--panel2:#1c2129;--line:#272d38;--ink:#e6e9ef;
        --dim:#8b94a3;--accent:#6ea8fe;--ok:#4ec9a0;--warn:#e0b252;--bad:#e07a5f}
  @media (prefers-color-scheme:light){
    :root{--bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#dde1e8;--ink:#141821;--dim:#5d6470}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:12px 18px;
         border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:30}
  header h1{margin:0;font-size:15px;letter-spacing:.07em;text-transform:uppercase}
  header .sub{color:var(--dim);font-size:12px}
  header .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  header a{color:var(--dim);font-size:12px;text-decoration:none;border:1px solid var(--line);
           padding:3px 9px;border-radius:6px}
  header a:hover{color:var(--ink);border-color:var(--accent)}
  #q{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:7px;
     padding:6px 10px;font:inherit;font-size:12.5px;min-width:220px}
  main{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;padding:16px;
       max-width:1800px;margin:0 auto}
  @media (max-width:860px){main{grid-template-columns:1fr}}
  aside{position:sticky;top:60px;align-self:start;max-height:calc(100vh - 76px);
        overflow:auto;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:10px 12px}
  .fac{margin-bottom:12px}
  .fac h3{margin:0 0 5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .fac button{display:flex;justify-content:space-between;width:100%;gap:8px;
    background:none;border:0;color:var(--ink);font:inherit;font-size:12.5px;
    padding:2px 5px;border-radius:5px;cursor:pointer;text-align:left}
  .fac button:hover{background:var(--panel2)}
  .fac button.on{background:var(--accent);color:#08111f;font-weight:600}
  .fac button span{color:var(--dim);font-variant-numeric:tabular-nums}
  .fac button.on span{color:#08111f}
  .fac .more{color:var(--accent);font-size:11.5px;cursor:pointer;padding:2px 5px}
  .grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
        align-content:start}
  .cell{background:var(--panel);border:1px solid var(--line);border-radius:9px;
        overflow:hidden;cursor:pointer;position:relative}
  .cell:hover{border-color:var(--accent)}
  .cell img,.cell video{width:100%;display:block;aspect-ratio:1;object-fit:cover;background:var(--panel2)}
  .cell .cap{padding:6px 8px;font-size:11px;color:var(--dim);white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis}
  .cell .kind{position:absolute;top:6px;right:6px;background:#000a;color:#fff;
              font-size:10px;padding:1px 6px;border-radius:20px;letter-spacing:.05em}
  .aud{display:flex;align-items:center;justify-content:center;aspect-ratio:1;
       background:var(--panel2);color:var(--dim);font-size:11px;letter-spacing:.08em}
  #libnav{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  #libnav h3{margin:0 0 5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  #libnav button{display:flex;justify-content:space-between;width:100%;gap:8px;
    background:none;border:0;color:var(--ink);font:inherit;font-size:12.5px;
    padding:3px 6px;border-radius:5px;cursor:pointer;text-align:left}
  #libnav button:hover{background:var(--panel2)}
  #libnav button.on{background:var(--accent);color:#08111f;font-weight:600}
  #libnav button span{color:var(--dim);font-variant-numeric:tabular-nums}
  .modelcard{grid-column:span 2;min-height:170px;padding:14px;display:flex;
    flex-direction:column;gap:6px;text-align:left}
  .modelcard h4{margin:0;font-size:15px}
  .modelcard .mrole{color:var(--accent);font-size:12px}
  .modelcard .mdesc{font-size:12px;color:var(--dim);line-height:1.45;flex:1}
  .modelcard .mfacts{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
  .modelcard .mfacts b{color:var(--fg)}
  .modelcard.unreachable{outline:1px dashed #a33}
  #libnav button.on span{color:#08111f}
  .fac h3.link{cursor:pointer}
  .fac h3.link:hover{color:var(--accent)}
  .applied{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;
           padding:8px 11px;background:var(--panel);border:1px solid var(--line);
           border-radius:9px}
  .applied .lbl{color:var(--dim);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
  .applied .f{background:var(--accent);color:#08111f;border:0;border-radius:20px;
    padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;font-weight:600}
  .applied .f span{opacity:.7;margin-left:5px}
  .applied .clear{background:none;border:1px solid var(--line);color:var(--dim);
    border-radius:20px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
  .cardgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .cd{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .cd:hover{border-color:var(--accent)}
  .cd .big{aspect-ratio:1;background:var(--panel2);cursor:pointer;position:relative}
  .cd .big img,.cd .big video{width:100%;height:100%;object-fit:cover;display:block}
  .cd .none{display:flex;align-items:center;justify-content:center;height:100%;
            color:var(--warn);font-size:11.5px;text-align:center;padding:12px}
  .cd .rot{position:absolute;bottom:6px;right:6px;background:#000b;color:#fff;border:0;
           border-radius:20px;font-size:11px;padding:2px 9px;cursor:pointer}
  .cd .b{padding:8px 11px}
  .cd .b h3{margin:0;font-size:13px}
  .cd .b p{margin:3px 0 0;color:var(--dim);font-size:11.5px;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cd .n{color:var(--dim);font-size:11px;margin-top:5px}
  .star{position:absolute;top:6px;left:6px;background:#000a;border:0;color:#fff;
        border-radius:20px;width:26px;height:26px;font-size:14px;cursor:pointer;line-height:1}
  .star.on{background:var(--warn);color:#1a1206}
  .star.rej{left:auto;right:6px;top:34px}
  .star.rej:hover{background:var(--bad);color:#fff}
  .focus{background:var(--panel);border:1px solid var(--accent);border-radius:10px;
         padding:11px 14px;margin-bottom:13px}
  .focus h2{margin:0 0 3px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .focus p{margin:0;color:var(--dim);font-size:12.5px}
  .cell.inset{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .cell.inset .cap{color:var(--accent);font-weight:600;white-space:normal}
  .focus b{color:var(--ink)}
  .more-btn{margin:16px auto;display:block;background:var(--panel);border:1px solid var(--line);
    color:var(--ink);border-radius:8px;padding:9px 20px;font:inherit;cursor:pointer}
  /* detail */
  /* colour AND background, both explicit. With background:transparent and no colour, the
     dialog inherited the browser's UA default CanvasText - measured as rgb(0,0,0) - and
     drew black text over the dark panel painted by .sheet behind it. That is the "black
     font on grey" this fixes. color-scheme on :root makes the UA defaults follow the
     palette too, so a control I forget to style cannot reintroduce it. */
  dialog{border:0;padding:0;background:transparent;color:var(--ink);
         max-width:min(1500px,96vw);width:100%}
  dialog *{color:inherit}
  .sheet{color:var(--ink)}
  .row .k{color:var(--dim)}
  .meta .sub{color:var(--dim)}
  .note{color:var(--dim)}
  dialog::backdrop{background:#000c}
  .sheet{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);
         background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
         max-height:92vh}
  @media (max-width:900px){.sheet{grid-template-columns:1fr}}
  .big{background:#000;display:flex;align-items:center;justify-content:center;min-height:340px}
  .big img,.big video{max-width:100%;max-height:88vh;display:block}
  .meta{padding:16px 18px;overflow:auto}
  .meta h2{margin:0 0 3px;font-size:15px;word-break:break-word}
  .meta .sub{color:var(--dim);font-size:12px;margin-bottom:12px}
  .row{margin-bottom:10px}
  .row .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .row .v{font-size:13px;white-space:pre-wrap;word-break:break-word}
  .row .v.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;
        padding:2px 10px;font-size:11.5px;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--accent)}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .acts button,.acts a{background:var(--accent);color:#08111f;border:0;border-radius:7px;
    padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;font-size:12.5px}
  .acts .alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:400}
  .close{position:absolute;top:10px;right:14px;background:#000a;color:#fff;border:0;
         border-radius:20px;width:30px;height:30px;font-size:17px;cursor:pointer;z-index:5}
  pre.wf{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;
     font-size:11px;max-height:340px;overflow:auto;white-space:pre;margin:0}
  .note{color:var(--dim);font-size:11.5px;margin:6px 0}
  .reasonbox{position:absolute;z-index:60;width:320px;background:var(--panel);
    border:1px solid var(--accent);border-radius:10px;padding:11px 12px;
    box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .reasonbox h4{margin:0 0 7px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--dim)}
  .reasonbox button{display:block;width:100%;text-align:left;background:var(--panel2);
    border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 8px;
    font:inherit;font-size:12.5px;cursor:pointer;margin-bottom:4px}
  .reasonbox button:hover{border-color:var(--accent)}
  .reasonbox input{width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--ink);border-radius:6px;padding:5px 8px;font:inherit;font-size:12px;margin-top:4px}
  .reasonbox .rowend{text-align:right;margin-top:6px}
  .reasonbox .cancel{display:inline-block;width:auto;background:none;color:var(--dim)}
.audcard h4{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.audcard .cat{font-size:11px;font-weight:400;color:var(--accent);text-transform:uppercase;
  letter-spacing:.06em;white-space:nowrap}
.audcard audio{width:100%;margin-top:8px;height:32px}
.audcard .kw{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}
.audcard .kw span{font-size:10px;color:var(--dim);border:1px solid var(--line);
  border-radius:9px;padding:1px 7px}
.audcard .kw span.g{color:var(--accent);border-color:var(--accent)}
.audcard .kw span.u{color:var(--dim);border-style:dashed}
.audcard .mfacts{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:6px}
.audcard .noaud{margin-top:8px;font-size:11px;color:var(--dim);font-style:italic}
.audcard.blocked{opacity:.62}
.craftcard h4{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
  /* a long variable name must wrap rather than shove the family badge off the card */
  min-width:0;word-break:break-all}
.craftcard h4 .cat{flex:0 0 auto;word-break:normal}
.craftcard .panels{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:4px}
.craftcard .panels figure{margin:0;flex:0 0 108px}
.craftcard .panels img{width:108px;height:108px;object-fit:cover;border-radius:5px;
  background:var(--line);display:block}
.craftcard .panels figcaption{font-size:10px;color:var(--dim);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.craftcard .panels figure.ctl img{outline:2px solid var(--accent);outline-offset:-2px}
.craftcard .notvis{margin-top:8px;font-size:11px;color:var(--dim);font-style:italic;
  border-left:2px solid var(--line);padding-left:8px}
#subnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
#subnav .chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);
  border-radius:99px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer}
#subnav .chip:hover{color:var(--ink);border-color:var(--accent)}
#subnav .chip.on{background:var(--accent);border-color:var(--accent);color:#0f1115}
#subnav .chip span{opacity:.65;margin-left:5px;font-size:11px}
#subnav .sub2{width:100%;display:flex;flex-wrap:wrap;gap:6px;
  padding-left:10px;border-left:2px solid var(--line)}
#subnav .sub2 .chip{border-radius:6px;padding:3px 9px;font-size:11px}
#libnav h3 em, #facets h3 em{display:block;font-style:normal;font-weight:400;
  text-transform:none;letter-spacing:0;color:var(--dim);font-size:10px;margin-top:1px}
.audcard{position:relative}
.flagbtn{position:absolute;right:10px;bottom:10px;background:var(--panel2);
  border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:2px 9px;
  font:inherit;font-size:10px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.flagbtn:hover{color:var(--ink);border-color:var(--warn)}
.flagbtn.on{background:var(--warn);border-color:var(--warn);color:#0f1115}
.audcard.flagged{border-color:var(--warn)}
.audcard .take{display:flex;align-items:center;gap:7px;margin-top:6px}
.audcard .take span{font-size:10px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.05em;white-space:nowrap;min-width:44px}
.audcard .take audio{flex:1;margin-top:0}
</style>
</head>
<body>
<header>
  <h1>Library</h1><span class="sub" id="stat">loading…</span>
  <input id="q" placeholder="search prompts, styles, characters…">
  <label class="sub" style="display:flex;gap:5px;align-items:center">per page
    <select id="per"></select></label>
  <button id="back" style="display:none;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:6px;padding:3px 10px;font:inherit;font-size:12px;
    cursor:pointer" title="back to the last view">&larr; back</button>
  <span class="right"><a href="/">home</a><a href="/gallery">gallery</a><a href="/make3d">make 3d</a></span>
</header>
<main>
  <aside><div id="libnav"></div><div id="facets"></div></aside>
  <div><div class="applied" id="applied" style="display:none"></div>
       <div id="focus"></div><div id="subnav" style="display:none"></div>
       <div class="cardgrid" id="cardgrid" style="display:none"></div>
       <div class="grid" id="grid"></div><button class="more-btn" id="more" style="display:none">show more</button></div>
</main>

<dialog id="dlg"><div class="sheet" style="position:relative">
  <button class="close" id="x">&times;</button>
  <div class="big" id="big"></div>
  <div class="meta" id="meta"></div>
</div></dialog>

<script>
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let D=null, sel={}, shown=0, view=[], PAGE=100, q="";
let MODE="frames", BROWSE=null, FAVS=new Set(), ROT={}, SETWHY=new Map();
let HIST = [];
// Where a new card of each kind gets authored. Characters have a real page; the rest do
// not yet, so they point at /generate rather than at a route that does not exist.
const NEWPAGE = {characters:"/newchar", places:"/generate", styles:"/generate",
                 looks:"/generate", emotions:"/generate", motions:"/generate",
                 cameras:"/generate"};

function snapshot(){
  return {MODE, sel: Object.fromEntries(Object.entries(sel).map(([k,v])=>[k,[...(v||[])]])), q};
}
function pushHist(){
  const s = snapshot();
  const last = HIST[HIST.length-1];
  if (last && JSON.stringify(last) === JSON.stringify(s)) return;
  HIST.push(s);
  if (HIST.length > 40) HIST.shift();
  drawBack();
}
function drawBack(){
  const b = document.getElementById("back");
  if (b) b.style.display = HIST.length > 1 ? "inline-block" : "none";
}
function goBack(){
  if (HIST.length < 2) return;
  HIST.pop();                       // the view we are in
  const s = HIST[HIST.length-1];    // the one before it
  sel = Object.fromEntries(Object.entries(s.sel).map(([k,v])=>[k,new Set(v)]));
  q = s.q; document.getElementById("q").value = q;
  MODE = s.MODE;
  drawBack();
  setMode(MODE, true);
}
// The card kinds that can be browsed one-per-card. Ordered by how often you reach for them.
const KINDS=[["model","models"],["place","places"],["character","characters"],["style","styles"],
             ["look","looks"],["emotion","emotions"],["motion","motions"],["camera","cameras"],
             // the sound department - cards you listen to rather than look at
             ["sfx","sfx"],["song","songs"],["cue","cues","beds"],["voice","voices"],
             ["soundscape","soundscapes"],
             // the director-craft encyclopedia
             ["craft","cards"]];
const AUDIOKINDS=["sfx","cues","voices","soundscapes","songs"];
const PAGE_SIZES=[60,100,300,1000];
const OPEN = {};   // which facets are expanded

function matches(it){
  for (const [f,vals] of Object.entries(sel)){
    // `vals` can be undefined: facetCounts temporarily blanks a facet and restores the
    // previous value, which for an untouched facet IS undefined - and assigning undefined
    // creates an own property, so Object.entries hands it back. Reading .size on it threw
    // before a single cell was drawn, and the failure was invisible because the page's own
    // catch turned it into a status line nobody reads.
    if (!vals || !vals.size) continue;
    if (!vals.has(String(it[f]==null?"":it[f]))) return false;
  }
  if (q){
    const hay = (it.prompt||"")+" "+(it.style||"")+" "+(it.character||"")+" "+
                (it.place||"")+" "+(it.name||"");
    if (!hay.toLowerCase().includes(q)) return false;
  }
  return true;
}

function facetCounts(){
  // Counts reflect the CURRENT filter, so a facet value that would return nothing is
  // visibly zero instead of promising results it cannot deliver.
  const out={};
  for (const f of Object.keys(D.facets)) out[f]={};
  for (const it of D.items){
    for (const f of Object.keys(D.facets)){
      const save=sel[f]; sel[f]=new Set();          // ignore this facet's own filter
      const ok=matches(it);
      if (save===undefined) delete sel[f]; else sel[f]=save;
      if (!ok) continue;
      const v=String(it[f]==null?"":it[f]);
      if (v) out[f][v]=(out[f][v]||0)+1;
    }
  }
  return out;
}

function drawFacets(){
  const live=facetCounts();
  document.getElementById("facets").innerHTML = Object.keys(D.facets).map(f=>{
    const HINT={domain:"every file ever rendered"};
    const all=Object.keys(D.facets[f]);
    const rows=all.map(v=>[v, live[f][v]||0]).sort((a,b)=>b[1]-a[1]);
    const lim = OPEN[f] ? rows.length : 8;
    const on = sel[f]||new Set();
    // The heading is a link to that kind's card view. Clicking "PLACE" to see the places
    // is the obvious gesture, and it was doing nothing.
    const kind = (KINDS.find(([ff]) => ff === f) || [])[1];
    return `<div class="fac"><h3${kind?` class="link" data-jump="${kind}" title="see all ${kind}"`:""}>${
      esc(f)}${kind?" →":""}${HINT[f]?`<em>${HINT[f]}</em>`:""}</h3>` +
      rows.slice(0,lim).map(([v,n])=>
        `<button data-f="${esc(f)}" data-v="${esc(v)}" class="${on.has(v)?"on":""}">
           <span style="color:inherit;overflow:hidden;text-overflow:ellipsis">${esc(v)}</span>
           <span>${n}</span></button>`).join("") +
      (rows.length>lim?`<div class="more" data-open="${esc(f)}">+${rows.length-lim} more</div>`
        :(OPEN[f]&&rows.length>8?`<div class="more" data-open="${esc(f)}">less</div>`:"")) +
      `</div>`;
  }).join("");
  // LEFT CLICK REPLACES, RIGHT CLICK ADDS.
  //
  // Clicking used to accumulate, so moving from one place to another meant unselecting the
  // first, and browsing turned into filter admin. Switching is the common act and is now
  // one click; a compound filter is the rarer one and asks for a right click. Clicking the
  // value that is already the only selection clears it.
  document.querySelectorAll("#facets button").forEach(b=>{
    const f=b.dataset.f, v=b.dataset.v;
    const go = () => {
      if (MODE!=="frames" && MODE!=="starred"){ setMode("frames"); return; }
      apply();
    };
    b.onclick = () => {
      pushHist();
      const only = sel[f] && sel[f].size===1 && sel[f].has(v);
      sel = {};
      if (!only) sel[f] = new Set([v]);
      go();
    };
    b.oncontextmenu = e => {
      e.preventDefault();
      sel[f] = sel[f] || new Set();
      sel[f].has(v) ? sel[f].delete(v) : sel[f].add(v);
      go();
    };
  });
  document.querySelectorAll("#facets [data-jump]").forEach(h=>h.onclick=()=>setMode(h.dataset.jump));
  document.querySelectorAll("#facets .more").forEach(d=>d.onclick=()=>{
    OPEN[d.dataset.open]=!OPEN[d.dataset.open]; drawFacets();
  });
}

function cellHTML(it){
  const media = it.kind==="video"
    ? `<video src="${esc(it.url)}" muted preload="metadata"></video>`
    : it.kind==="audio"
      ? `<div class="aud">${esc((it.domain||"audio").toUpperCase())}</div>`
      : `<img src="${esc(it.url)}" loading="lazy" alt="">`;
  const why = SETWHY.get(it.id);
  return `<div class="cell${why?" inset":""}" data-id="${esc(it.id)}">${media}
    <button class="star ${FAVS.has(it.id)?"on":""}" data-star="${esc(it.id)}"
            title="star">${FAVS.has(it.id)?"★":"☆"}</button>
    <button class="star rej" data-reject="${esc(it.id)}"
            title="does not belong in this card - moves it out of the library">✕</button>
    <span class="kind">${esc(it.domain||it.kind)}</span>
    <div class="cap">${esc(why || it.style || it.name)}</div></div>`;
}

function soleFacet(){
  // Exactly one facet, exactly one value. Two selections means the question is "these
  // together", and sorting by how ALONE one of them is would be answering something else.
  const on = Object.entries(sel).filter(([f,v]) => v && v.size);
  return (on.length===1 && on[0][1].size===1) ? on[0][0] : null;
}

function drawSet(f){
  // THE SET FIRST, IN ORDER, THEN THE REST. Sorting by one number put four close-ups at the
  // top because they happened to be cleanest; a set answers "have I got every angle, in a
  // few styles, in a few places" at a glance, which is the actual question.
  const on = sel[f] && sel[f].size === 1 ? [...sel[f]][0] : null;
  const box = document.getElementById("focus");
  if (!on) return false;
  fetch(`/api/library/set?facet=${encodeURIComponent(f)}&value=${encodeURIComponent(on)}`)
    .then(r=>r.json()).then(s=>{
      if (s.error || !s.set || !s.set.length) return;
      const axes = s.axes.map(a=>`${esc(a.axis)} ${a.got}/${a.want}`).join(" · ");
      box.innerHTML = `<div class="focus"><h2>The ${esc(f)} set — ${esc(on)}</h2>
        <p>${s.complete?"complete":"INCOMPLETE"} · ${axes} · ${s.extra_count} more beyond the
           set. Bordered cards below are the set; the caption says what each one adds.</p></div>`;
      // NO SEPARATE STRIP. A row of 132px thumbnails is a worse view of a picture than the
      // grid already gives, so the set is marked IN the grid at full size - a border, and
      // the reason it is in the set written under the card. Same pictures, one place to look.
      const before = new Set(SETWHY.keys());
      SETWHY = new Map(s.set.map(x => [x.id, x.why]));
      // A rejected set member gets REPLACED: the cover is recomputed and the next best
      // frame for that axis is promoted. That is the "where did this come from" - it is
      // not random, it is the set healing itself, and now it says so.
      if (before.size){
        const promoted = s.set.filter(x => !before.has(x.id));
        if (promoted.length){
          const p = document.querySelector(".focus p");
          if (p) p.insertAdjacentHTML("beforeend",
            `<br><b style="color:var(--warn)">Promoted into the set: ` +
            promoted.map(x=>esc(x.why)).join(", ") + `</b>`);
        }
      }
      const rank = new Map(s.set.map((x,i)=>[x.id,i]));
      view.sort((a,b)=>(rank.has(a.id)?rank.get(a.id):9999)-(rank.has(b.id)?rank.get(b.id):9999));
      shown=0; document.getElementById("grid").innerHTML=""; more();
    });
  return true;
}

function drawFocus(f){
  const box = document.getElementById("focus");
  if (!f || !D.items.length){ box.innerHTML = ""; return; }
  const best = view.length ? (view[0].purity||{})[f] : null;
  if (best == null){ box.innerHTML = ""; return; }
  const n = view.filter(x => ((x.purity||{})[f]) === best).length;
  const LABEL = {place:"place", character:"character", style:"style",
                 look:"look", emotion:"emotion", motion:"motion"}[f] || f;
  // Say what the purest available ACTUALLY is. A place whose cleanest frame still has a
  // character and a grade in it is not a clean plate, and calling it one would be the
  // library flattering itself.
  const what = best === 0
    ? `<b>${n}</b> with nothing else in the frame — a clean plate.`
    : `the closest we have still carries <b>${best}</b> other layer${best>1?"s":""}
       (${n} at that level). Nothing here shows this ${LABEL} alone yet.`;
  box.innerHTML = `<div class="focus"><h2>Just the ${esc(LABEL)}</h2>
    <p>Sorted so the frames with the fewest competing layers come first — ${what}</p></div>`;
}

function drawModes(){
  // The library list lives in the sidebar, above the filters, because it IS the navigation:
  // "show me the places" is the same kind of act as "filter to this place", and having one
  // in a top strip and the other in a column made them look unrelated.
  const n = D ? D.facets : {};
  document.getElementById("libnav").innerHTML =
    `<h3>library <em>cards you pick from</em></h3>` +
    `<button data-k="frames" class="${MODE==="frames"?"on":""}">all frames<span>${
        D?D.total.toLocaleString():""}</span></button>` +
    `<button data-k="starred" class="${MODE==="starred"?"on":""}">starred<span>${
        FAVS.size||""}</span></button>` +
    KINDS.map(([f,k,label]) => `<button data-k="${k}" class="${MODE===k?"on":""}">${label||k}<span>${
        (D&&D.kind_counts&&D.kind_counts[f])||""}</span></button>`).join("");
  document.querySelectorAll("#libnav button").forEach(b => b.onclick = () => setMode(b.dataset.k));
}

function drawApplied(){
  // Every active filter, visible and removable. Buried in a sidebar, a filter you forgot
  // you set looks like a library that lost half its contents.
  const box=document.getElementById("applied");
  const on=[];
  for (const [f,vals] of Object.entries(sel)) for (const v of (vals||[])) on.push([f,v]);
  if (q) on.push(["search", q]);
  if (!on.length){ box.style.display="none"; box.innerHTML=""; return; }
  box.style.display="flex";
  box.innerHTML = `<span class="lbl">filters <span style="opacity:.65">right-click to add</span></span>` + on.map(([f,v]) =>
      `<button class="f" data-f="${esc(f)}" data-v="${esc(v)}">${esc(f)}: ${esc(v)}<span>&times;</span></button>`
    ).join("") + `<button class="clear">clear all</button>`;
  box.querySelectorAll(".f").forEach(b => b.onclick = () => {
    if (b.dataset.f==="search"){ q=""; document.getElementById("q").value=""; }
    else sel[b.dataset.f].delete(b.dataset.v);
    apply();
  });
  box.querySelector(".clear").onclick = () => {
    sel={}; q=""; document.getElementById("q").value=""; apply();
  };
}

function setMode(k, replaying){
  MODE=k;
  if (!replaying) pushHist();
  const frames = (k==="frames"||k==="starred");
  document.getElementById("cardgrid").style.display = frames?"none":"grid";
  document.getElementById("grid").style.display = frames?"grid":"none";
  document.getElementById("more").style.display = "none";
  // The facet groups STAY in browse mode too. Browsing places and seeing the list of
  // places is not a contradiction - it is the same library from two angles, and hiding one
  // the moment you look at the other throws away your bearings. A parent and a child
  // cannot both filter, so clicking a child simply leaves the parent behind.
  document.getElementById("facets").style.display = "block";
  drawModes();
  if (frames){ apply(); return; }
  drawFacets();                 // the list stays, so it still needs drawing
  drawApplied();
  document.getElementById("focus").innerHTML="";
  document.getElementById("applied").style.display="none";
  CATSEL=null; SUBSEL=null;      // a category from the previous kind matches nothing here
  document.getElementById("subnav").style.display="none";
  document.getElementById("stat").textContent = "loading "+k+"…";
  fetch("/api/library/browse?kind="+encodeURIComponent(k)).then(r=>r.json()).then(b=>{
    if (b.error){ document.getElementById("stat").textContent=b.error; return; }
    BROWSE=b;
    if(k==="models"){ document.getElementById("subnav").style.display="none";
      // Phase 5: a model card is earned by content and read like a spec sheet, so it
      // renders big - role, dialect, size, reachability, strengths - not as a thumb.
      document.getElementById("stat").textContent = `${b.total} models`;
      document.getElementById("cardgrid").innerHTML = b.cards.map(c=>{
        const d=c.card||c, un=d.reachable===false&&(d.workflows||[]).length>0;
        return `<div class="cd modelcard ${un?"unreachable":""}">
          <h4>${esc(d.name||d.id)} <span style="color:var(--dim);font-weight:400">${d.size_gb?d.size_gb+" GB":""}</span></h4>
          <div class="mrole">${esc(d.role||"")}</div>
          <div class="mdesc">${esc(d.desc||"")}${d.strengths?"<br><b>Good:</b> "+esc(d.strengths):""}${d.weaknesses?"<br><b>Weak:</b> "+esc(d.weaknesses):""}</div>
          <div class="mfacts">
            ${d.engine?`<span>engine <b>${esc(d.engine)}</b></span>`:""}
            ${d.dialect?`<span>dialect <b>${esc(d.dialect)}</b></span>`:""}
            <span>status <b>${esc(d.status||"?")}</b></span>
            <span>${un?"<b>unreachable - no code loads its workflows</b>":((d.workflows||[]).length?`workflows <b>${d.workflows.length}</b>`:"prompted directly")}</span>
          </div>
        </div>`;
      }).join("") || "<p>no model cards - run studio/_tools/model_cards.py</p>";
      return;
    }
    if(k==="cards"){
      const renderCraft=()=>{
      // A reference page, not a thumbnail grid: the claim is the content and the panels
      // are the evidence for it. Panels lazy-load - 1067 images is not a first paint.
      const LIST=applyCat(b.cards);
      const withp=LIST.filter(c=>(c.panels||[]).length).length;
      document.getElementById("stat").textContent =
        `${LIST.length===b.total?b.total:LIST.length+" of "+b.total} craft variables · ` +
        `${withp} with panels · ${LIST.length-withp} not visual in one frame`;
      document.getElementById("cardgrid").innerHTML = LIST.map(c=>{
        const ps=c.panels||[];
        const strip = ps.length
          ? `<div class="panels">${ps.map(p=>`<figure${p.control?' class="ctl"':''}>
               <img loading="lazy" src="${esc(p.sample||"")}" alt="${esc(p.value||"")}">
               <figcaption>${esc(p.value||"")}${p.control?" ·  control":""}</figcaption>
             </figure>`).join("")}</div>`
          // Not a gap. These 72 cards say why a single frame cannot carry them, and that
          // sentence is the most useful thing on the card.
          : `<div class="notvis">${esc(c.not_visual||"no panels rendered")}</div>`;
        return `<div class="cd craftcard">
          <h4>${esc(c.variable||c.id)}<span class="cat">${esc(c.category||"")}</span></h4>
          <div class="mdesc">${esc(c.claim||c.desc||"")}</div>
          ${strip}
        </div>`;
      }).join("") || "<p>nothing in this family</p>";
      drawSubnav(b, renderCraft);
      };
      renderCraft();
      return;
    }
    if(AUDIOKINDS.includes(k)){
      const renderAudio=()=>{
      // Heard, not looked at. Same reasoning as the model branch above: these cards have
      // no frames, so a thumbnail grid would show a wall of blanks. The backend sorts
      // them by category, so they arrive grouped and each one wears its category.
      const LIST=applyCat(b.cards);
      const playable=LIST.filter(c=>c.audio).length;
      // Soundscapes are mix recipes and own no audio, so "N playable" would be counting
      // the absence of something they were never meant to have.
      // the folder is called cues; nobody shopping for a track thinks "cue"
      const LABEL={cues:"beds"};
      const shown = LIST.length===b.total ? `${b.total}` : `${LIST.length} of ${b.total}`;
      document.getElementById("stat").textContent = b.kind==="soundscapes"
        ? `${shown} soundscapes · mix recipes, not sounds`
        : `${shown} ${LABEL[b.kind]||b.kind} · ${playable} playable`;
      document.getElementById("cardgrid").innerHTML = LIST.map(c=>{
        const d=c.card||c;
        // genre and use are separate rows of pills from the loose keywords, because
        // they are the two things you actually filter a music library by
        const pills=(s,cls)=>(s||"").split(/\s+/).filter(Boolean)
                 .map(w=>`<span class="${cls}">${esc(w)}</span>`).join("");
        const kw = c.instruments
          ? pills((c.instruments||"").replace(/,\s*/g," "),"g")
          : (c.genre||c.use ? pills(c.genre,"g")+pills(c.use,"u")
                            : pills(c.keywords,""));
        const facts=[
          // music: the axes it is filed and shopped by
          c.subcategory?`<b>${esc(c.subcategory)}</b>`:"",
          c.vocal&&c.vocal!=="none"?`<b>${esc(c.vocal)} vocal</b>`:"",
          c.has_lyrics?`<b>lyrics</b>`:"",
          c.energy?`energy <b>${esc(c.energy)}</b>`:"",
          c.tempo?`tempo <b>${esc(c.tempo)}</b>`:"",
          (d.bpm!==undefined&&d.bpm!==null&&d.bpm!=="")?`bpm <b>${esc(String(d.bpm))}</b>`:"",
          d.key?`key <b>${esc(d.key)}</b>`:"",
          d.seconds?`<b>${esc(String(d.seconds))}s</b>`:"",
          d.engine?`engine <b>${esc(d.engine)}</b>`:"",
          // a soundscape IS its mix parameters - that is the whole card
          d.bed_level!==undefined?`bed <b>${esc(String(d.bed_level))}</b>`:"",
          d.music_level!==undefined?`music <b>${esc(String(d.music_level))}</b>`:"",
          d.duck!==undefined?`duck <b>${esc(String(d.duck))}</b>`:"",
          d.reverb?`reverb <b>${esc(d.reverb)}</b>`:"",
          d.ambience?`bed: ${esc(d.ambience)}`:""
        ].filter(Boolean).map(s=>`<span>${s}</span>`).join("");
        // A blocked voice is listed but has nothing to play, and says why. That is the
        // intended state - the four likeness packs are visible so nobody re-adds them by
        // accident, and their reference audio is never served.
        // Every take gets its own player, labelled. One card, several performances -
        // which is what a second take is for.
        const takes = (c.takes||[]).map(t2 =>
          `<div class="take"><span>take ${esc(t2.take)}</span>
             <audio controls preload="none" src="${esc(t2.url)}"></audio></div>`).join("");
        const player = c.audio
          ? `<div class="take${takes?" first":""}">${takes?"<span>take 1</span>":""}
               <audio controls preload="none" src="${esc(c.audio)}"></audio></div>${takes}`
          : `<div class="noaud">${c.status==="blocked"
               ? "blocked - reference audio is not served"
               : (b.kind==="soundscapes"
                  ? "a mix recipe, not a sound - see the levels above"
                  : "no sample rendered yet")}</div>`;
        // Raised where you hear the problem. Same store the CLI writes, so a flag set
        // here shows up in `remake.py --list` and is cleared by `--run`.
        const flagged = !!(d.remake);
        const flagBtn = c.audio
          ? `<button class="flagbtn${flagged?" on":""}" data-kind="${esc(b.kind)}"
               data-id="${esc(c.id)}" title="${flagged
                 ? "flagged: "+esc(d.remake.reason||"")+" — click to unflag"
                 : "mark this take bad, then run remake.py --run"}">${
                 flagged?"flagged":"flag"}</button>`
          : "";
        return `<div class="cd audcard ${c.status==="blocked"?"blocked":""}${flagged?" flagged":""}">
          <h4>${esc(c.name||c.id)}<span class="cat">${esc(c.category||"-")}</span></h4>
          ${flagBtn}
          <div class="mdesc">${esc(c.desc||"")}</div>
          ${kw?`<div class="kw">${kw}</div>`:""}
          ${facts?`<div class="mfacts">${facts}</div>`:""}
          ${player}
        </div>`;
      }).join("") || "<p>nothing in this category</p>";
      document.querySelectorAll(".flagbtn").forEach(btn => btn.onclick = () => {
        const on = !btn.classList.contains("on");
        const reason = on
          ? (prompt("What is wrong with this one?", "scratchy / static") || "").trim()
          : "";
        if (on && !reason) return;             // cancelled - do not flag blindly
        btn.disabled = true;
        fetch("/api/remake", {method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({kind: btn.dataset.kind, id: btn.dataset.id,
                                on: on, reason: reason})})
          .then(r=>r.json()).then(res=>{
            btn.disabled = false;
            if (res.error) { alert(res.error); return; }
            btn.classList.toggle("on", on);
            btn.textContent = on ? "flagged" : "flag";
            btn.closest(".audcard").classList.toggle("flagged", on);
          }).catch(e=>{ btn.disabled=false; alert(e); });
      });
      drawSubnav(b, renderAudio);
      };
      renderAudio();
      return;
    }
    document.getElementById("subnav").style.display="none";
    drawCards();
  });
}

// Which category chip is selected, and which subcategory under it. Reset whenever the
// kind changes - keeping "weapons" selected while switching to music would show nothing
// and look broken.
// ONE SOUND AT A TIME. Each card owns an <audio>, so clicking down a column stacked
// every effect on top of the last. `play` does not bubble - hence the capture phase,
// which is why the obvious version of this fix appears to do nothing.
document.addEventListener("play", e => {
  if (e.target.tagName !== "AUDIO") return;
  document.querySelectorAll("audio").forEach(a => {
    if (a !== e.target && !a.paused) { a.pause(); a.currentTime = 0; }
  });
}, true);

let CATSEL=null, SUBSEL=null;

function catOf(c){ return c.category || "-"; }

function applyCat(cards){
  let out = CATSEL ? cards.filter(c=>catOf(c)===CATSEL) : cards;
  if (CATSEL && SUBSEL) out = out.filter(c=>c.subcategory===SUBSEL);
  return out;
}

function drawSubnav(b, redraw){
  const el=document.getElementById("subnav");
  const counts={};
  b.cards.forEach(c=>{ const k=catOf(c); counts[k]=(counts[k]||0)+1; });
  const keys=Object.keys(counts).sort();
  // one category is not a taxonomy; do not draw a row of one chip
  if(keys.length<2){ el.style.display="none"; el.innerHTML=""; return; }
  let html = `<button class="chip ${CATSEL?"":"on"}" data-c="">all<span>${b.cards.length}</span></button>`
    + keys.map(k=>`<button class="chip ${CATSEL===k?"on":""}" data-c="${esc(k)}">${esc(k)}<span>${counts[k]}</span></button>`).join("");
  // second level, only where the cards actually carry one
  if(CATSEL){
    const subs={};
    b.cards.filter(c=>catOf(c)===CATSEL).forEach(c=>{
      if(c.subcategory) subs[c.subcategory]=(subs[c.subcategory]||0)+1; });
    const sk=Object.keys(subs).sort();
    if(sk.length>1 || (sk.length===1 && SUBSEL)){
      html += `<div class="sub2"><button class="chip ${SUBSEL?"":"on"}" data-s="">all ${esc(CATSEL)}<span>${counts[CATSEL]}</span></button>`
        + sk.map(s=>`<button class="chip ${SUBSEL===s?"on":""}" data-s="${esc(s)}">${esc(s)}<span>${subs[s]}</span></button>`).join("")
        + `</div>`;
    }
  }
  el.style.display="flex";
  el.innerHTML=html;
  el.querySelectorAll("button[data-c]").forEach(btn=>btn.onclick=()=>{
    CATSEL = btn.dataset.c || null; SUBSEL=null; redraw();
  });
  el.querySelectorAll("button[data-s]").forEach(btn=>btn.onclick=()=>{
    SUBSEL = btn.dataset.s || null; redraw();
  });
}

function drawCards(){
  const b=BROWSE;
  document.getElementById("stat").textContent =
    `${b.total} ${b.kind}` + (b.empty?` · ${b.empty} with no frame yet`:"");
  // An empty first card that goes to wherever a NEW card of this kind is authored. The
  // browse view is where you notice the library is missing something, so the way to add
  // one belongs here rather than on another page.
  const addCard = `<div class="cd"><a class="big" href="${esc(NEWPAGE[b.kind]||"/generate")}"
      style="display:flex;align-items:center;justify-content:center;text-decoration:none">
      <span style="font-size:38px;color:var(--accent);line-height:1">+</span></a>
    <div class="b"><h3>New ${esc(b.kind.replace(/s$/,""))}</h3>
      <p>Author a card, then grow it here.</p></div></div>`;
  document.getElementById("cardgrid").innerHTML = addCard + b.cards.map(c=>{
    const i = ROT[c.id]||0;
    const pics = [c.cover].concat(c.alts||[]).filter(Boolean);
    const src = pics.length ? pics[i % pics.length] : null;
    // A MOTION or CAMERA card's only frames are clips. Rendering an .mp4 inside an <img>
    // shows nothing, which is why those two kinds looked like they had no thumbnails.
    const isVid = /\.(mp4|webm)$/i.test(src||"");
    const body = src
      ? (isVid
          ? `<video src="${esc(src)}#t=0.4" muted playsinline preload="metadata"></video>`
          : `<img src="${esc(src)}" loading="lazy" alt="">`) +
        (pics.length>1?`<button class="rot" data-rot="${esc(c.id)}">${(i%pics.length)+1}/${pics.length}</button>`:"")
      : `<div class="none">no frame yet</div>`;
    return `<div class="cd"><div class="big" data-card="${esc(c.id)}">${body}</div>
      <div class="b"><h3>${esc(c.name)}</h3><p>${esc(c.desc)}</p>
        <div class="n">${c.frames} frame${c.frames===1?"":"s"}${
          c.purest!=null?` · purest ${c.purest}`:""}${c.status?" · "+esc(c.status):""}</div>
        <button class="rot" style="position:static;margin-top:7px;background:var(--panel2);
          color:var(--ink);border:1px solid var(--line)" data-grow="${esc(c.id)}">make 4 more</button>
      </div></div>`;
  }).join("");
  // Rotate through the alternates instead of pretending one seed is the whole card.
  document.querySelectorAll("[data-rot]").forEach(x => x.onclick = e => {
    e.stopPropagation(); ROT[x.dataset.rot]=(ROT[x.dataset.rot]||0)+1; drawCards();
  });
  // Clicking a card drops into the frame grid filtered to it - browse, then dig in.
  // Grow this card: render more frames, preferring styles it does not already have, so
  // the new ones fill gaps instead of repeating what is there.
  document.querySelectorAll("[data-grow]").forEach(x => x.onclick = e => {
    e.stopPropagation();
    x.textContent = "starting…"; x.disabled = true;
    fetch("/api/library/grow", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({kind: BROWSE.kind, id: x.dataset.grow, n: 4})})
      .then(r=>r.json()).then(j=>{
        x.textContent = j.error ? j.error.slice(0,28) : "rendering…";
      });
  });
  document.querySelectorAll("[data-card]").forEach(x => x.onclick = () => {
    sel = {}; sel[b.facet] = new Set([x.dataset.card]);
    setMode("frames");
  });
}

function apply(keepSet){
  // The set marks survive a reject. Clearing them on every apply made the borders vanish
  // and come back a moment later, which looked like the grid reshuffling itself for no
  // reason. Only a change of selection makes the old set stale.
  if (!keepSet) SETWHY = new Map();
  view = D.items.filter(matches);
  if (MODE==="starred") view = view.filter(x => FAVS.has(x.id));
  const f = soleFacet();
  if (f){
    // Fewest competing layers first, then newest. This is the whole "the stronger the
    // variable, the higher it sorts" idea: a place with nobody in it teaches you the
    // place; the same place behind a character teaches you almost nothing about it.
    view.sort((a,b) => (((a.purity||{})[f]??9) - ((b.purity||{})[f]??9)) || (b.mtime-a.mtime));
  }
  shown = 0;
  document.getElementById("grid").innerHTML = "";
  drawFacets();
  drawApplied();
  drawFocus(f);
  more();
  if (f) drawSet(f);
  document.getElementById("stat").textContent =
    `${view.length.toLocaleString()} of ${D.total.toLocaleString()} generations`;
}

function more(){
  const next = view.slice(shown, shown+PAGE);
  document.getElementById("grid").insertAdjacentHTML("beforeend", next.map(cellHTML).join(""));
  shown += next.length;
  document.getElementById("more").style.display = shown<view.length ? "block":"none";
  document.getElementById("more").textContent =
    `show ${Math.min(PAGE, view.length-shown)} more (${view.length-shown} left)`;
  bind();
}
document.getElementById("more").onclick = more;

// Per-page is a real choice, not a fixed 60. 1000 is offered because "show me everything
// in this style" is a normal thing to want and clicking `show more` eleven times is not.
const per=document.getElementById("per");
per.innerHTML = PAGE_SIZES.map(n=>`<option value="${n}"${n===PAGE?" selected":""}>${n}</option>`).join("")
  + `<option value="all">all</option>`;
per.onchange = () => {
  PAGE = per.value==="all" ? 1e9 : +per.value;
  shown = 0; document.getElementById("grid").innerHTML = ""; more();
};

let REASONS = [];

function askReason(id, near){
  // A LIST, NOT A TEXT BOX. A typed reason is a note; a chosen reason is data that can be
  // counted and crossed against the recipe. The free-text line stays for the detail that
  // does not fit a slug.
  document.querySelectorAll(".reasonbox").forEach(x=>x.remove());
  const box = document.createElement("div");
  box.className = "reasonbox";
  box.innerHTML = `<h4>Why does this not belong?</h4>` +
    REASONS.map(r=>`<button data-slug="${esc(r.slug)}" title="${esc(r.why)}">${esc(r.label)}</button>`).join("") +
    `<input id="rnote" placeholder="anything else worth knowing (optional)">
     <div class="rowend"><button class="cancel">cancel</button></div>`;
  document.body.appendChild(box);
  const r = near.getBoundingClientRect();
  box.style.left = Math.min(window.innerWidth-330, r.left+window.scrollX) + "px";
  box.style.top = (r.bottom + window.scrollY + 6) + "px";
  box.querySelector(".cancel").onclick = () => box.remove();
  box.querySelectorAll("[data-slug]").forEach(btn => btn.onclick = () => {
    const note = box.querySelector("#rnote").value.trim();
    box.remove();
    fetch("/api/library/reject",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id, reason: btn.dataset.slug, note})}).then(x=>x.json()).then(j=>{
        if (j.error){ alert(j.error); return; }
        D.items = D.items.filter(x => x.id !== id);
        D.total = D.items.length;
        // The grid also refills to a full page from the frames beyond it, which is the
        // other reason a picture appears that was not there before.
        apply(true);
      });
  });
}

function bind(){
  document.querySelectorAll(".cell").forEach(c=>c.onclick=e=>{
    if (e.target.closest("[data-star]") || e.target.closest("[data-reject]")) return;
    open(c.dataset.id);
  });
  document.querySelectorAll("[data-reject]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const id=b.dataset.reject;
    // Asked for, because rejecting is a judgement and the judgement is the useful part.
    // "a painting covers half the train" tells the next person something; a deleted file
    // tells them nothing.
    askReason(id, b);
  });
  document.querySelectorAll("[data-star]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const id=b.dataset.star, on=!FAVS.has(id);
    on?FAVS.add(id):FAVS.delete(id);
    b.classList.toggle("on",on); b.textContent = on?"★":"☆";
    fetch("/api/library/star",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id,on})}).then(r=>r.json()).then(()=>drawModes());
  });
}

async function open(id){
  const it = D.items.find(x=>x.id===id);
  document.getElementById("big").innerHTML = it.kind==="video"
    ? `<video src="${esc(it.url)}" controls autoplay loop></video>`
    : it.kind==="audio"
      ? `<audio src="${esc(it.url)}" controls style="width:90%"></audio>`
      : `<img src="${esc(it.url)}" alt="">`;
  document.getElementById("meta").innerHTML = `<p class="sub">loading recipe…</p>`;
  document.getElementById("dlg").showModal();

  const r = await fetch("/api/library/recipe?id="+encodeURIComponent(id)).then(x=>x.json());
  if (r.error){ document.getElementById("meta").innerHTML=`<p class="sub">${esc(r.error)}</p>`; return; }

  // Clicking a value filters the library by it - the fastest way to answer "what else
  // came out of this style / this seed / this character".
  const chips = ["style","character","place","engine","collection","look"]
    .filter(f=>it[f]).map(f=>`<span class="chip" data-f="${f}" data-v="${esc(it[f])}">${esc(f)}: ${esc(it[f])}</span>`).join("");

  const rows = r.fields.map(f=>{
    const long = f.key==="prompt"||f.key==="negative";
    return `<div class="row"><div class="k">${esc(f.label)}</div>
      <div class="v ${long?"mono":""}">${esc(typeof f.value==="object"?JSON.stringify(f.value):f.value)}</div></div>`;
  }).join("");
  const extra = Object.keys(r.extra||{}).length
    ? `<div class="row"><div class="k">Everything else in the recipe</div>
       <div class="v mono">${esc(JSON.stringify(r.extra,null,1))}</div></div>` : "";

  document.getElementById("meta").innerHTML = `
    <h2>${esc(it.style||it.name)}</h2>
    <div class="sub">${esc(it.name)}</div>
    <div class="chips">${chips}</div>
    <div class="acts">
      <button id="wfbtn">workflow</button>
      <a href="${esc(it.url)}" download class="alt">download</a>
      <button class="alt" id="copyp">copy prompt</button>
      <button class="alt" id="vlmbtn" title="Ask a vision model what it sees, and whether the place/character you asked for is in it">ask a VLM: is it what I asked for?</button>
    </div>
    <div id="wfout"></div>
    <div id="vlmout"></div>
    ${rows}${extra}`;

  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    sel[c.dataset.f]=new Set([c.dataset.v]);
    document.getElementById("dlg").close(); apply(); window.scrollTo(0,0);
  });
  document.getElementById("copyp").onclick=()=>{
    navigator.clipboard.writeText((r.raw&&r.raw.prompt)||"");
    document.getElementById("copyp").textContent="copied";
  };
  document.getElementById("wfbtn").onclick=()=>showWorkflow(id);
  document.getElementById("vlmbtn").onclick=async()=>{
    const out=document.getElementById("vlmout");
    out.innerHTML=`<p class="note">asking Gemma-4 what it sees (about 3s)…</p>`;
    const j=await fetch("/api/library/check",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id})}).then(x=>x.json());
    if(j.error){ out.innerHTML=`<p class="note">${esc(j.error)}</p>`; return; }
    const verdict = j.seen===null ? "nothing on the recipe to check against"
      : j.seen ? `YES - saw: ${esc(j.hits.join(", "))}`
      : `NO - none of ${esc((j.expect||[]).slice(0,6).join(", "))} in the description`
        + (j.person_present===false && j.checked&&j.checked.includes("character") ? " - and NO PERSON at all" : "");
    out.innerHTML=`<div class="row"><div class="k">What a VLM saw</div><div class="v">${esc(j.description)}</div></div>
      <div class="row"><div class="k">Is it what you asked for (${esc(j.checked)})?</div><div class="v"><b>${verdict}</b></div></div>`;
  };
}

async function showWorkflow(id){
  const out=document.getElementById("wfout");
  out.innerHTML=`<p class="note">rebuilding the graph…</p>`;
  const w = await fetch("/api/library/workflow?id="+encodeURIComponent(id)).then(x=>x.json());
  if (w.error){ out.innerHTML=`<p class="note">${esc(w.error)}</p>`; return; }
  const dl = w.graph
    ? `<a class="alt" style="padding:8px 14px;border-radius:7px;border:1px solid var(--line);
         text-decoration:none;color:var(--ink);background:var(--panel2);font-size:12.5px"
         href="/api/library/workflow?id=${encodeURIComponent(id)}&download=1"
         download>download graph (.json)</a>` : "";
  out.innerHTML = `
    <div class="row"><div class="k">Workflow</div>
      <div class="v">${esc(w.file||"unknown")}${w.nodes?` · ${w.nodes} nodes`:""}</div></div>
    <p class="note">${esc(w.note||"")}</p>
    <div class="acts">${dl}
      <a class="alt" href="${esc(COMFY)}" target="_blank" rel="noopener"
         style="padding:8px 14px;border-radius:7px;text-decoration:none">open ComfyUI</a></div>
    ${w.graph?`<pre class="wf">${esc(JSON.stringify(w.graph,null,1))}</pre>`:""}`;
}

let COMFY = "http://" + location.hostname + ":8188";

document.getElementById("x").onclick=()=>document.getElementById("dlg").close();
document.getElementById("dlg").addEventListener("click", e=>{
  if (e.target.id==="dlg") document.getElementById("dlg").close();
});
let t=null;
document.getElementById("q").oninput=e=>{
  clearTimeout(t); t=setTimeout(()=>{ q=e.target.value.trim().toLowerCase(); apply(); }, 200);
};

fetch("/api/library").then(r=>r.json()).then(d=>{
  if (d.error){ document.getElementById("stat").textContent=d.error; return; }
  D=d;
  document.getElementById("back").onclick = goBack;
  // Seed the stack with the view you land on. Without it the first navigation has nothing
  // behind it and "all frames" becomes unreachable by back.
  pushHist();
  fetch("/api/library/reasons").then(r=>r.json()).then(x=>{ REASONS = x.reasons||[]; });
  fetch("/api/library/favourites").then(r=>r.json()).then(f=>{
    FAVS=new Set(f.ids||[]); drawModes(); apply();
  }).catch(()=>{ drawModes(); apply(); });
}).catch(e=>{
  // Show it, do not tuck it into the header. A blank grid with a quiet status line is how
  // a broken page looks like an empty library.
  document.getElementById("stat").textContent="could not load";
  document.getElementById("grid").innerHTML =
    `<div style="padding:24px;color:var(--bad)">could not load the library: ${esc(e.message)}
     <br><span style="color:var(--dim)">check /api/library</span></div>`;
  console.error(e);
});
</script>
