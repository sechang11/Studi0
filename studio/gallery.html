<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>studio · gallery</title>
<style>
  :root{--bg:#0f1115;--panel:#161a21;--panel2:#1c2129;--line:#272d38;--ink:#e6e9ef;
        --dim:#8b94a3;--accent:#6ea8fe;--ok:#4ec9a0;--warn:#e0b252;--bad:#e07a5f}
  @media (prefers-color-scheme:light){
    :root{--bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#dde1e8;--ink:#141821;--dim:#5d6470}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:13px 18px;
         border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
  header h1{margin:0;font-size:15px;letter-spacing:.07em;text-transform:uppercase}
  header .sub{color:var(--dim);font-size:12px}
  header a{color:var(--dim);font-size:12px;text-decoration:none;border:1px solid var(--line);
           padding:5px 10px;border-radius:6px}
  header a:hover{color:var(--ink);border-color:var(--accent)}
  header .right{margin-left:auto;display:flex;gap:8px;align-items:center}

  .bar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);
       background:var(--panel);position:sticky;top:52px;z-index:19}
  select,input[type=search]{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
       border-radius:7px;padding:7px 10px;font:inherit}
  .chip{background:none;border:1px solid var(--line);color:var(--dim);padding:5px 11px;
        border-radius:99px;cursor:pointer;font:inherit;font-size:12px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#08111f;font-weight:600}
  label.tog{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:18px}
  .it{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
      cursor:pointer;display:flex;flex-direction:column}
  .it:hover{border-color:var(--accent)}
  .it img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--panel2)}
  .it .b{padding:9px 11px}
  .it .v{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--accent)}
  .it .t{color:var(--dim);font-size:12px;margin-top:2px}
  .flag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:99px;
        border:1px solid var(--bad);color:var(--bad);margin-right:4px;margin-top:5px}

  dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);
         max-width:min(1100px,94vw);padding:0}
  dialog::backdrop{background:#000a}
  .dh{display:flex;align-items:baseline;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .dh h3{margin:0;font-size:15px;font-family:ui-monospace,Menlo,monospace}
  .dh button{margin-left:auto;background:none;border:0;color:var(--dim);font-size:20px;cursor:pointer}
  .db{padding:18px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
  @media (max-width:820px){.db{grid-template-columns:1fr}}
  .db img{width:100%;border-radius:8px;border:1px solid var(--line)}
  h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  pre{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:10px;
      font-size:11.5px;white-space:pre-wrap;word-break:break-word;margin:0 0 14px;
      font-family:ui-monospace,Menlo,monospace;max-height:190px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px}
  td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  td:first-child{color:var(--dim);width:38%;font-family:ui-monospace,Menlo,monospace}
  .empty{padding:40px 18px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>gallery</h1>
  <span class="sub" id="stat">loading…</span>
  <div class="right">
    <a href="/wizard">direct a scene →</a>
    <a href="/">library</a>
  </div>
</header>

<div class="bar">
  <select id="fvar"><option value="">every variable</option></select>
  <select id="fval"><option value="">every value</option></select>
  <select id="ftpl"><option value="">every template</option></select>
  <input type="search" id="q" placeholder="search prompt…" style="flex:1;min-width:160px">
  <label class="tog"><input type="checkbox" id="hideflag"> hide flagged</label>
  <button class="chip" id="clear">clear</button>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none"></div>

<dialog id="dlg"><div class="dh"><h3 id="dtitle"></h3><button id="dclose">×</button></div>
<div class="db">
  <div><img id="dimg" alt=""></div>
  <div>
    <h4>demonstrates</h4><table id="ddem"></table>
    <h4>prompt</h4><pre id="dprompt"></pre>
    <h4>negative</h4><pre id="dneg"></pre>
    <h4>every variable</h4><table id="dvars"></table>
    <h4>reproduce</h4><pre id="drepro"></pre>
  </div>
</div></dialog>

<script>
let ALL=[], VIEW=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function opts(sel, vals, keep){
  const cur = keep ? sel.value : "";
  sel.innerHTML = `<option value="">${sel.dataset.all}</option>` +
    vals.map(v=>`<option ${v===cur?"selected":""}>${esc(v)}</option>`).join("");
}

function apply(){
  const v=$("fvar").value, val=$("fval").value, t=$("ftpl").value,
        q=$("q").value.trim().toLowerCase(), hf=$("hideflag").checked;
  VIEW = ALL.filter(r =>
    (!v   || r.demonstrates.variable===v) &&
    (!val || r.demonstrates.value===val) &&
    (!t   || r.template===t) &&
    (!hf  || !(r.flags||[]).length) &&
    (!q   || r.prompt.toLowerCase().includes(q)));
  // values list follows the chosen variable, so you cannot pick an impossible pair
  const vals=[...new Set(ALL.filter(r=>!v||r.demonstrates.variable===v)
                            .map(r=>r.demonstrates.value))].sort();
  opts($("fval"), vals, true);
  draw();
}

function draw(){
  $("stat").textContent = `${VIEW.length} of ${ALL.length} generations`;
  $("empty").style.display = VIEW.length ? "none" : "block";
  $("empty").textContent = ALL.length
    ? "Nothing matches those filters."
    : "No generations yet. Run:  python3 studio/_tools/gallery_gen.py --vary all --loop";
  $("grid").innerHTML = VIEW.slice(0,400).map((r,i)=>`
    <div class="it" data-i="${ALL.indexOf(r)}">
      <img loading="lazy" src="${esc(r.file)}" alt="">
      <div class="b">
        <div class="v">${esc(r.demonstrates.value)}</div>
        <div class="t">${esc(r.demonstrates.variable)} · ${esc(r.template_name||r.template)}</div>
        ${(r.flags||[]).map(f=>`<span class="flag">${esc(f)}</span>`).join("")}
      </div></div>`).join("");
  document.querySelectorAll(".it").forEach(el=>el.onclick=()=>open_(ALL[+el.dataset.i]));
}

function rows(o){
  return Object.entries(o||{}).map(([k,v])=>
    `<tr><td>${esc(k)}</td><td>${esc(typeof v==="object"?JSON.stringify(v):v)}</td></tr>`).join("");
}

function open_(r){
  $("dtitle").textContent = r.id;
  $("dimg").src = r.file;
  $("ddem").innerHTML = rows({variable:r.demonstrates.variable, value:r.demonstrates.value,
    template:r.template, shot:r.shot.template, camera:r.shot.camera||"—",
    luma:r.luma, saturation:r.sat, flags:(r.flags||[]).join(", ")||"none"});
  $("dprompt").textContent = r.prompt;
  $("dneg").textContent = r.negative;
  $("dvars").innerHTML = rows(Object.assign({}, r.vars, {
    model:r.model, workflow:r.workflow, seed:r.seed,
    steps:r.steps, cfg:r.cfg, sampler:r.sampler,
    size:r.size.join("x"), grade:r.grade}));
  // Everything needed to make this exact image again.
  $("drepro").textContent =
    `# ${r.id}\ncd ~/shared/comfy-studio\npython3 studio/_tools/gallery_gen.py \\\n` +
    `  --template ${r.template} --vary ${r.demonstrates.variable} --shot ${r.shot.template}\n\n` +
    `# or reuse the settings directly:\n` +
    `#   model ${r.model} · seed ${r.seed} · ${r.steps} steps · cfg ${r.cfg} · ${r.sampler}\n` +
    `#   grade ${r.grade}`;
  $("dlg").showModal();
}

(async function(){
  try{
    ALL = await fetch("/api/gallery").then(r=>r.json());
  }catch(e){ ALL=[]; }
  $("fvar").dataset.all="every variable";
  $("fval").dataset.all="every value";
  $("ftpl").dataset.all="every template";
  opts($("fvar"), [...new Set(ALL.map(r=>r.demonstrates.variable))].sort());
  opts($("ftpl"), [...new Set(ALL.map(r=>r.template))].sort());
  ["fvar","fval","ftpl","hideflag"].forEach(id=>$(id).onchange=apply);
  $("q").oninput=apply;
  $("clear").onclick=()=>{["fvar","fval","ftpl"].forEach(id=>$(id).value="");
    $("q").value=""; $("hideflag").checked=false; apply();};
  $("dclose").onclick=()=>$("dlg").close();
  $("dlg").onclick=e=>{ if(e.target===$("dlg")) $("dlg").close(); };
  apply();
})();
</script>
</body>
</html>
