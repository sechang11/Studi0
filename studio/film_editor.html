<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Film editor</title>
<style>
:root{--bg:#0e0e12;--panel:#181820;--line:#2a2a36;--ink:#e9e9f0;--dim:#8d8d9c;
      --accent:#9fb3ff;--good:#7fd1a0;--warn:#ffc978;--bad:#ff8f8f;--rule:#c9a0ff}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,sans-serif;margin:0}
nav.top{padding:12px 22px;border-bottom:1px solid var(--line)}
nav.top a{color:var(--accent);text-decoration:none;margin-right:14px;font-size:14px}
h1{font-size:18px;margin:0}
h2{font-size:12px;color:var(--accent);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
button{background:#232330;color:var(--ink);border:1px solid var(--line);border-radius:6px;
       padding:5px 10px;cursor:pointer;font:inherit;font-size:13px}
button:hover{border-color:var(--accent)}
button.primary{background:#2c3450;border-color:var(--accent)}
button.small{padding:2px 7px;font-size:12px}
select,input,textarea{background:#101017;color:var(--ink);border:1px solid var(--line);
       border-radius:5px;padding:4px 7px;font:inherit;font-size:13px}
textarea{width:100%;resize:vertical}
label{font-size:11px;color:var(--dim);display:block;margin:7px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
#bar{display:flex;gap:10px;align-items:center;padding:10px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#job{font-size:12px;color:var(--dim);max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#job.err{color:var(--bad)}
#main{display:grid;grid-template-columns:320px 1fr 400px;gap:0;min-height:calc(100vh - 110px)}
#timeline{border-right:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 110px)}
#right{border-left:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 110px);padding:0 14px 40px}
#center{padding:14px 18px;overflow-y:auto;max-height:calc(100vh - 110px)}
.scenehead{padding:10px 14px 6px;font-size:12px;color:var(--dim);text-transform:uppercase;
           letter-spacing:.05em;border-top:1px solid var(--line);cursor:pointer}
.scenehead:first-child{border-top:0}
.scenehead b{color:var(--ink)}
.scenehead.sel{color:var(--rule)}
.shotcard{display:flex;gap:8px;padding:7px 10px 7px 14px;cursor:pointer;border-left:3px solid transparent}
.shotcard:hover{background:#1c1c25}
.shotcard.sel{background:#1e2130;border-left-color:var(--accent)}
.shotcard img{width:86px;height:49px;object-fit:cover;border-radius:4px;background:#000}
.shotcard .noimg{width:86px;height:49px;border-radius:4px;background:#101017;border:1px dashed var(--line);
                 display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:10px}
.shotmeta{flex:1;min-width:0}
.shotmeta .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shotmeta .d{font-size:11px;color:var(--dim)}
.badge{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:3px;
       padding:0 4px;margin-right:3px;color:var(--dim)}
.badge.on{color:var(--good);border-color:var(--good)}
.timeacts{padding:4px 14px 12px;display:flex;gap:6px}
.takes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:10px}
.take{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
.take.picked{border-color:var(--good)}
.take img.poster{width:100%;border-radius:5px;cursor:pointer;background:#000}
.take img.strip{width:100%;border-radius:3px;margin-top:4px;opacity:.85}
.take .meta{font-size:11px;color:var(--dim);margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qcbad{color:var(--bad)}
.warn{color:var(--warn)}
video{width:100%;max-height:420px;background:#000;border-radius:8px}
.tabs{display:flex;gap:0;margin:12px -14px 0;border-bottom:1px solid var(--line)}
.tabs div{padding:8px 12px;cursor:pointer;color:var(--dim);font-size:13px}
.tabs div.sel{color:var(--ink);border-bottom:2px solid var(--accent)}
.beat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
.beat .bh{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--dim)}
.ctx{width:100%;border-collapse:collapse;font-size:12px}
.ctx td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:top}
.ctx td:first-child{color:var(--dim);white-space:nowrap}
.src{font-size:10px;border-radius:3px;padding:0 4px;margin-left:6px}
.src.film{background:#2c3450;color:var(--accent)}
.src.scene{background:#2e4437;color:var(--good)}
.src.shot{background:#4a3450;color:var(--rule)}
pre.compiled{background:#101017;border:1px solid var(--line);border-radius:6px;padding:8px;
             font-size:11px;white-space:pre-wrap;color:var(--dim);max-height:180px;overflow:auto}
.wl{font-size:11px;color:var(--warn);margin:2px 0}
.nl{font-size:11px;color:var(--dim);margin:2px 0}
.cast{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0}
.hint{color:var(--dim);font-size:12px}
img.anchor{width:100%;border-radius:6px;margin-top:6px}
</style>
</head>
<body>
<nav class="top"><a href="/">studio</a><a href="/story">story</a><a href="/film"><b>film</b></a>
<a href="/video">video</a><a href="/character">cast</a><a href="/voices.html">voices</a></nav>
<div id="bar">
  <h1>Shot editor</h1>
  <select id="filmsel" onchange="openFilm(this.value)"></select>
  <button onclick="newFilm()">new film</button>
  <span class="grow"></span>
  <label style="display:inline;margin:0"><input type="checkbox" id="musicchk" checked> music</label>
  <button class="primary" onclick="assemble()">assemble film</button>
  <a id="filmlink" style="display:none;color:var(--good)" target="_blank">▶ film.mp4</a>
  <span id="job"></span>
</div>
<div id="main">
  <aside id="timeline"></aside>
  <section id="center"><div class="hint">Pick or create a film, then select a shot.</div></section>
  <aside id="right"></aside>
</div>
<script>
"use strict";
let FID="", TREE=null, LIBS=null, SHOT=null, DETAIL=null, COMPILED=null, TAB="shot";
let WATCH=new Set(), SCENE_SEL="", FOUNDRY={}, DICT={};

const $=q=>document.querySelector(q);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m=p=>`/film/media/${FID}/${p}`;
function composePlates(){
  const pid=document.getElementById("c_place").value;
  const p=(FOUNDRY.place||[]).find(x=>x.id===pid);
  const sel=document.getElementById("c_plate");
  sel.innerHTML=((p&&p.plates)||[]).map(f=>
    `<option value="${f.replace(/\.png$/,"")}">${f.replace(/\.png$/,"")}</option>`).join("");
}
async function composeAnchor(){
  const j=await api("/compose",{film:FID,shot:SHOT,
    character:document.getElementById("c_char").value,
    place:document.getElementById("c_place").value,
    plate:document.getElementById("c_plate").value,
    framing:(document.getElementById("c_framing")||{}).value||"full",
    stand:parseFloat(document.getElementById("c_stand").value||"0.35"),
    cx:parseFloat(document.getElementById("c_cx").value||"0.42"),
    props:(()=>{ const v=document.getElementById("c_prop").value; if(!v) return [];
      const L={stand:parseFloat(document.getElementById("c_pstand").value||"0.3"),
               cx:parseFloat(document.getElementById("c_pcx").value||"0.62")};
      if(v.startsWith("char:")){ L.character=v.slice(5); L.view=document.getElementById("c_pview").value; }
      else L.id=v;
      return [L]; })()});
  WATCH.add(j.job); note("composing the anchor: "+j.job);
}
async function makeAll(){
  const j=await api("/makeall",{film:FID,assemble:true});
  WATCH.add(j.job); note("making every missing shot: "+j.job);
}
async function makeShot(){
  stashForm(); await saveShot();
  const j=await api("/make",{film:FID,shot:SHOT,variants:parseInt((document.getElementById("c_variants")||{}).value||"1")});
  WATCH.add(j.job); note("making the shot: "+j.job);
}
async function anchorCheck(){
  const j=await api("/anchorcheck",{film:FID,shot:SHOT});
  WATCH.add(j.job); note("captioning the anchor: "+j.job);
}
async function pinPreview(){
  const change=document.getElementById("c_change").value.trim();
  if(!change) return note("say what changes by the end of the shot",true);
  const j=await api("/pinpreview",{film:FID,shot:SHOT,change:change,
    seconds:parseFloat(document.getElementById("c_secs").value||"8"),
    hold_feet:document.getElementById("c_hold").checked});
  WATCH.add(j.job); note("editing the end frame: "+j.job);
}
async function pinMotion(force){
  const change=document.getElementById("c_change").value.trim();
  if(!change) return note("say what changes by the end of the shot",true);
  const j=await api("/pin",{film:FID,shot:SHOT,change:change,force:!!force,
    hold_feet:document.getElementById("c_hold").checked,
    seconds:parseFloat(document.getElementById("c_secs").value||"8")});
  WATCH.add(j.job); note("pinning: "+j.job);
}
async function api(p,body){
  const r=await fetch("/api/film"+p, body?{method:"POST",headers:{"Content-Type":"application/json"},
                                           body:JSON.stringify(body)}:{});
  const j=await r.json().catch(()=>({error:"bad json"}));
  if(!r.ok||j.error){ note(j.error||r.status,true); throw new Error(j.error||r.status); }
  return j;
}
function note(t,err){ const el=$("#job"); el.textContent=t; el.className=err?"err":""; }

async function loadFilms(sel){
  const j=await api("");
  const s=$("#filmsel");
  s.innerHTML='<option value="">- film -</option>'+j.films.map(f=>
    `<option value="${f.id}">${esc(f.title)} (${f.shots} shots, ${f.picked} picked)</option>`).join("");
  if(sel){ s.value=sel; }
}
async function newFilm(){
  if(!Object.keys(FOUNDRY||{}).length){ try{ FOUNDRY=(await api("/foundry_assets")).assets; }catch(e){ FOUNDRY={}; } }
  const box=document.createElement("div");
  box.id="newfilm";
  box.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:99";
  box.innerHTML=`<div style="background:var(--panel,#1b1d22);color:inherit;padding:16px 18px;border-radius:8px;min-width:380px;max-width:520px;border:1px solid var(--line,#333)">
    <h2 style="margin:0 0 10px">New film</h2>
    <label>title</label><input id="nf_title" style="width:100%" placeholder="working title">
    <div class="row" style="gap:8px;margin-top:6px">
      <div><label>look</label><select id="nf_look"><option>photoreal</option><option>anime</option></select></div>
      <div class="grow"><label>resolution</label><select id="nf_res" style="width:100%">
        <option value="auto">auto - the biggest each shot's length allows</option>
        <option value="720p">720p - 0.9 MP, shots to 30s</option>
        <option value="1080p">1080p - 1.5 MP, shots to 12s</option>
        <option value="max">max - 2.0 MP, shots to 8s</option></select></div>
    </div>
    <div class="hint" style="margin-top:6px">Resolution is bound by shot length here: a shot too long for the
      target still renders, a little softer, and the shot says what cut would recover it. Change it any time.</div>
    <h2 style="margin:14px 0 6px;font-size:15px">Where does the first scene happen, and who is in it?</h2>
    <div class="row" style="gap:8px">
      <div class="grow"><label>place</label><select id="nf_place" onchange="nfPlates()" style="width:100%">
        <option value="">choose later</option>${(FOUNDRY.place||[]).map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.style)})</option>`).join("")}</select></div>
      <div><label>background picture</label><select id="nf_plate"></select></div>
    </div>
    <div class="row" style="gap:8px;margin-top:6px">
      ${[1,2].map(i=>`<div class="grow"><label>person ${i}</label><select class="nf_char" style="width:100%">
        <option value="">nobody</option>${(FOUNDRY.character||[]).map(c=>`<option value="${c.id}">${esc(c.name)} (${esc(c.style)})</option>`).join("")}</select></div>`).join("")}
    </div>
    <div class="hint" style="margin-top:6px">If you choose a place, the studio lays out the first scene's shots for you
      with the people already in the pictures. You then write what happens in each and press Make.</div>
    <div class="row" style="margin-top:12px;justify-content:flex-end;gap:8px">
      <button class="small" onclick="document.getElementById('newfilm').remove()">cancel</button>
      <button class="primary" onclick="createFilm()">create</button></div>
  </div>`;
  document.body.appendChild(box);
  const t=document.getElementById("nf_title"); t.focus();
  t.addEventListener("keydown",e=>{ if(e.key==="Enter") createFilm(); if(e.key==="Escape") box.remove(); });
}
function nfPlates(){
  const pid=(document.getElementById("nf_place")||{}).value; const sel=document.getElementById("nf_plate"); if(!sel) return;
  const p=(FOUNDRY.place||[]).find(x=>x.id===pid);
  sel.innerHTML=((p&&p.plates)||[]).map(f=>`<option value="${f.replace(/\.png$/,"")}">${f.replace(/\.png$/,"")}</option>`).join("");
  const w=[...sel.options].find(o=>/_wide$/.test(o.value)); if(w) sel.value=w.value;
}
async function createFilm(){
  const t=document.getElementById("nf_title").value.trim();
  if(!t) return note("give the film a title",true);
  const place=(document.getElementById("nf_place")||{}).value||"";
  const chars=[...document.querySelectorAll(".nf_char")].map(s=>s.value).filter(Boolean);
  let j;
  if(place){
    j=await api("/quickstart",{title:t,look:document.getElementById("nf_look").value,
      resolution:document.getElementById("nf_res").value,place,plate:(document.getElementById("nf_plate")||{}).value||"",characters:chars});
    if(j&&j.job){ WATCH.add(j.job); note("laying out the first scene: "+j.job); }
  }else{
    j=await api("/new",{title:t,look:document.getElementById("nf_look").value,
                        resolution:document.getElementById("nf_res").value});
  }
  if(!j||!j.id) return note("could not create the film: "+((j||{}).error||"unknown"),true);
  document.getElementById("newfilm").remove();
  await loadFilms(j.id); openFilm(j.id);
}
async function openFilm(fid){
  if(!fid) return;
  FID=fid;
  LIBS=LIBS||await api("/libraries");
  TREE=await api("/"+fid);
  // what the foundry actually holds, so the pickers list real assets instead of
  // asking anyone to remember an id
  try{ FOUNDRY=(await api("/foundry_assets")).assets; }catch(e){ FOUNDRY={}; }
  try{ DICT=await (await fetch("/api/foundry/dictionary")).json(); }catch(e){ DICT={}; }
  $("#filmlink").style.display=TREE.film?"":"none";
  $("#filmlink").href=m("assets/film.mp4");
  renderTimeline();
  if(SHOT&&TREE.scenes.some(sc=>sc.shots.some(s=>s.id===SHOT))) selShot(SHOT);
  else { SHOT=null; $("#center").innerHTML='<div class="hint">Select a shot on the timeline.</div>'; renderRight(); }
}

function renderTimeline(){
  const el=$("#timeline"); let h="";
  for(const sc of TREE.scenes){
    h+=`<div class="scenehead ${SCENE_SEL===sc.id?"sel":""}" onclick="selScene('${sc.id}')">
        scene <b>${esc(sc.title||sc.id)}</b> · ${sc.shots.length} shots
        ${sc.anchor?'<span class="badge on">anchor</span>':'<span class="badge">no anchor</span>'}</div>`;
    sc.shots.forEach((s,i)=>{
      h+=`<div class="shotcard ${SHOT===s.id?"sel":""}" onclick="selShot('${s.id}')">`+
         (s.poster?`<img src="${m(s.poster)}">`:'<div class="noimg">no take</div>')+
         `<div class="shotmeta"><div class="t">${s.id} · ${esc(s.title)}</div>
          <div class="d">${s.duration}s · ${s.beats} beat${s.beats>1?"s":""} ·
          ${s.engines.map(e=>`<span class="badge ${s.picked?"":""}">${e}</span>`).join("")}
          ${s.picked?'<span class="badge on">picked</span>':""}
          ${s.transition_out!=="cut"?`<span class="badge">${s.transition_out}→</span>`:""}</div></div>
          <div style="display:flex;flex-direction:column;gap:2px">
            <button class="small" onclick="event.stopPropagation();move('${sc.id}','${s.id}',-1)">▲</button>
            <button class="small" onclick="event.stopPropagation();move('${sc.id}','${s.id}',1)">▼</button>
          </div></div>`;
    });
    h+=`<div class="timeacts">
        <button class="small" onclick="addShot('${sc.id}')">+ shot</button>
        <select class="small" id="tpl_${sc.id}" style="font-size:11px;max-width:130px">
          <option value="">template…</option>
          ${(LIBS.templates||[]).map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join("")}
        </select>
        <button class="small" onclick="addShot('${sc.id}',$('#tpl_${sc.id}').value)">+ from tpl</button>
        </div>`;
  }
  h+=`<div class="timeacts"><button onclick="addScene()">+ scene</button></div>`;
  el.innerHTML=h;
}
async function addScene(){ const t=prompt("Scene title?")||"scene"; await api("/scene",{film:FID,title:t}); openFilm(FID); }
async function addShot(scid,tpl){ const j=await api("/shot",{film:FID,scene:scid,template:tpl||""}); await openFilm(FID); selShot(j.id); }
async function move(scid,shid,dir){
  const sc=TREE.scenes.find(s=>s.id===scid); const ids=sc.shots.map(s=>s.id);
  const i=ids.indexOf(shid), j=i+dir; if(j<0||j>=ids.length) return;
  [ids[i],ids[j]]=[ids[j],ids[i]];
  await api("/reorder",{film:FID,scene:scid,order:ids}); openFilm(FID);
}
function selScene(scid){ SCENE_SEL=scid; TAB="scene"; renderTimeline(); renderRight(); }

async function selShot(shid){
  SHOT=shid;
  DETAIL=await api(`/${FID}/shot/${shid}`);
  COMPILED=await api(`/${FID}/compile/${shid}`);
  SCENE_SEL=DETAIL.shot.scene;
  if(TAB==="scene") TAB="shot";
  renderTimeline(); renderCenter(); renderRight();
  if(document.getElementById("c_place")) composePlates();
  if(document.getElementById("cv_place")) coveragePlates();
}

function renderCenter(){
  const sh=DETAIL.shot;
  const picked=sh.takes.find(t=>t.id===sh.picked);
  const player=picked?`<video controls src="${m(picked.file)}"></video>`
    :'<div class="hint">No picked take yet - generate some below.</div>';
  const hasDlg=(sh.beats||[]).some(b=>((b.dialogue||{}).line||"").trim());
  const takes=sh.takes.slice().reverse().map(t=>`
    <div class="take ${t.id===sh.picked?"picked":""}">
      <img class="poster" src="${m(t.poster)}" onclick="playTake('${t.id}')" title="click to play">
      <img class="strip" src="${m(t.strip)}">
      <div class="meta">
        <b>${t.engine}</b> <span style="cursor:pointer;text-decoration:underline dotted"
          title="use this seed for the next generation"
          onclick="$('#tk_seed').value=${t.seed}">seed ${t.seed}</span> · ${t.duration}s · ${t.created}
        ${(()=>{const isInfo=n=>/^(ends closer|sound borrowed|words not in the picture|camera:|identity:)/.test(String(n)); const f=(t.qc||[]).filter(n=>!isInfo(n)), i=(t.qc||[]).filter(isInfo);
          return (f.length?`<span class="qcbad" title="${esc(f.join("; "))}">QC ✗ ${f.length}</span>`:'<span style="color:var(--good)">QC ✓</span>')
               +(i.length?` <span class="hint" title="${esc(i.join("; "))}" style="cursor:help">ⓘ ${i.length}</span>`:"");})()}
        ${t.warnings&&t.warnings.length?`<span class="warn" title="${esc(t.warnings.join("; "))}">⚠ ${t.warnings.length}</span>`:""}
        <span class="grow"></span>
        ${t.fps>=47?'<span class="badge on">48fps</span>':""}
        ${t.id===sh.picked?'<b style="color:var(--good)">picked</b>'
                          :`<button class="small" onclick="pickTake('${t.id}')">pick</button>`}
        ${t.id===sh.picked&&(t.fps||24)<47&&t.duration<=25
          ?`<button class="small" onclick="masterTake()" title="FILM interpolation to 48fps, audio re-muxed">master 48</button>`:""}
        ${hasDlg&&!t.engine.endsWith("+vo")?`<button class="small" onclick="voMix('${t.id}')" title="synthesize the character voice(s) and duck them over this take">VO</button>`:""}
      </div>
    </div>`).join("");
  $("#center").innerHTML=`
    <div class="row"><h1 style="font-size:16px">${sh.id} · ${esc(sh.title)}</h1>
      <span class="hint">${sh.duration}s · ${(sh.beats||[]).length} beat(s)</span>
      <span class="grow"></span>
      <button class="small" onclick="autoNext()">auto next shot →</button></div>
    <div id="player">${player}</div>
    <h2>Generate takes</h2>
    <div class="row">
      <label style="display:inline;margin:0"><input type="checkbox" id="e_ltx" checked> LTX</label>
      <label style="display:inline;margin:0"><input type="checkbox" id="e_h3"> H3</label>
      <label style="display:inline;margin:0"><input type="checkbox" id="e_wan"> Wan</label>
      <label style="display:inline;margin:0"><input type="checkbox" id="e_cam"> Cam</label>
      <input id="tk_n" type="number" min="1" max="4" value="1" style="width:52px" title="takes per engine">
      <input id="tk_seed" type="number" placeholder="seed (blank=clock)" style="width:150px">
      <button class="primary" onclick="genTakes()">generate</button>
    </div>
    <h2>Takes (${sh.takes.length})</h2>
    <div class="takes">${takes||'<div class="hint">none yet</div>'}</div>`;
}
function playTake(tid){
  const t=DETAIL.shot.takes.find(x=>x.id===tid);
  $("#player").innerHTML=`<video controls autoplay src="${m(t.file)}"></video>`;
}
async function pickTake(tid){ await api("/pick",{film:FID,shot:SHOT,take:tid}); await selShot(SHOT); openFilm(FID); }
async function genTakes(){
  const engines=["ltx","h3","wan","cam"].filter(e=>$("#e_"+e).checked);
  if(!engines.length) return note("pick at least one engine",true);

function reviewPanel(){
  let total=0, n=0, blockers=[];
  const rows=TREE.scenes.map(sc=>{
    const cells=sc.shots.map(s=>{
      if(!s.takes) blockers.push(`${s.id} has no takes`);
      else if(!s.picked) blockers.push(`${s.id} has takes but none picked`);
      else{
        total+=s.picked_dur||s.duration||0; n++;
        if(s.picked_qc) blockers.push(`${s.id} picked take has ${s.picked_qc} QC issue(s)`);
      }
      const chip=s.picked?(s.picked_qc?'<span class="qcbad">✗</span>'
        :(s.picked_fps>=47?'<span style="color:var(--good)">48</span>'
                          :'<span style="color:var(--good)">✓</span>'))
        :'<span class="hint">—</span>';
      return `<td style="padding:3px;text-align:center">
        <div onclick="selShot('${s.id}')" style="cursor:pointer">
        ${s.poster?`<img src="${m(s.poster)}" style="width:104px;border-radius:4px">`
                  :'<div class="noimg" style="width:104px;height:59px;margin:auto">none</div>'}
        <div class="hint">${s.id} ${chip}${s.transition_out!=="cut"?" · "+s.transition_out:""}</div>
        </div></td>`;
    }).join("");
    return `<tr><td style="color:var(--dim);font-size:11px;white-space:nowrap;vertical-align:top;padding-top:12px">
            ${esc(sc.title||sc.id)}${sc.music?'<br><span class="badge">music</span>':""}</td>${cells}</tr>`;
  }).join("");
  const ports=Object.entries(TREE.cast||{}).filter(([,c])=>!c.portrait).map(([id])=>id);
  if(ports.length) blockers.push("no portrait yet: "+ports.join(", ")+" (photoreal identity route needs them)");
  const faces=TREE.scenes.flatMap(sc=>sc.shots.filter(s=>s.picked_identity).map(s=>s.id+" "+s.picked_identity));
  if(faces.length) blockers.push("faces, measured against the packs: "+faces.map(x=>x.replace("same person","held").replace("a different face","CHANGED")).join(" · "));
  const unwritten=TREE.scenes.flatMap(sc=>sc.shots.filter(s=>s.needs_sentence).map(s=>s.id));
  if(unwritten.length) blockers.push("waiting for your sentence - a neutral one renders meanwhile: "+unwritten.join(", "));
  return `<h2>Review</h2>
    <div class="hint">${n} shots picked · ~${Math.round(total)}s of picked footage</div>
    <div style="overflow-x:auto;margin-top:8px"><table>${rows}</table></div>
    <h2>Blocking / attention</h2>
    ${blockers.length?blockers.map(b=>`<div class="wl">⚠ ${esc(b)}</div>`).join("")
                     :'<div class="nl" style="color:var(--good)">nothing blocking - ready to assemble</div>'}
    <div class="row" style="margin-top:10px">
      <button onclick="draftAll()">draft all missing takes (LTX)</button>
      <button class="primary" onclick="assemble()">assemble film</button>
    </div>`;
}

  if(TAB==="shot") h+=SHOT&&DETAIL?shotForm():'<div class="hint" style="margin-top:10px">select a shot</div>';

// options from the foundry dictionary: DICT[main].subs[sub].options = [{id,label,frag,...}]
function dictOpts(main,sub,cur,multi){
  const os=((((DICT||{})[main]||{}).subs||{})[sub]||{}).options||[];
  const sel=v=>multi?(cur||[]).includes(v):v===cur;
  return (multi?"":`<option value="" ${cur?"":"selected"}>none</option>`)+
    os.filter(o=>o.id!=="none"||multi).map(o=>
      `<option value="${o.id}" ${sel(o.id)?"selected":""} title="${esc(o.frag||"")}">${esc(o.label||o.id)}</option>`).join("");
}

function prefillChange(el){
  const o=(((((DICT||{}).motion||{}).subs||{}).action||{}).options||[]).find(x=>x.id===el.value);
  const c=document.getElementById("c_change");
  if(o&&o.end&&c&&(!c.value.trim()||c.dataset.auto==="1")){ c.value="the subject "+o.end; c.dataset.auto="1"; }
  const hold=document.getElementById("c_hold");
  if(hold&&o) hold.checked=!["walk_to","walk_away","run"].includes(o.id);

function stashForm(){

  sh.title=$("#s_title").value; sh.duration=+$("#s_duration").value||6;
  sh.aspect=$("#s_aspect").value; sh.transition_out=$("#s_tout").value;
  sh.sfx=$("#s_sfx").value; sh.enhance=$("#s_enh").value==="on";

    <input id="c_music" value="${esc(sc.music)}" style="width:100%">
    <label>cast present</label><div>${castChecks}</div>
    <label style="text-transform:none"><input type="checkbox" id="c_np" ${sc.no_people?"checked":""}> empty frame scene (no people)</label>
    <div class="row" style="margin-top:8px">
      <button class="primary" onclick="saveScene()">save scene</button>
      <button onclick="genAnchor()">generate anchor</button>
    </div>
    <h2 style="margin-top:14px">Where this scene happens, and its standard shots</h2>
    <div class="hint">pick the place and background picture, then save the scene. "Make this shot" uses them
      to put people into the picture. "Generate coverage" makes the usual set of shots for you: the empty wide, the wide with the people in it, a medium and a close-up on each person, and an insert - each with its picture already composed.</div>
    <div class="row" style="gap:6px;align-items:flex-end">
      <div><label>place</label><select id="cv_place" onchange="coveragePlates()">${(FOUNDRY.place||[]).map(p=>
        `<option value="${p.id}" ${sc.place===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div>
      <div><label>plate</label><select id="cv_plate"></select></div>
      <div><label>prop (optional)</label><select id="cv_prop"><option value="">none</option>${(FOUNDRY.prop||[]).map(p=>
        `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div>
    </div>
    <div class="row" style="gap:6px;align-items:flex-end;margin-top:4px">
      ${[0,1].map(i=>`<div><label>cast ${i+1}</label><select class="cv_cast"><option value="">-</option>${Object.keys(TREE.cast||{}).map(c=>
        `<option value="${c}" ${(sc.cast_present||[])[i]===c?"selected":""}>${c}</option>`).join("")}</select></div>
      <div><label>pack</label><select class="cv_pack"><option value="">-</option>${(FOUNDRY.character||[]).map(ch=>
        `<option value="${ch.id}" ${((TREE.cast||{})[(sc.cast_present||[])[i]]||{}).foundry===ch.id||(((TREE.cast||{})[(sc.cast_present||[])[i]]||{}).name||"").toLowerCase()===ch.name.toLowerCase()?"selected":""}>${esc(ch.name)}</option>`).join("")}</select></div>`).join("")}
      <button class="small" onclick="genCoverage()">generate coverage</button>
    </div>
    <div class="hint">the wide (empty), the wide with the cast (a two-shot when there are two), a medium on each,
      an insert on the detail plate. Character shots get composed anchors; every anchor is checked against
      its prose. The actions are left as your blanks.</div>
    ${sc.anchor?`<img class="anchor" src="${m(sc.anchor)}?${Date.now()}">`:'<div class="hint" style="margin-top:8px">no anchor yet - shots default to it, so generate one first</div>'}
    ${(sc.anchor_candidates||[]).length?`<label>candidates - click to make it THE anchor (identity into a new scene is a seed lottery; the picker is the answer)</label>
      <div class="row">${sc.anchor_candidates.map(c=>
        `<img src="${m(c)}?${Date.now()}" style="width:31%;border-radius:5px;cursor:pointer;border:2px solid ${'${'}sc.anchor&&0?'x':'transparent'}"
              onclick="pickAnchor('${c}')" title="${c}">`).join("")}</div>`:""}`;
}
function applyLoc(id){
  const l=(LIBS.locations||[]).find(x=>x.id===id); if(!l) return;
  $("#c_location").value=l.description||""; $("#c_amb").value=l.ambience||"";
  $("#c_palette").value=l.palette||"";
  if(l.time_of_day) $("#c_tod").value=l.time_of_day;
}
function coveragePlates(){
  const pid=(document.getElementById("cv_place")||{}).value;
  const p=(FOUNDRY.place||[]).find(x=>x.id===pid); const sel=document.getElementById("cv_plate");
  if(!sel) return;
  sel.innerHTML=((p&&p.plates)||[]).map(f=>`<option value="${f.replace(/\.png$/,"")}">${f.replace(/\.png$/,"")}</option>`).join("");
  const sc=(TREE.scenes||[]).find(s=>s.id===SCENE_SEL)||{};
  const keep=sc.place===pid&&sc.plate&&[...sel.options].some(o=>o.value===sc.plate);
  if(keep){ sel.value=sc.plate; return; }
  const w=[...sel.options].find(o=>/_wide$/.test(o.value)); if(w) sel.value=w.value;
}
async function genCoverage(){
  const casts=[...document.querySelectorAll(".cv_cast")].map(x=>x.value);
  const packs=[...document.querySelectorAll(".cv_pack")].map(x=>x.value);
  const characters=casts.map((c,i)=>({cast:c,foundry:packs[i]})).filter(x=>x.cast&&x.foundry);
  const j=await api("/coverage",{film:FID,scene:SCENE_SEL,place:document.getElementById("cv_place").value,
    plate:document.getElementById("cv_plate").value,prop:document.getElementById("cv_prop").value,characters});
  WATCH.add(j.job); note("coverage: "+j.job);
}
async function saveScene(){
  await api("/editscene",{film:FID,scene:SCENE_SEL,
    title:$("#c_title").value, location:$("#c_location").value,
    time_of_day:$("#c_tod").value, weather:$("#c_weather").value,
    ambience:$("#c_amb").value, palette:$("#c_palette").value,
    music:$("#c_music").value,
    cast_present:[...document.querySelectorAll(".sc_cast:checked")].map(x=>x.value),
    no_people:$("#c_np").checked,
    place:(document.getElementById("cv_place")||{}).value||"",
    plate:(document.getElementById("cv_plate")||{}).value||""});
  note("scene saved"); openFilm(FID);
}
async function pickAnchor(c){
  await api("/editscene",{film:FID,scene:SCENE_SEL,anchor:c});
  note("anchor set from candidate"); openFilm(FID);
}
async function genAnchor(){
  const j=await api("/anchor",{film:FID,scene:SCENE_SEL});
  WATCH.add(j.job); note("anchor job "+j.job);
}

function filmForm(){
  const cast=Object.entries(TREE.cast||{}).map(([id,c])=>`
    <div class="cast" data-id="${id}">
      <div class="row"><b>${id}</b>
        ${c.portrait?`<img src="${m(c.portrait)}" style="width:34px;height:46px;object-fit:cover;border-radius:4px">`:""}
        <button class="small" onclick="genPortrait('${id}')" title="render the identity portrait the photoreal keyframe route hangs on">${c.portrait?"re-":""}portrait</button>
        <span class="grow"></span>
        <button class="small" onclick="rmCast('${id}')" style="color:var(--bad)">remove</button></div>
      <label>name</label><input class="f_name" value="${esc(c.name)}" style="width:100%">
      <label>appearance clause (used at first mention)</label>
      <textarea class="f_clause" rows="2">${esc(c.clause)}</textarea>
      <label>short (re-identification: "the same ...")</label>
      <input class="f_short" value="${esc(c.short)}" style="width:100%">
      <div class="row">
        <div class="grow"><label>sheet (anime identity)</label><input class="f_sheet" value="${esc(c.sheet||"")}" style="width:100%"></div>
        <div><label>voice pack</label><select class="f_voice"><option value=""></option>
          ${(LIBS.voices||[]).map(v=>`<option value="${v.id}" ${v.id===c.voice?"selected":""}>${esc(v.name)}</option>`).join("")}</select></div>
      </div>
      <label>voice description (in-prompt: "says in ...")</label>
      <input class="f_vdesc" value="${esc(c.voice_desc||"")}" style="width:100%">
    </div>`).join("");
  return `
    <h2>Film</h2>
    <label>title</label><input id="f_title" value="${esc(TREE.title)}" style="width:100%">
    <label>logline</label><textarea id="f_logline" rows="2">${esc(TREE.logline||"")}</textarea>
    <div class="row" style="gap:8px">
      <div><label>look</label><select id="f_look">${opt(["photoreal","anime"],TREE.look)}</select></div>
      <div><label>resolution</label><select id="f_res">${opt(["auto","720p","1080p","max"],TREE.resolution||"auto")}</select></div>
    </div>
    <div class="hint">resolution is bound by shot length on this box: <b>max</b> (2.0 MP) holds to 8s,
      <b>1080p</b> (1.5 MP) to 12s, <b>720p</b> (0.9 MP) to 30s; <b>auto</b> takes the biggest each
      shot's length allows. A shot too long for the target still renders, softer, and says so.</div>
    <label>look clause (the style sentence every prompt carries)</label>
    <textarea id="f_lookclause" rows="2">${esc(TREE.look_clause||"")}</textarea>
    <label>grade</label><input id="f_grade" value="${esc(TREE.grade||"")}" style="width:100%">
    <label>extra negative</label><input id="f_neg" value="${esc(TREE.negative||"")}" style="width:100%">
    <div class="row" style="margin-top:10px;justify-content:flex-end">
      <button class="small" onclick="deleteFilm()" style="color:var(--bad)">delete this film</button>
      <span class="hint" style="margin-left:8px">moves it to the trash folder; nothing is destroyed</span>
    </div>
    <h2>Cast <span class="hint">(id is what beats reference)</span></h2>
    ${cast||'<div class="hint">none yet</div>'}
    <div class="row">
      <input id="f_newcast" placeholder="new cast id e.g. COOK" style="width:130px">
      <select id="f_fromchar"><option value="">from character…</option>
        ${(LIBS.characters||[]).map(c=>`<option value="${c.id}">${esc(c.name||c.id)}</option>`).join("")}</select>
      <button class="small" onclick="addCast()">add</button>
    </div>
    <div class="row" style="margin-top:10px"><button class="primary" onclick="saveFilm()">save film</button></div>`;
}
function readCast(){
  const out={};
  document.querySelectorAll(".cast").forEach(el=>{
    out[el.dataset.id]={portrait:(TREE.cast[el.dataset.id]||{}).portrait||"",
      name:el.querySelector(".f_name").value,
      clause:el.querySelector(".f_clause").value, short:el.querySelector(".f_short").value,
      sheet:el.querySelector(".f_sheet").value, voice:el.querySelector(".f_voice").value,
      voice_desc:el.querySelector(".f_vdesc").value};
  });
  return out;
}
async function loadTriage(){
  // what this box can make as asked, what it makes with a stated compromise,
  // and what wants an API - per shot, in words
  const box=document.getElementById("triage_box"); if(!box) return;
  try{
    const t=await api("/triage",{film:FID});
    const c=t.counts||{};
    const words={"local":"ready to make here","trade-off":"will differ from what was asked","api":"needs an outside service"};
    let out=`<div style="margin-top:4px"><b>what this computer can make</b> &nbsp;
      <span style="color:var(--good)">${c.local||0} ready</span> &middot;
      <span style="color:var(--warn,#d9a441)">${c["trade-off"]||0} will differ from what was asked</span> &middot;
      <span style="color:var(--bad,#e05a5a)">${c.api||0} need an outside service</span></div>`;
    const flagged=Object.entries(t.shots||{}).filter(([,tr])=>tr.verdict!=="local");
    // the picked takes' own verdicts, per shot, in the words they were written
    const fixes=[];
    for(const sc of (TREE.scenes||[])) for(const s of (sc.shots||[])){
      if(!s.picked||!s.picked_qc) continue;
      try{ const d=await api(`/${FID}/shot/${s.id}`); const tk=(d.shot.takes||[]).find(t=>t.id===d.shot.picked);
        if(tk&&(tk.qc||[]).length) fixes.push([s.id,tk.qc]); }catch(e){}
    }
    if(fixes.length){
      out+=`<div style="margin-top:8px"><b>what to fix</b> <span class="hint">- what the picked takes say about themselves; bright lines are faults, dim lines are information (the take ended closer than it started, borrowed its sound, or a word was not in its picture)</span></div>`;
      for(const [id,qc] of fixes){
        out+=`<div style="margin-top:4px"><span class="badge" onclick="selShot('${id}')" style="cursor:pointer">${id}</span>
          <ul class="hint" style="margin:2px 0 0 14px;padding:0">${qc.filter(q=>!/^(ends closer|sound borrowed|words not in the picture|camera:|identity:)/.test(String(q))).map(q=>`<li>${esc(String(q))}</li>`).join("")}${qc.filter(q=>/^(ends closer|sound borrowed|words not in the picture|camera:|identity:)/.test(String(q))).map(q=>`<li style="opacity:.6">${esc(String(q))} <span style="opacity:.8">(information)</span></li>`).join("")}</ul></div>`;
      }
    }
    if(!flagged.length&&!fixes.length) out+=`<div class="hint">every shot can be made here as asked, and no picked take reports a fault</div>`;
    else if(!flagged.length) out+=`<div class="hint">every shot can be made here as asked</div>`;
    for(const [id,tr] of flagged){
      out+=`<div style="margin-top:6px"><span class="badge" onclick="selShot('${id}')" style="cursor:pointer">${id}</span>
        <b style="color:${tr.verdict==="api"?"var(--bad,#e05a5a)":"var(--warn,#d9a441)"}">${words[tr.verdict]||tr.verdict}</b>
        <ul class="hint" style="margin:2px 0 0 14px;padding:0">${tr.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`;
    }
    box.innerHTML=out;
  }catch(e){ box.innerHTML=`<div class="hint">triage unavailable: ${esc(String(e))}</div>`; }
}
async function deleteFilm(){
  if(!confirm(`Delete the film "${TREE.title}"? It moves to the trash folder and can be brought back.`)) return;
  const j=await api("/deletefilm",{film:FID});
  if(j&&j.ok){ note("film moved to the trash"); FID=null; TREE=null; await loadFilms(); location.href="/film"; }
  else note("could not delete: "+((j||{}).error||"unknown"),true);
}
async function saveFilm(){
  await api("/edit",{film:FID,title:$("#f_title").value,logline:$("#f_logline").value,
    look:$("#f_look").value,look_clause:$("#f_lookclause").value,
    resolution:$("#f_res").value,
    grade:$("#f_grade").value,negative:$("#f_neg").value,cast:readCast()});
  note("film saved"); openFilm(FID);
}
function addCast(){
  const id=($("#f_newcast").value.trim()||$("#f_fromchar").value||"").toUpperCase();
  if(!id) return;
  TREE.cast=TREE.cast||{};
  const ch=(LIBS.characters||[]).find(c=>c.id===$("#f_fromchar").value)||{};
  TREE.cast[id]=Object.assign({name:ch.name||id.toLowerCase(),clause:ch.desc||"",short:"",
    sheet:ch.sheet||"",voice:"",voice_desc:""},readCast()[id]||{});
  renderRight();
}
function rmCast(id){ TREE.cast=readCast(); delete TREE.cast[id]; renderRight(); }

/* ── jobs ────────────────────────────────────────────────────────────────── */
async function pollJobs(){
  try{
    const j=await api("/jobs");
    const running=j.jobs.filter(x=>x.state==="running");
    for(const job of j.jobs){
      if(WATCH.has(job.id)&&job.state!=="running"){
        WATCH.delete(job.id);
        note(`${job.kind} ${job.state}${job.error?": "+job.error:""}`, job.state==="failed");
        await openFilm(FID);
        if(SHOT) await selShot(SHOT);
      }
    }
    if(running.length){
      const r=running[0];
      note(`${r.kind} ${r.done}/${r.total} ${r.log&&r.log.length?"· "+r.log[r.log.length-1]:""}`);
    }
  }catch(e){}
  setTimeout(pollJobs,2500);
}
(async()=>{ const q=new URLSearchParams(location.search);
  await loadFilms(q.get("film")||"");
  if(q.get("film")){ try{ await openFilm(q.get("film")); if(q.get("shot")) await selShot(q.get("shot")); }catch(e){ note("could not open "+q.get("film"), true); } }
})(); pollJobs();
</script>
