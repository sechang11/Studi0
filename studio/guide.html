<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>guide</title>
<style>
  :root{--bg:#0f1115;--panel:#161a21;--panel2:#1c2129;--line:#272d38;--ink:#e6e9ef;
        --dim:#8b94a3;--accent:#6ea8fe;--ok:#4ec9a0;--warn:#e0b252;--bad:#e07a5f}
  @media (prefers-color-scheme:light){
    :root{--bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#dde1e8;--ink:#141821;--dim:#5d6470}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:13px 18px;
         border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:9}
  header h1{margin:0;font-size:15px;letter-spacing:.07em;text-transform:uppercase}
  header h1 a{color:inherit}
  header .sub{color:var(--dim);font-size:12px}
  header .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  header .right a{color:var(--dim);font-size:12px;border:1px solid var(--line);
           padding:5px 10px;border-radius:6px}
  header .right a:hover{color:var(--ink);border-color:var(--accent);text-decoration:none}

  .wrap{max-width:1180px;margin:0 auto;padding:0 18px 70px;display:flex;gap:30px;
        align-items:flex-start}

  /* the contents rail. sticky so you never lose your place in a 900-word guide */
  nav.toc{flex:0 0 232px;position:sticky;top:64px;padding:22px 0 0}
  nav.toc h2{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
             margin:0 0 9px;font-weight:600}
  nav.toc h2+h2{margin-top:22px}
  nav.toc a{display:block;padding:5px 9px;border-radius:7px;color:var(--ink);font-size:13px;
            border-left:3px solid transparent}
  nav.toc a:hover{background:var(--panel);text-decoration:none}
  nav.toc a.on{background:var(--panel);border-left-color:var(--accent);font-weight:600}
  nav.toc a small{display:block;color:var(--dim);font-size:11px;font-weight:400;line-height:1.35}

  main{flex:1 1 0;min-width:0;padding-top:22px;max-width:78ch}
  main h1{font-size:27px;letter-spacing:-.01em;margin:0 0 6px}
  main .blurb{color:var(--dim);font-size:14.5px;margin:0 0 26px}
  main h2{font-size:19px;margin:34px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
  main h2:first-of-type{border-top:0;padding-top:0}
  main h3{font-size:15.5px;margin:24px 0 6px}
  main p{margin:11px 0}
  main ul,main ol{margin:11px 0;padding-left:22px}
  main li{margin:5px 0}
  main li>ul{margin:6px 0 8px;padding-left:19px}
  main li>ul>li{margin:3px 0}
  main code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;
            padding:1px 5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  main pre{background:var(--panel);border:1px solid var(--line);border-radius:9px;
           padding:13px 15px;overflow-x:auto;margin:14px 0}
  main pre code{background:none;border:0;padding:0;font-size:12.5px;line-height:1.5}
  main blockquote{margin:14px 0;padding:10px 16px;border-left:3px solid var(--accent);
                  background:var(--panel);border-radius:0 9px 9px 0;color:var(--ink)}
  main hr{border:0;border-top:1px solid var(--line);margin:30px 0}
  /* a wide table scrolls inside itself; the page never scrolls sideways */
  .tw{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:9px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:var(--panel);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
     color:var(--dim);font-weight:600}
  tbody tr:last-child td{border-bottom:0}

  .pager{display:flex;gap:10px;margin:40px 0 0;flex-wrap:wrap}
  .pager a{flex:1 1 220px;background:var(--panel);border:1px solid var(--line);
           border-radius:10px;padding:12px 15px;color:var(--ink)}
  .pager a:hover{border-color:var(--accent);text-decoration:none}
  .pager span{display:block;color:var(--dim);font-size:11px;letter-spacing:.06em;
              text-transform:uppercase}

  /* the index, shown at /guide with no slug */
  .cards{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));
         margin:22px 0 0}
  .cards a{background:var(--panel);border:1px solid var(--line);border-radius:11px;
           padding:15px 16px;color:var(--ink);display:block}
  .cards a:hover{border-color:var(--accent);text-decoration:none}
  .cards h3{margin:0 0 4px;font-size:15.5px}
  .cards p{margin:0;color:var(--dim);font-size:12.5px}
  .lead{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:20px 22px;margin-top:24px}
  .lead h2{border:0;padding:0;margin:0 0 6px;font-size:20px}
  .lead p{margin:0;color:var(--dim);max-width:66ch}
  .lead .go{display:inline-block;margin-top:14px;background:var(--accent);color:#08101f;
            border-radius:9px;padding:9px 17px;font-weight:600}
  .lead .go:hover{filter:brightness(1.08);text-decoration:none}
  .lead .go.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
                margin-left:8px;font-weight:500}
  .err{color:var(--warn)}
  @media (max-width:820px){ .wrap{display:block} nav.toc{position:static;flex:none;
        padding-bottom:14px;border-bottom:1px solid var(--line)} main{max-width:none} }
</style>
</head>
<body>
<header>
  <h1><a href="/guide">guide</a></h1>
  <span class="sub" id="sub">how this studio works</span>
  <div class="right">
    <a href="/">Library</a>
    <a href="/wizard">Direct a scene</a>
    <a href="/styles">Styles</a>
    <a href="/cast">Cast</a><a href="/voices">Voices</a><a href="/character/new">New character</a>
    <a href="/make">Make</a>
    <a href="/story">Story editor</a><a href="/gallery">Gallery</a><a href="/generate">Fill the library</a><a href="/docs">Docs</a>
  </div>
</header>

<div class="wrap">
  <nav class="toc" id="toc"></nav>
  <main id="doc"><p class="sub">loading…</p></main>
</div>

<script>
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const J = async u => { const r = await fetch(u); if(!r.ok) throw new Error(u+" "+r.status);
                       return r.json(); };

// The slug is read from the path, not from a query string, so /guide/wizard is a real
// URL somebody can paste. /guide with nothing after it is the index.
const slug = (location.pathname.replace(/^\/guide\/?/, "").replace(/\/+$/, "") || "");

function toc(list, cur){
  const start = list.slice(0,2), rest = list.slice(2);
  const item = g => `<a href="/guide/${esc(g.slug)}" class="${g.slug===cur?"on":""}">
      ${esc(g.title)}<small>${esc(g.blurb||"")}</small></a>`;
  return `<h2>Start here</h2>${start.map(item).join("")}
          <h2>One per section</h2>${rest.map(item).join("")}`;
}

(async function(){
  let idx;
  try { idx = await J("/api/guides"); }
  catch(e){
    document.getElementById("doc").innerHTML =
      '<p class="err">the guide index is unavailable ('+esc(e.message)+')</p>';
    return;
  }
  const list = idx.guides || [];
  document.getElementById("toc").innerHTML = toc(list, slug);

  if(!slug){
    document.title = "guide";
    document.getElementById("sub").textContent = list.length + " guides";
    document.getElementById("doc").innerHTML = `
      <h1>Guides</h1>
      <p class="blurb">Plain-language notes on every part of this studio. Each one answers
         the same four questions: what is this for, what do you do first, what will
         confuse you, and what does good output look like here.</p>
      <div class="lead">
        <h2>New here?</h2>
        <p>Two guides carry everything else. <b>Getting started</b> is the shortest route
           from opening the app to a finished thing, naming the actual buttons. <b>The
           mental model</b> is the five ideas nobody can guess from the screen — and
           every page in this app assumes you already have them.</p>
        <a class="go" href="/guide/getting-started">Getting started &rarr;</a>
        <a class="go alt" href="/guide/mental-model">The mental model</a>
      </div>
      <h2>Every guide</h2>
      <div class="cards">${list.map(g=>`<a href="/guide/${esc(g.slug)}">
        <h3>${esc(g.title)}</h3><p>${esc(g.blurb||"")}</p></a>`).join("")}</div>`;
    return;
  }

  let g;
  try { g = await J("/api/guide/" + encodeURIComponent(slug)); }
  catch(e){
    document.getElementById("doc").innerHTML =
      '<h1>Not found</h1><p class="err">There is no guide called <code>'+esc(slug)+
      '</code>.</p><p><a href="/guide">Back to the guides</a></p>';
    return;
  }
  document.title = g.title + " · guide";
  document.getElementById("sub").textContent = g.blurb || "";
  // g.html is built server-side by studio/_tools/guides.py, which escapes the markdown
  // before it formats it - so nothing in a guide file can inject markup here.
  const pager = [];
  if(g.prev) pager.push(`<a href="/guide/${esc(g.prev.slug)}"><span>&larr; previous</span>
                          ${esc(g.prev.title)}</a>`);
  if(g.next) pager.push(`<a href="/guide/${esc(g.next.slug)}"><span>next &rarr;</span>
                          ${esc(g.next.title)}</a>`);
  document.getElementById("doc").innerHTML =
    g.html + (pager.length?`<div class="pager">${pager.join("")}</div>`:"");
})();
</script>
</body>
</html>
